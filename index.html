t-stimuli-2026-07-xx/piece-07xb-repeat-q3.webp"}, {"en": "Press and fold repeatedly until the texture feels elastic.", "zh": "反复按压和折叠，直到质地感觉有弹性。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-07xb-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xb-repeat-q4.webp"}, {"en": "Let the dough rest in a warm place until it doubles in size.", "zh": "将面团放在温暖的地方静置，直到体积增大一倍。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-07xb-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xb-repeat-q5.webp"}, {"en": "After the loaf rises, bake until the top is browned and the center is firm.", "zh": "面包膨胀后，烘烤至顶部呈棕色且中心变硬。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-07xb-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xb-repeat-q6.webp"}, {"en": "When the bread is done, place it on a raised stand, so airflow beneath can cool it down.", "zh": "面包烤好后，放在高架上，以便底部空气流通冷却。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-07xb-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xb-repeat-q7.webp"}]}, {"id": "mock-68", "n": 68, "en": "Cooking Class", "zh": "烹饪课", "scenario": "You are helping students learn basic kitchen skills in a cooking class. Listen to the instructor and repeat what the instructor says. Repeat only once.", "cats": [0], "items": [{"en": "Begin by washing the vegetables.", "zh": "首先清洗蔬菜。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-07xa-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xa-repeat-q1.webp"}, {"en": "Carefully chop the salad ingredients.", "zh": "仔细切好沙拉配料。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-07xa-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xa-repeat-q2.webp"}, {"en": "Collect the chopped vegetables and place them together.", "zh": "收集切好的蔬菜，把它们放在一起。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-07xa-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xa-repeat-q3.webp"}, {"en": "Slowly add the dressing so that the salad does not get soggy.", "zh": "慢慢加入调味汁，以免沙拉变软烂。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-07xa-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xa-repeat-q4.webp"}, {"en": "Toss everything together thoroughly so the flavors are mixed.", "zh": "充分搅拌所有食材，使味道混合均匀。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-07xa-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xa-repeat-q5.webp"}, {"en": "Put any leftovers in a food container and place them in the refrigerator later.", "zh": "将剩余食物放入食品容器，稍后置于冰箱中。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-07xa-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xa-repeat-q6.webp"}, {"en": "When you have finished, be sure to clean up, so the kitchen stays neat and clean.", "zh": "完成后，请务必清理干净，保持厨房整洁。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-07xa-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xa-repeat-q7.webp"}]}, {"id": "mock-69", "n": 69, "en": "Course Registration", "zh": "课程注册", "scenario": "You are learning how to register for university courses online. An advisor is explaining the course registration process. Listen to the advisor and repeat what the advisor says. Repeat only once.", "cats": [1], "items": [{"en": "Start by browsing the catalog for classes.", "zh": "先浏览课程目录，寻找课程。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0808d-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260808/piece-0808d-repeat-q1.webp"}, {"en": "Check your registration details often.", "zh": "经常核对你的注册信息。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0808d-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260808/piece-0808d-repeat-q2.webp"}, {"en": "Use the schedule planner to organize your selections.", "zh": "使用课表规划工具整理你的课程选择。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0808d-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260808/piece-0808d-repeat-q3.webp"}, {"en": "Payment options are listed under the finance section.", "zh": "付款选项列在财务栏目下。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0808d-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260808/piece-0808d-repeat-q4.webp"}, {"en": "Contact the help desk if you encounter any issues.", "zh": "如果遇到任何问题，请联系服务台。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0808d-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260808/piece-0808d-repeat-q5.webp"}, {"en": "Review all your selected courses before making any final decisions.", "zh": "做出最终决定前，请检查所有已选课程。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0808d-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260808/piece-0808d-repeat-q6.webp"}, {"en": "Once everything is complete, be sure to download your registration summary.", "zh": "全部完成后，务必下载你的选课注册摘要。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0808d-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260808/piece-0808d-repeat-q7.webp"}]}, {"id": "mock-70", "n": 70, "en": "", "zh": "", "scenario": "You are volunteering at a campus garden. The garden coordinator is training you to guide visitors and help maintain the garden. Listen to the coordinator and repeat what the coordinator says. Repeat only once.", "cats": [], "items": [{"en": "Water the trees daily to help them grow.", "zh": "每天给树浇水以帮助它们生长。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr04-repeat-q1.webp"}, {"en": "Add nutrients to the soil in the flower bed.", "zh": "为花坛里的土壤添加养分。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr04-repeat-q2.webp"}, {"en": "Manage temperature and humidity inside the greenhouse.", "zh": "管理温室内的温度和湿度。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr04-repeat-q3.webp"}, {"en": "Do not use chemicals near the pond to protect the creatures there.", "zh": "不要在池塘附近使用化学物质，以保护那里的生物。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr04-repeat-q4.webp"}, {"en": "Put organic waste in the compost pile to create rich soil.", "zh": "将有机废弃物放入堆肥堆中，以制作肥沃的土壤。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr04-repeat-q5.webp"}, {"en": "After you finish gardening, put the tools in the shed so others can use them.", "zh": "园艺活动结束后，将工具放入棚屋，以便其他人使用。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr04-repeat-q6.webp"}, {"en": "When guests arrive, show them to the visitor center so they can learn about the garden.", "zh": "当客人到达时，将他们带到游客中心，以便他们了解花园。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr04-repeat-q7.webp"}]}, {"id": "supplement-gardening", "n": null, "en": "Gardening", "zh": "园艺养护", "scenario": "", "cats": ["supplement"], "items": [{"en": "Water the trees daily to help them grow.", "zh": "每天给树浇水，帮助它们生长。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q1.m4a", "img": ""}, {"en": "Add nutrients to the flower bed dirt.", "zh": "在花坛土壤中添加养分。", "audio": "", "img": ""}, {"en": "Manage temperature and humidity inside the greenhouse.", "zh": "调节温室内的温度和湿度。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q3.m4a", "img": ""}, {"en": "Do not use chemicals near the pond to protect the creatures there.", "zh": "不要在池塘附近使用化学品，以保护那里的生物。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q4.m4a", "img": ""}, {"en": "Recycle waste in the compost pile to create rich soil.", "zh": "把废弃物放入堆肥堆循环利用，制成肥沃土壤。", "audio": "", "img": ""}, {"en": "After you finish gardening, put the tools in the shed so others can use them.", "zh": "完成园艺后，把工具放回工具棚，让其他人也能使用。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-04xx-lr04-speaking-q6.m4a", "img": ""}, {"en": "When guests arrive, show them to the visitor center to learn about the garden.", "zh": "客人到达时，引导他们前往游客中心了解花园。", "audio": "", "img": ""}]}, {"id": "supplement-watercolor-painting", "n": null, "en": "Watercolor Painting", "zh": "水彩画", "scenario": "", "cats": ["supplement"], "items": [{"en": "Lightly wet your brush before starting to paint.", "zh": "开始画画前，先轻轻润湿画笔。", "audio": "", "img": ""}, {"en": "Add a small bit of color to your brush.", "zh": "在画笔上蘸取少量颜料。", "audio": "", "img": ""}, {"en": "Mix two or more paints to create additional colors.", "zh": "混合两种或更多颜料，调出更多颜色。", "audio": "", "img": ""}, {"en": "Apply thin layers to keep the paper from tearing.", "zh": "薄薄地涂上颜料，以免纸张撕裂。", "audio": "", "img": ""}, {"en": "Use a smaller brush to add fine details to the picture.", "zh": "用较小的画笔为画面添加精细细节。", "audio": "", "img": ""}, {"en": "If a section looks too wet, blot it gently to pick up any excess paint.", "zh": "如果某一部分太湿，轻轻吸干多余的颜料。", "audio": "", "img": ""}, {"en": "When the painting is finished, blow warm air on it before moving or storing it.", "zh": "画完成后，在移动或存放前用暖风将它吹干。", "audio": "", "img": ""}]}, {"id": "supplement-travel-agency", "n": null, "en": "Travel Agency", "zh": "旅行社介绍", "scenario": "", "cats": ["supplement"], "items": [{"en": "Welcome to the travel agency.", "zh": "欢迎来到旅行社。", "audio": "", "img": ""}, {"en": "We offer travel packages for many destinations.", "zh": "我们为许多目的地提供旅行套餐。", "audio": "", "img": ""}, {"en": "You can ask about flights, hotels, and tour plans.", "zh": "你可以咨询航班、酒店和旅行计划。", "audio": "", "img": ""}, {"en": "Our staff can help you choose the best option.", "zh": "我们的工作人员可以帮助你选择最佳方案。", "audio": "", "img": ""}, {"en": "Please provide your travel dates when booking a trip.", "zh": "预订旅行时，请提供你的出行日期。", "audio": "", "img": ""}, {"en": "Some packages include transportation and guided tours.", "zh": "有些套餐包含交通和导游服务。", "audio": "", "img": ""}, {"en": "For more details, speak with an agent at the desk.", "zh": "如需更多详情，请咨询柜台的旅行顾问。", "audio": "", "img": ""}]}, {"id": "supplement-sewing-a-button", "n": null, "en": "Sewing a Button", "zh": "缝纽扣", "scenario": "", "cats": ["supplement"], "items": [{"en": "First, thread the needle and tie a knot.", "zh": "首先穿好针线并打一个结。", "audio": "", "img": ""}, {"en": "Position the button on the fabric.", "zh": "把纽扣放在布料的正确位置。", "audio": "", "img": ""}, {"en": "Push the needle gently through the fabric and button.", "zh": "轻轻将针穿过布料和纽扣。", "audio": "", "img": ""}, {"en": "Sew tightly through each of the holes between 3 and 5 times.", "zh": "在每个纽扣孔中紧密缝过三到五次。", "audio": "", "img": ""}, {"en": "Tie a strong knot at the back to firmly secure your work.", "zh": "在背面打一个牢固的结，固定好缝制成果。", "audio": "", "img": ""}, {"en": "Cut any extra thread, then repeat the same steps if there are other buttons.", "zh": "剪掉多余线头；如果还有其他纽扣，就重复相同步骤。", "audio": "", "img": ""}, {"en": "If your fingers are sensitive, use a thimble for protection while sewing.", "zh": "如果手指容易不适，缝纫时请使用顶针保护。", "audio": "", "img": ""}]}, {"id": "supplement-woodworking-steps", "n": null, "en": "Woodworking Steps", "zh": "木工操作", "scenario": "You are an art student assisting your professor in a community woodworking class. Your professor is training you to show others how to complete simple woodworking steps. Listen to the instructor and repeat what the instructor says. Repeat only once.", "cats": ["supplement"], "items": [{"en": "Measure carefully to avoid mistakes.", "zh": "仔细测量，避免出错。", "audio": "", "img": ""}, {"en": "Draw a line with a pencil before cutting.", "zh": "切割前先用铅笔画一条线。", "audio": "", "img": ""}, {"en": "Tap nails gently with a hammer so that the wood will not crack.", "zh": "用锤子轻轻敲钉子，以免木材开裂。", "audio": "", "img": ""}, {"en": "Hold the workpiece firmly in place while cutting to prevent accidents.", "zh": "切割时牢牢固定工件，防止发生意外。", "audio": "", "img": ""}, {"en": "Polish the surface evenly until the board feels smooth.", "zh": "均匀打磨表面，直到木板摸起来光滑。", "audio": "", "img": ""}, {"en": "Keep the tool straight when drilling wood to create neat and smooth holes.", "zh": "钻木头时保持工具笔直，钻出整齐光滑的孔。", "audio": "", "img": ""}, {"en": "Wear safety glasses for protection when using saws or heavy equipment.", "zh": "使用锯子或重型设备时，戴上护目镜保护自己。", "audio": "", "img": ""}]}, {"id": "supplement-building-a-birdhouse", "n": null, "en": "Building a Birdhouse", "zh": "制作鸟屋", "scenario": "You are volunteering at a community workshop near campus. The leader is training you to guide schoolchildren in building a simple birdhouse. Listen to the leader and repeat what the leader says. Repeat only once.", "cats": ["supplement"], "items": [{"en": "Measure each piece carefully before you cut.", "zh": "切割前，仔细测量每一块材料。", "audio": "", "img": ""}, {"en": "Saw slowly to keep the line smooth and straight.", "zh": "慢慢锯，使切线保持平滑笔直。", "audio": "", "img": ""}, {"en": "Lightly sand the edges until they all feel smooth and clean.", "zh": "轻轻打磨边缘，直到所有边缘都光滑干净。", "audio": "", "img": ""}, {"en": "Make a round hole that the bird will use as the entrance to the house.", "zh": "做一个圆孔，供鸟儿作为鸟屋入口使用。", "audio": "", "img": ""}, {"en": "Glue each side of the house together and give it some time to dry.", "zh": "将鸟屋各侧粘在一起，并留出时间晾干。", "audio": "", "img": ""}, {"en": "To attach the roof, hammer the nails in gently so the wood doesn't split or crack.", "zh": "安装屋顶时，轻轻钉入钉子，以免木材劈裂或开裂。", "audio": "", "img": ""}, {"en": "To protect the birdhouse from weather, seal it well so it will last for years.", "zh": "为保护鸟屋免受天气影响，要密封好它，使其能使用多年。", "audio": "", "img": ""}]}, {"id": "supplement-making-a-smoothie", "n": null, "en": "Making a Smoothie", "zh": "制作奶昔", "scenario": "", "cats": ["supplement"], "items": [{"en": "Peel and slice a banana to add natural sweetness.", "zh": "剥开并切片一根香蕉，增添天然甜味。", "audio": "", "img": ""}, {"en": "Add fruits that vary in color to increase vitamins.", "zh": "加入颜色不同的水果，增加维生素。", "audio": "", "img": ""}, {"en": "You can add flavored yogurt for additional taste.", "zh": "你可以加入调味酸奶，增添风味。", "audio": "", "img": ""}, {"en": "Slowly add milk until you reach the desired consistency.", "zh": "慢慢加入牛奶，直到达到理想的浓稠度。", "audio": "", "img": ""}, {"en": "Blend until no chunks remain and everything is mixed evenly.", "zh": "搅拌至没有块状物，所有材料混合均匀。", "audio": "", "img": ""}, {"en": "Optionally, add a few pieces of ice for a colder drink.", "zh": "如果喜欢更冰凉的饮品，可以加入几块冰。", "audio": "", "img": ""}, {"en": "Once everything looks ready, pour the smoothie into a chilled glass and serve.", "zh": "一切准备好后，将奶昔倒入冰镇杯中即可享用。", "audio": "", "img": ""}]}, {"id": "supplement-office-equipment", "n": null, "en": "Office Equipment", "zh": "办公室设备", "scenario": "You have volunteered to provide help in a student resource room. The manager is training you to help students use office equipment. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": ["supplement"], "items": [{"en": "Print with various paper sizes.", "zh": "可使用多种纸张尺寸进行打印。", "audio": "", "img": ""}, {"en": "You can make numerous copies quickly.", "zh": "你可以快速复印大量副本。", "audio": "", "img": ""}, {"en": "The scanner converts documents into digital files.", "zh": "扫描仪可将文件转换为数字文件。", "audio": "", "img": ""}, {"en": "The fax machine can send pages quickly over phone lines.", "zh": "传真机可以通过电话线快速发送页面。", "audio": "", "img": ""}, {"en": "The shredder securely destroys sensitive information.", "zh": "碎纸机可以安全地销毁敏感信息。", "audio": "", "img": ""}, {"en": "All devices are located in the office for easy use by those who need them.", "zh": "所有设备都位于办公室内，方便有需要的人使用。", "audio": "", "img": ""}, {"en": "When in doubt, read the maintenance instructions that are available for all equipment.", "zh": "如有疑问，请阅读所有设备配备的维护说明。", "audio": "", "img": ""}]}], "interview": [{"id": "mock-1", "n": 1, "en": "Music Preferences", "zh": "音乐偏好", "scenario": "You received an email from your university inviting you to join a research study about music preferences. You have scheduled a short online interview with me to answer a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [3], "items": [{"en": "Thanks for participating in the study. I'd like to ask you a few questions about your music preferences. First, how often do you listen to music? Do you listen daily, weekly, or less often?", "zh": "感谢你参与这项研究。我想问你几个关于音乐偏好的问题。首先，你多久听一次音乐？是每天听、每周听，还是频率更低？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0121a-speaking-q8.m4a"}, {"en": "Thank you. What genres or types of music do you usually enjoy listening to? For example, do you prefer classical, rock, or jazz music? Give details to explain your answer.", "zh": "谢谢你。你通常喜欢听什么流派或类型的音乐？例如，你更喜欢古典乐、摇滚乐还是爵士乐？请详细说明你的回答。", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0121a-speaking-q9.m4a"}, {"en": "I see. Can you tell me about a concert or live music event you would like to attend? Why would you make that particular choice?", "zh": "我明白了。你能告诉我一个你想参加的音乐会或现场音乐活动吗？你为什么做出这个特定的选择？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0121a-speaking-q10.m4a"}, {"en": "Great. Last question. Some people believe that music can have a powerful effect on our emotions and moods. Do you agree or disagree with this viewpoint? Why?", "zh": "很好。最后一个问题。有些人认为音乐能对我们的感情和情绪产生强大的影响。你同意还是不同意这种观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0121a-speaking-q11.m4a"}]}, {"id": "mock-2", "n": 2, "en": "Health & Wellness", "zh": "健康与养生", "scenario": "As part of a university project, you have agreed to take part in a short research interview about health and wellness habits. As the graduate student conducting the research, I will ask you some questions online. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [0], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your health and wellness habits. First, do you have any specific routines or practices you use to maintain your physical well-being? If so, what are they?", "zh": "感谢您同意参与。我想问您一些关于您的健康与保健习惯的问题。首先，您是否有任何特定的日常习惯或做法来保持身体健康？如果有，是什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0121b-speaking-q8.m4a"}, {"en": "Thank you. Can you describe any dietary choices or habits that you follow to stay healthy? Give details to explain your answer.", "zh": "谢谢。您能描述一下您为保持健康而遵循的任何饮食选择或习惯吗？请详细说明您的回答。", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0121b-speaking-q9.m4a"}, {"en": "Interesting. If you could make one significant change to your diet or exercise routine to stay healthy, what would it be? Why would you make that particular choice?", "zh": "有趣。如果您可以对您的饮食或锻炼习惯做出一个重大的改变以保持健康，那会是什么？为什么您会做出这个特定的选择？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0121b-speaking-q10.m4a"}, {"en": "Great. Some people believe that mental health is just as important as physical health and should be given equal attention. Do you agree or disagree with this viewpoint? Why?", "zh": "很好。有些人认为心理健康与身体健康同样重要，应该给予同等的关注。您同意还是不同意这一观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0121b-speaking-q11.m4a"}]}, {"id": "mock-3", "n": 3, "en": "Exercise Programs", "zh": "运动计划", "scenario": "You have volunteered for a research study at your university about exercise programs. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [0], "items": [{"en": "Thank you for joining the study. I'd like to ask you some questions about exercise programs. First, do you think exercising daily is important for good health? Why or why not?", "zh": "感谢你参与这项研究。我想问你一些关于锻炼计划的问题。首先，你认为每天锻炼对保持健康很重要吗？为什么重要或为什么不重要？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0121c-speaking-q8.m4a"}, {"en": "Okay. Imagine you are going to recommend or create an exercise program for a friend or family member who does not currently exercise. What kind of exercise or fitness routine would you recommend, and why?", "zh": "好的。想象一下，你要为一位目前不锻炼的朋友或家人推荐或制定一个锻炼计划。你会推荐什么样的锻炼或健身计划，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0121c-speaking-q9.m4a"}, {"en": "That makes sense. For that same friend or family member, what do you think might challenge them the most about a regular exercise program? How would you help them through this challenge?", "zh": "这很有道理。对于同一位朋友或家人，你认为坚持常规锻炼计划最大的挑战可能是什么？你会如何帮助他们克服这个挑战？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0121c-speaking-q10.m4a"}, {"en": "Good points. Finally, some people believe that it is important to have some sort of reward after a good week of exercising. What do you think would be a good reward for the program you created, and why?", "zh": "说得对。最后，有些人认为在锻炼了一周后，给予某种奖励很重要。你认为对于你制定的计划，什么样的奖励是好的，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0121c-speaking-q11.m4a"}]}, {"id": "mock-4", "n": 4, "en": "Childhood Education", "zh": "童年教育", "scenario": "You have volunteered for a research study at your university about childhood education. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [10], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about childhood education. First, did you enjoy your school experience as a child?", "zh": "感谢您同意参与。我想问您一些关于童年教育的问题。首先，您小时候喜欢学校生活吗？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0127a-speaking-q8.m4a"}, {"en": "Thank you. Tell me about a school project or activity you participated in. What made that project or activity special?", "zh": "谢谢。请告诉我您参与过的一个学校项目或活动。是什么让那个项目或活动显得特别？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0127a-speaking-q9.m4a"}, {"en": "Interesting. Tell me a little about the technology you used during your childhood education. Do you feel like that technology prepared you for life after school? Why or why not?", "zh": "很有趣。请简单谈谈您在童年教育期间使用的技术。您觉得这些技术是否为您离开学校后的生活做好了准备？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0127a-speaking-q10.m4a"}, {"en": "Great. Some people believe that the current education system needs significant changes to better prepare children for the future, focusing more on skills like problem-solving and teamwork instead of mainly teaching facts. Do you agree or disagree with this viewpoint? Why?", "zh": "很好。有些人认为，现行教育体系需要重大改革，以便更好地为孩子的未来做准备，应更侧重于解决问题和团队合作等技能，而不仅仅是教授事实。您是否同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0127a-speaking-q11.m4a"}]}, {"id": "mock-5", "n": 5, "en": "Education Experiences", "zh": "教育经历", "scenario": "You have signed up for a study run by a university research group that is investigating education experiences. You will have a short video interview with me, one of the researchers. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [10], "items": [{"en": "Thanks for joining the interview. I'd like to ask you some questions about your education experiences. First, which do you think is more important for a college: offering a wide variety of courses, or having small class sizes?", "zh": "感谢您参加这次访谈。我想问您一些关于您教育经历的问题。首先，您认为对一所大学而言，提供种类繁多的课程和保持小班教学，哪个更重要？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0127b-speaking-q8.m4a"}, {"en": "Thank you. Imagine that you are preparing for a test. Would you prefer to study by yourself or with a group? What would make you choose one over the other?", "zh": "谢谢。假设您正在为一个考试做准备。您更倾向于自己学习还是与小组一起学习？是什么因素促使您做出这样的选择？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0127b-speaking-q9.m4a"}, {"en": "I see. Some people believe that online courses offer more flexibility and accessibility compared to those offered in traditional classroom settings, and are therefore superior. What are your thoughts on this? Do you agree or disagree? Why?", "zh": "我明白了。有些人认为，与传统课堂环境相比，在线课程提供了更多的灵活性和可及性，因此更优越。您对此有什么看法？您同意还是不同意？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0127b-speaking-q10.m4a"}, {"en": "Finally, online courses are becoming increasingly popular, and there are now full degree programs offered by universities where every class is available online only. Do you think online learning will someday completely replace in-person learning? Explain your thoughts.", "zh": "最后，在线课程正变得越来越受欢迎，现在有些大学提供了完全在线的学位项目。您认为在线学习有朝一日会完全取代面对面学习吗？请阐述您的想法。", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0127b-speaking-q11.m4a"}]}, {"id": "mock-6", "n": 6, "en": "Hobbies", "zh": "爱好", "scenario": "You have volunteered for a research study at your university about hobbies. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [2], "items": [{"en": "Thanks for being willing to help with the study. I'd like to ask you some questions about hobbies. To begin, do you have a hobby or interest that you regularly spend time doing?", "zh": "感谢你愿意参与这项研究。我想问你一些关于爱好的问题。首先，你有什么经常花时间做的爱好或兴趣吗？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0128b-speaking-q8.m4a"}, {"en": "Great. If you were to select a new hobby, what would you choose, and why?", "zh": "很好。如果你要选择一个新爱好，你会选什么，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0128b-speaking-q9.m4a"}, {"en": "Okay. Now, tell me what might prevent you from starting this new pastime.", "zh": "好的。现在，告诉我什么可能会阻止你开始这个新消遣。", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0128b-speaking-q10.m4a"}, {"en": "Last question. Some people believe it is better to have one interest outside of work or school that you dedicate yourself to, rather than multiple smaller ones. What do you think about that, and why?", "zh": "最后一个问题。有些人认为，在工作或学习之外，专注于一个兴趣爱好比培养多个小爱好更好。你怎么看，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0128b-speaking-q11.m4a"}]}, {"id": "mock-7", "n": 7, "en": "Technology in Daily Life", "zh": "日常生活中的科技", "scenario": "You have volunteered for a research study about people's experiences with technology in daily life. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [13], "items": [{"en": "Thanks for joining the study. I'd like to ask you some questions about your experiences with technology and daily life. First, how important is technology in your day-to-day activities?", "zh": "感谢参与这项研究。我想问你一些关于你使用科技和日常生活经历的问题。首先，科技在你的日常活动中有多重要？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0201a-speaking-q8.m4a"}, {"en": "Thank you. Have you ever felt frustrated while using technology? What happened?", "zh": "谢谢。你在使用科技时是否曾经感到沮丧？发生了什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0201a-speaking-q9.m4a"}, {"en": "Next question. Some people believe technology will replace many jobs, while others think it will create more opportunities. What is your opinion, and why?", "zh": "下一个问题。有些人认为科技将取代许多工作，而另一些人则认为它将创造更多机会。你的观点是什么，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0201a-speaking-q10.m4a"}, {"en": "Last question. Some people believe that reliance on technology is reducing our ability to think independently and solve problems. Do you agree or disagree with this belief? Why or why not?", "zh": "最后一个问题。有些人认为对科技的依赖正在削弱我们独立思考和解决问题的能力。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0201a-speaking-q11.m4a"}]}, {"id": "mock-8", "n": 8, "en": "Setting Personal Goals", "zh": "设定个人目标", "scenario": "You have agreed to participate in a research study about people's experiences with setting personal goals. You will have a short online interview with me, and I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [9], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your experiences with setting personal goals. First, think of a time, recent or not, when you had something you wanted to achieve. What was it?", "zh": "感谢你同意参与。我想问你一些关于你设定个人目标经历的问题。首先，想一个最近或不太久以前你想实现某个目标的时候。那是什么目标？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0201b-speaking-q8.m4a"}, {"en": "Thank you. In general, how do you handle difficulties or obstacles that come up while working toward what you want to achieve?", "zh": "谢谢。一般来说，在朝着你想要实现的目标努力时，你如何处理遇到的困难或障碍？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0201b-speaking-q9.m4a"}, {"en": "I see. In your opinion, how important is goal setting for personal growth?", "zh": "我明白了。在你看来，设定目标对个人成长有多重要？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0201b-speaking-q10.m4a"}, {"en": "Finally, do you think children should be taught to set personal goals from an early age? Why or why not?", "zh": "最后，你认为应该从小就教孩子设定个人目标吗？为什么或为什么不？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0201b-speaking-q11.m4a"}]}, {"id": "mock-9", "n": 9, "en": "Entertainment Preferences", "zh": "娱乐偏好", "scenario": "You received an email from your university inviting you to join a research study about entertainment preferences. You have scheduled a short online interview with me to answer a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [4], "items": [{"en": "Thanks for participating in the study. I'd like to ask you some questions about your entertainment preferences. First, what kind of movies do your family or friends generally like to watch? For example, do they prefer action movies, comedies, dramas, or other types?", "zh": "感谢参与这项研究。我想问你一些关于娱乐偏好的问题。首先，你的家人或朋友通常喜欢看什么类型的电影？例如，他们是喜欢动作片、喜剧片、剧情片，还是其他类型？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0201c-speaking-q8.m4a"}, {"en": "Thank you. When you watch a movie, do you prefer to watch after work or school on weekdays, or do you like to watch during the weekends? Why?", "zh": "谢谢。你看电影时，是更喜欢在平日下班或放学后看，还是喜欢在周末看？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0201c-speaking-q9.m4a"}, {"en": "Interesting. In the past, people mostly watched movies in theaters. Today, many people watch movies at home. Do you think movie theaters will continue to exist in the future? Why or why not?", "zh": "有意思。过去，人们大多在电影院看电影。如今，很多人在家看电影。你认为电影院在未来还会继续存在吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0201c-speaking-q10.m4a"}, {"en": "Great. Some people believe that movies can be a powerful tool for educating people and raising awareness about important issues. Do you agree with this idea, or do you think there are other more effective ways to educate people? Explain why you think so.", "zh": "好的。有些人认为电影可以是教育人们、提高对重要问题认识的有力工具。你同意这个观点吗？或者你认为有其他更有效的方式来教育人们？请解释你这样认为的原因。", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0201c-speaking-q11.m4a"}]}, {"id": "mock-10", "n": 10, "en": "Personal Finance", "zh": "个人理财", "scenario": "You received an email from your university inviting you to join a research study about personal finance. You have scheduled a short online interview with me to answer a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [12], "items": [{"en": "Thanks for joining us today. I'd like to ask you some questions about your personal finance habits. First, how often do you review your money management, such as tracking your expenses or budgeting? Do you do this weekly, monthly, or less often?", "zh": "感谢您今天的参与。我想问您一些关于个人理财习惯的问题。首先，您多久会检查一次您的财务状况，比如追踪支出或做预算？您是每周、每月，还是更少频率地这样做？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0202-speaking-q8.m4a"}, {"en": "Thank you. Can you describe one or two methods you or someone you know uses to manage your finances? For example, do you use budgeting apps or keep a written record?", "zh": "谢谢。您能描述一下您或您认识的人用来管理财务的一两种方法吗？例如，您会使用预算应用还是做书面记录？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0202-speaking-q9.m4a"}, {"en": "I see. Tell me about a financial goal you have achieved recently. What motivated you to achieve this goal?", "zh": "我明白了。请谈谈您最近实现的一个财务目标。是什么激励您实现了这个目标？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0202-speaking-q10.m4a"}, {"en": "Finally, some people believe that fiscal responsibility education should be mandatory in schools to help students manage money effectively as adults. Do you agree or disagree with this idea? Why?", "zh": "最后，有些人认为应该在学校强制进行财政责任教育，以帮助学生在成年后有效管理金钱。您同意还是不同意这个想法？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0202-speaking-q11.m4a"}]}, {"id": "mock-11", "n": 11, "en": "Environmental Practices", "zh": "环保行为", "scenario": "You are participating in a research study conducted by your university's Department of Environmental Science about environmental practices. You will meet online with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [14], "items": [{"en": "Thank you for taking part in the study. I'd like to ask you some questions about your environmental practices. First, do you take any specific actions to reduce your environmental impact, such as recycling or conserving energy? Give details in your answer.", "zh": "感谢你参与这项研究。我想问你一些关于你环保实践的问题。首先，你是否采取任何具体行动来减少对环境的影响，例如回收利用或节约能源？请在回答中详细说明。", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0210-speaking-q8.m4a"}, {"en": "Great. Can you describe one or two steps your community or neighborhood takes to be environmentally friendly? For example, are there solar panels on buildings or rainwater barrels available where you live?", "zh": "很好。你能描述一下你的社区或邻里为环保所采取的一两个步骤吗？例如，你居住的地方有太阳能电池板或雨水收集桶吗？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0210-speaking-q9.m4a"}, {"en": "Interesting. If you had the chance to participate in an ecological or nature-based activity, such as a community cleanup effort or tree-planting event, what would you do, and why?", "zh": "有趣。如果你有机会参与一项生态或基于自然的活动，例如社区清洁工作或植树活动，你会做什么，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0210-speaking-q10.m4a"}, {"en": "Good points. Last question. Some people believe that individual actions are not enough to address conservation issues and that significant changes must come from government policies. Do you agree or disagree with this viewpoint? Why or why not?", "zh": "说得对。最后一个问题。有些人认为，个人行动不足以解决保护问题，重大变革必须来自政府政策。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0210-speaking-q11.m4a"}]}, {"id": "mock-12", "n": 12, "en": "Sports Participation", "zh": "体育参与", "scenario": "You have volunteered for a research study at your university about sports participation. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [0], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your participation in sports. First, do you currently play any sports or engage regularly in any physical activities?", "zh": "感谢你同意参与。我想问你一些关于你参与体育运动的问题。首先，你目前参与任何体育运动或定期进行任何体育活动吗？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0228-speaking-q8.m4a"}, {"en": "Thank you. If you were able to, what sport that you do not currently play would you like to be really good at? Why that particular sport?", "zh": "谢谢。如果你有能力，你希望自己能真正擅长哪项你目前不参与的运动？为什么是那项特定的运动？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0228-speaking-q9.m4a"}, {"en": "Interesting. Tell me about an experience you had while playing a sport or engaging in a physical activity that you remember well. What made it memorable?", "zh": "有意思。请告诉我你参与某项体育运动或体育活动时，一次你记忆深刻的经历。是什么让它令人难忘？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0228-speaking-q10.m4a"}, {"en": "Great. Some people believe that children should not participate in contact sports like rugby or hockey because they could get hurt, while others believe that these sports teach awareness and teamwork. What do you think, and why?", "zh": "很好。有些人认为儿童不应该参与像橄榄球或冰球这样的接触性运动，因为他们可能会受伤，而另一些人则认为这些运动能培养意识和团队合作精神。你怎么看，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0228-speaking-q11.m4a"}]}, {"id": "mock-13", "n": 13, "en": "Books & Reading", "zh": "书籍与阅读", "scenario": "You have signed up for a study run by a university research group that is investigating people's experiences with books and reading. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [4], "items": [{"en": "Thank you for participating. I'd like to learn about your experiences with books and reading. Was there a time in your life when you read more or less than you do now? What changed?", "zh": "感谢参与。我想了解一下你关于书籍和阅读的经历。你生命中是否有一段时期，阅读量比现在多或少？是什么发生了改变？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0302b-speaking-q8.m4a"}, {"en": "Great. In your opinion, is reading for pleasure a popular way people spend their free time where you live? Why do you think that is?", "zh": "很好。在你看来，你所在的地方，阅读是人们消遣时光的流行方式吗？你认为这是为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0302b-speaking-q9.m4a"}, {"en": "Interesting. Do you think reading different types of books helps people understand each other and get along better? Why or why not?", "zh": "有意思。你认为阅读不同类型的书籍有助于人们相互理解并更好地相处吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0302b-speaking-q10.m4a"}, {"en": "Good points. Looking ahead, some people believe that future generations will read less than today's generation. Do you agree or disagree? Why?", "zh": "观点很好。展望未来，有些人认为后代会比当今一代读的书少。你同意还是不同意？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0302b-speaking-q11.m4a"}]}, {"id": "mock-14", "n": 14, "en": "Work Experience", "zh": "工作经历", "scenario": "You have volunteered for a research study at your university about work experience. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [7], "items": [{"en": "Thank you for participating. I'd like to ask you some questions about your work experience. First, can you tell me about the type of work you are currently doing or have done in the past?", "zh": "感谢你参与。我想问一些关于你工作经历的问题。首先，你能谈谈你目前或过去从事的工作类型吗？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0419a-speaking-q8.m4a"}, {"en": "Thank you. Can you describe some of your regular responsibilities or particular tasks in your job?", "zh": "谢谢。你能描述一下你工作中的一些常规职责或具体任务吗？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0419a-speaking-q9.m4a"}, {"en": "Interesting. Tell me about a challenging project or task you've worked on. How did you handle it?", "zh": "有趣。请谈谈你参与过的一个有挑战性的项目或任务。你是如何处理的？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0419a-speaking-q10.m4a"}, {"en": "Good. Some people believe that gaining diverse work experiences by often changing jobs and companies is more valuable than staying in one job or one company for a long time. What is your opinion on this? Why?", "zh": "好的。有些人认为，通过经常更换工作和公司来获得多样化的工作经验，比长期留在一份工作或一家公司更有价值。你对此有何看法？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0419a-speaking-q11.m4a"}]}, {"id": "mock-15", "n": 15, "en": "Job Satisfaction", "zh": "工作满意度", "scenario": "You have agreed to participate in a research study about people's experiences with job satisfaction. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [7], "items": [{"en": "Thank you for participating in the study. I'd like to ask you some questions about your job satisfaction. First, what do you think are the most important things to consider when looking for a job?", "zh": "感谢你参与这项研究。我想问你一些关于工作满意度的问题。首先，你认为在找工作时最重要的考量是什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0310-speaking-q8.m4a"}, {"en": "Now, can you describe a job that either you or one of your friends has had? What kind of work was involved?", "zh": "那么，你能描述一下你或你朋友曾经做过的一份工作吗？工作内容是什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0310-speaking-q9.m4a"}, {"en": "I see. What kinds of things do you think can lead people to feel unhappy in their work? Can you tell me about one or two of them?", "zh": "明白了。你认为哪些事情会导致人们对工作感到不满？能告诉我一两个吗？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0310-speaking-q10.m4a"}, {"en": "Last question. Some people believe that working for a large company offers more advantages than working for a small company, while others prefer the opposite. What do you think, and why?", "zh": "最后一个问题。有些人认为在大公司工作比在小公司工作优势更多，而另一些人则相反。你怎么看，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0310-speaking-q11.m4a"}]}, {"id": "mock-16", "n": 16, "en": "Home Decoration", "zh": "家居装饰", "scenario": "You have volunteered for a research study at your university about people's experiences with home decoration. You will have a short online interview with me to answer a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [8], "items": [{"en": "Thanks for participating in the study. I'd like to ask you some questions about your experiences with home decoration. First, do you enjoy decorating your living space, or do you find it challenging? Why do you think that is?", "zh": "感谢你参与这项研究。我想问你一些关于你家居装饰经历的问题。首先，你享受装饰自己的居住空间吗，还是觉得这有挑战性？你认为原因是什么？", "audio": "https://wofo.cc/toefl/speaking-media/test2-m2-q8.m4a"}, {"en": "Thank you. Can you describe a recent home decoration project you or your family worked on, and what changes were made?", "zh": "谢谢。你能描述一下你或你家人最近完成的一个家居装饰项目吗，做了哪些改变？", "audio": "https://wofo.cc/toefl/speaking-media/test2-m2-q9.m4a"}, {"en": "Okay, what kinds of living spaces do you find inviting or comfortable? Why do you think that is?", "zh": "好的，你觉得什么样的居住空间让人感到有吸引力或舒适？你认为原因是什么？", "audio": "https://wofo.cc/toefl/speaking-media/test2-m2-q10.m4a"}, {"en": "Some people believe that a well-decorated living space can significantly improve one's mood and productivity. Do you agree or disagree with this viewpoint? Why or why not?", "zh": "有些人认为，精心装饰的居住空间可以显著改善一个人的情绪和生产力。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/test2-m2-q11.m4a"}]}, {"id": "mock-17", "n": 17, "en": "Social Media", "zh": "社交媒体", "scenario": "You received an email from your university inviting you to join a research study about social media. You've scheduled a short online interview with me to answer a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [13], "items": [{"en": "Thanks so much for joining us today. I'd like to ask you a few questions about social media. To start, how often do you use social media platforms, and for what purposes? Or, if you don't use them, why?", "zh": "非常感谢今天加入我们。我想问你几个关于社交媒体的问题。首先，你使用社交媒体平台的频率是多少，目的是什么？或者，如果你不使用，原因是什么？", "audio": "https://wofo.cc/toefl/speaking-media/test3-m2-q8.m4a"}, {"en": "Next question. In your opinion, what makes social media either enjoyable or difficult to deal with?", "zh": "下一个问题。在你看来，是什么让社交媒体变得有趣或难以应对？", "audio": "https://wofo.cc/toefl/speaking-media/test3-m2-q9.m4a"}, {"en": "Thanks for that. Okay, now, what kinds of things do you think are appropriate to share on social media, and why?", "zh": "感谢你的回答。好的，现在，你认为在社交媒体上分享哪些类型的内容是合适的，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/test3-m2-q10.m4a"}, {"en": "Finally, some people believe that social media has more negative effects than positive ones on society. In general, do you agree or disagree with this viewpoint? Explain why.", "zh": "最后，有些人认为社交媒体对社会的负面影响大于正面影响。总的来说，你同意还是不同意这种观点？请解释原因。", "audio": "https://wofo.cc/toefl/speaking-media/test3-m2-q11.m4a"}]}, {"id": "mock-18", "n": 18, "en": "Fashion & Clothing", "zh": "时尚与服装", "scenario": "You have agreed to participate in a research study about people's experiences with fashion and clothing. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [11], "items": [{"en": "Thank you for signing up for the study. I'd like to ask you some questions about your experiences with fashion and clothing. First, do you enjoy shopping for clothes, or is it something you find tedious? Why?", "zh": "感谢你报名参加这项研究。我想问你一些关于你在时尚和服装方面经历的问题。首先，你喜欢买衣服吗，还是觉得这是一件乏味的事？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0415b-speaking-q8.m4a"}, {"en": "Great, noted. Now, what types of clothes do you usually prefer to wear? Do you have a particular style you enjoy?", "zh": "好的，明白了。那么，你通常喜欢穿什么类型的衣服？你有特别喜欢的风格吗？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0415b-speaking-q9.m4a"}, {"en": "Fair enough. How do you decide what to wear each day? Do you choose your clothes in the morning or the night before?", "zh": "有道理。你如何决定每天穿什么？你是在早上还是前一天晚上选择衣服？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0415b-speaking-q10.m4a"}, {"en": "Got it. And finally, some people believe that fashion trends change too quickly, and that spending money on new fashions is wasteful. Do you agree or disagree with this viewpoint? Why or why not?", "zh": "明白了。最后一个问题，有些人认为时尚潮流变化太快，在新时尚上花钱是浪费。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0415b-speaking-q11.m4a"}]}, {"id": "mock-19", "n": 19, "en": "Nature & Outdoors", "zh": "自然与户外", "scenario": "You have agreed to participate in a research study about people's experiences with nature and the outdoors. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [1], "items": [{"en": "Thanks for being willing to help us out. I'd like to ask you some questions about your experiences with nature and the outdoors. First, if you had the chance to spend more time outdoors, what would you want to do?", "zh": "感谢你愿意帮忙。我想问你一些关于你在自然和户外经历的问题。首先，如果你有机会花更多时间在户外，你想做什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0415a-speaking-q8.m4a"}, {"en": "Great, thanks. And now can you tell me, how do you usually feel while you're outdoors compared to when you're indoors?", "zh": "很好，谢谢。现在你能告诉我，与在室内相比，你在户外时通常感觉如何？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0415a-speaking-q9.m4a"}, {"en": "Got it. In your view, do you think not spending enough time outdoors in nature can affect people's health and well-being? Why or why not?", "zh": "明白了。在你看来，你认为不在户外自然环境中花足够时间会影响人们的健康和幸福感吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0415a-speaking-q10-v2.m4a"}, {"en": "Okay, last question. Do you think outdoor spaces should be free for use, or is it acceptable to charge fees? Why?", "zh": "好的，最后一个问题。你认为户外空间应该免费使用，还是可以收取费用？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0415a-speaking-q11.m4a"}]}, {"id": "mock-20", "n": 20, "en": "Friendship", "zh": "友谊", "scenario": "You have volunteered for a research study at your university about friendship. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [5], "items": [{"en": "Thank you for signing up for the study. I'd like to ask you some questions about your experiences with friendship. First, do you have a large group of friends, or do you prefer to have a smaller group of friends?", "zh": "感谢你报名参加这项研究。我想问一些关于你友谊经历的问题。首先，你是有一大群朋友，还是更喜欢有一小群朋友？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0405c-speaking-q8.m4a"}, {"en": "Very good. Now, describe a time when a friendship taught you something valuable or helped you see something from a new perspective.", "zh": "很好。现在，请描述一次友谊教你有价值的东西，或者帮助你从新角度看事物的经历。", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0405c-speaking-q9.m4a"}, {"en": "Great. Next question. In your opinion, what makes a friendship last a long time?", "zh": "很棒。下一个问题。在你看来，是什么让友谊长久维持？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0405c-speaking-q10.m4a"}, {"en": "Okay, last one. Some people believe that maintaining friendships is essential for emotional well-being and life satisfaction. Do you agree or disagree with this viewpoint? Why or why not?", "zh": "好的，最后一个问题。有些人认为，维持友谊对情绪健康和生活满意度至关重要。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0405c-speaking-q11.m4a"}]}, {"id": "mock-21", "n": 21, "en": "Volunteering & Community Service", "zh": "志愿服务与社区服务", "scenario": "You have signed up for a study run by a university research group that is investigating volunteering and community service. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [5], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your experiences with volunteering and community service. First, have you ever participated in any volunteer activities, and if so, how often do you volunteer?", "zh": "感谢你同意参与。我想问你一些关于你参与志愿服务和社区服务经历的问题。首先，你曾经参与过任何志愿活动吗？如果有，你参与的频率如何？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0316b-speaking-q8.m4a"}, {"en": "Thank you. Can you tell me about a charity effort or a donation drive that you have heard about that made an impact where you live?", "zh": "谢谢。你能谈谈你听说过的、对你所在社区产生影响的慈善活动或募捐活动吗？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0316b-speaking-q9.m4a"}, {"en": "Interesting. Can you describe a public service project that you have been involved in or would like to participate in if you had the time?", "zh": "有意思。你能描述一个你参与过，或者如果有时间会想参与的公共服务项目吗？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0316b-speaking-q10.m4a"}, {"en": "Great. Some people believe that volunteering should be a mandatory part of the school curriculum to help students develop a sense of community. Do you agree or disagree with this idea? Why?", "zh": "很好。有些人认为，志愿服务应该成为学校课程的必修部分，以帮助学生培养社区意识。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0316b-speaking-q11.m4a"}]}, {"id": "mock-22", "n": 22, "en": "Food & Nutrition", "zh": "食物与营养", "scenario": "As part of a university project, you have agreed to take part in a short research interview about food and nutrition. I am the graduate student conducting the research, and I will ask you some questions online. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [8], "items": [{"en": "Thank you for participating. I'd like to ask you some questions about your food and nutrition habits. First, do you follow any specific diet or eating plan?", "zh": "感谢参与。我想问你一些关于你的饮食和营养习惯的问题。首先，你是否遵循任何特定的饮食或饮食计划？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0323a-speaking-q8.m4a"}, {"en": "Thank you. Can you describe some foods that you eat on a regular basis?", "zh": "谢谢。你能描述一些你经常吃的食物吗？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0323a-speaking-q9.m4a"}, {"en": "Interesting. Tell me about a time when you or someone you know made a significant change to their diet. What was the change, and what motivated you or the person you know to make it?", "zh": "有意思。跟我讲讲你或你认识的人对饮食做出重大改变的一次经历。改变了什么？是什么促使你或你认识的人做出这个改变？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0323a-speaking-q10.m4a"}, {"en": "Great. Some people say they have difficulty maintaining a healthy diet because they do not like the taste of healthier foods. What do you think about that argument? Why?", "zh": "好的。有些人说他们难以保持健康的饮食，因为他们不喜欢更健康食物的味道。你怎么看这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0323a-speaking-q11.m4a"}]}, {"id": "mock-23", "n": 23, "en": "Holiday Celebrations", "zh": "节日庆典", "scenario": "You received an email from your university inviting you to join a research study about holiday celebrations. You have scheduled a short online interview with me to answer a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [6], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about holiday celebrations. First, do you celebrate holidays with your family, friends, or both? How often do you participate with them?", "zh": "感谢你同意参与。我想问你一些关于节日庆祝的问题。首先，你是和家人、朋友还是两者一起庆祝节日？你和他们一起参与的频率如何？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0324a-speaking-q8.m4a"}, {"en": "Thank you. Can you describe one of your favorite holiday celebrations or festivals? What do you do to mark the occasion?", "zh": "谢谢。你能描述一下你最喜欢的节日庆祝活动或节日之一吗？你会做些什么来纪念这个场合？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0324a-speaking-q9.m4a"}, {"en": "Interesting. Tell me about a special event that was particularly memorable for you. What made it meaningful?", "zh": "有意思。跟我讲讲一个对你来说特别难忘的特别事件吧。是什么让它变得有意义？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0324a-speaking-q10.m4a"}, {"en": "Great. Some people believe that traditional cultural observances are becoming less important in modern society. Do you agree or disagree with this viewpoint? Why?", "zh": "很好。有些人认为传统文化习俗在现代社会变得不那么重要了。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0324a-speaking-q11.m4a"}]}, {"id": "mock-24", "n": 24, "en": "Dining Preferences", "zh": "用餐偏好", "scenario": "You have volunteered for a research study at your university about dining preferences. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [8], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your dining preferences. First, how often do you eat out at restaurants? Do you do this daily, weekly, monthly, or less often?", "zh": "感谢你同意参与。我想问你一些关于你的外出就餐习惯的问题。首先，你多久去餐馆吃一次饭？你是每天、每周、每月，还是更少？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0324b-speaking-q8.m4a"}, {"en": "Thank you. If you were going to eat out, what types of cuisine would you prefer? For example, do you like savory foods or desserts?", "zh": "谢谢。如果你打算外出就餐，你更喜欢哪种类型的菜肴？例如，你喜欢咸味食物还是甜点？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0324b-speaking-q9.m4a"}, {"en": "Interesting. Can you tell me about a memorable dining experience or meal you or a friend had recently? What made it special or stand out?", "zh": "有意思。你能跟我分享一下你或你朋友最近一次难忘的用餐经历或一顿饭吗？是什么让它显得特别或与众不同？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0324b-speaking-q10.m4a"}, {"en": "Great. Some people believe that the atmosphere and service at a restaurant are just as important as the food quality. Do you agree or disagree with this viewpoint? Why?", "zh": "很好。有些人认为餐馆的氛围和服务与食物质量同等重要。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0324b-speaking-q11.m4a"}]}, {"id": "mock-25", "n": 25, "en": "Work-Life Balance", "zh": "工作与生活平衡", "scenario": "As part of a university project, you have agreed to take part in a short research interview about work-life balance. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [7], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your work-life balance. First, do you feel that you currently have a good balance between your work and personal life? Give details to explain your answer.", "zh": "感谢你同意参与。我想问你一些关于工作与生活平衡的问题。首先，你觉得目前的工作和个人生活之间平衡得好吗？请详细说明你的答案。", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0405d-speaking-q8.m4a"}, {"en": "Thank you. Can you describe some strategies you use or want to use to maintain a balanced lifestyle?", "zh": "谢谢。你能描述一下你用来或想要用来保持平衡生活的一些策略吗？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0405d-speaking-q9.m4a"}, {"en": "Interesting. Tell me about a time when you might have felt overwhelmed by work or personal responsibilities. How did you handle the situation?", "zh": "有意思。跟我讲讲你可能曾经因工作或个人责任而感到不堪重负的一次经历。你是如何处理这种情况的？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0405d-speaking-q10.m4a"}, {"en": "Great. Some people believe that employers should offer more flexible working arrangements to help employees better achieve a healthy work-life balance. Do you agree or disagree with this idea? Why?", "zh": "很好。有些人认为雇主应该提供更灵活的工作安排，以帮助员工更好地实现健康的工作与生活平衡。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0405d-speaking-q11.m4a"}]}, {"id": "mock-26", "n": 26, "en": "Travel Habits", "zh": "旅行习惯", "scenario": "You have signed up for a study run by a university research group that is investigating travel habits. You will have a short video interview with me, one of the researchers. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [6], "items": [{"en": "Thank you for participating in this study. Today, I'd like to ask you some questions about your travel habits. First, can you tell me about a recent trip you or a friend took, and what you or the friend enjoyed most about it?", "zh": "感谢你参与本研究。今天我想问你一些关于旅行习惯的问题。首先，能否请你谈谈最近一次你或朋友的旅行，以及你或朋友最喜欢这次旅行的哪一点？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0406a-speaking-q8.m4a"}, {"en": "One important part of traveling is deciding whether to go alone or with a group. Think about a place you would like to visit. Would you prefer to go there alone or with a group? Why?", "zh": "旅行的一个重要部分是决定独自前往还是结伴而行。请想一个你想去的地方。你更倾向于独自前往还是和一群人一起去？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0406a-speaking-q9.m4a"}, {"en": "Interesting. For many people, one of the most exciting parts of travel is choosing a destination. If you are going to select a place to travel, how would you go about making a list of potential places? Please describe your process.", "zh": "有意思。对许多人来说，旅行最令人兴奋的部分之一就是选择目的地。如果你要选择一个旅行地点，你会如何着手列一个可能去处的清单？请描述你的过程。", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0406a-speaking-q10.m4a"}, {"en": "Good points. Finally, one major issue with travel today is overcrowding. Popular sites often receive so many visitors at one time that they cannot accommodate everyone who wants to visit. As a result, virtual travel experiences are becoming more common as an alternative to real-life travel. Do you think a virtual travel experience is worthwhile? Why or why not?", "zh": "说得好。最后，当今旅行的一个主要问题是人满为患。热门景点常常一次接待太多游客，以至于无法满足所有想参观的人的需求。因此，作为现实旅行的替代，虚拟旅行体验正变得越来越普遍。你认为虚拟旅行体验值得吗？为什么值得或为什么不值得？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0406a-speaking-q11.m4a"}]}, {"id": "mock-27", "n": 27, "en": "Online Shopping", "zh": "网上购物", "scenario": "You have volunteered for a research study at your university about online shopping. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [11], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your online shopping habits. First, how often do you shop online? Do you do it weekly, monthly, or less often?", "zh": "感谢你同意参与。我想问你一些关于你网购习惯的问题。首先，你多久网购一次？是每周、每月，还是更少？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0406c-speaking-q8.m4a"}, {"en": "Thank you. If you were to shop online, what types of products would you be most likely to buy? For example, would you buy clothing, electronics, or groceries?", "zh": "谢谢。如果你要网购，你最可能购买哪类产品？例如，你会买衣服、电子产品，还是食品杂货？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0406c-speaking-q9.m4a"}, {"en": "Interesting. Some people believe that online shopping is more convenient than shopping in physical stores, while others think it's a worse experience because it lacks the human interaction of in-person shopping. What is your opinion on this? Why?", "zh": "有意思。一些人认为网购比实体店购物更方便，而另一些人认为它体验更差，因为它缺少了面对面购物的人际互动。你对此有何看法？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0406c-speaking-q10.m4a"}, {"en": "Great. Some people believe physical stores might one day disappear because of online shopping. What is your opinion on this? Why?", "zh": "很好。有些人认为实体店有一天可能会因为网购而消失。你对此有何看法？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0406c-speaking-q11.m4a"}]}, {"id": "mock-28", "n": 28, "en": "Financial Planning", "zh": "财务规划", "scenario": "You have volunteered for a research study about people's experiences with financial planning. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [12], "items": [{"en": "Thank you for joining us today to help with the study. I'd like to ask you some questions about your experiences with financial planning. First, do you currently have a financial plan that you follow?", "zh": "感谢您今天参与我们的研究。我想问您一些关于您理财规划经历的问题。首先，您目前是否有遵循的理财计划？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0408-speaking-q8.m4a"}, {"en": "Thank you. If you could design the ideal way of managing money, what would it look like?", "zh": "谢谢。如果您能设计理想的理财方式，它会是什么样子的？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0408-speaking-q9.m4a"}, {"en": "I see. In your opinion, what are the most common obstacles people run into with financial planning?", "zh": "明白了。在您看来，人们在理财规划中最常遇到的障碍是什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0408-speaking-q10.m4a"}, {"en": "Some people believe that detailed financial planning is crucial for achieving long-term financial stability and goals. Do you agree or disagree with this belief? Why or why not?", "zh": "有些人认为，详细的财务规划对于实现长期财务稳定和目标至关重要。您同意还是不同意这一观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0408-speaking-q11.m4a"}]}, {"id": "mock-29", "n": 29, "en": "Movie-Watching Habits", "zh": "观影习惯", "scenario": "You have volunteered for a research study at your university about movie-watching habits. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [4], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your movie watching habits. First, how often do you watch movies? Do you watch them weekly, monthly, or less often?", "zh": "感谢您同意参与。我想问您一些关于您看电影习惯的问题。首先，您多久看一次电影？是每周、每月，还是更不经常？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0412-speaking-q8.m4a"}, {"en": "Thank you. What genres of movies do you usually prefer to watch? For example, do you enjoy action, comedy, or drama?", "zh": "谢谢。您通常喜欢看哪种类型的电影？例如，您喜欢动作片、喜剧片还是剧情片？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0412-speaking-q9.m4a"}, {"en": "Interesting. Can you tell me about a movie that you have seen and what you thought about it?", "zh": "有意思。您能告诉我一部您看过的电影以及您对它的看法吗？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0412-speaking-q10.m4a"}, {"en": "Great. Some people believe that viewing films at home is more enjoyable than going to a movie theater. Do you agree or disagree with this viewpoint? Why?", "zh": "很好。有些人认为在家看电影比去电影院更令人愉快。您同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0412-speaking-q11.m4a"}]}, {"id": "mock-30", "n": 30, "en": "Spending & Budgeting", "zh": "消费与预算", "scenario": "You have signed up for a study run by a university research group that is investigating spending habits and budgeting. You will have a short video interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [12], "items": [{"en": "Thank you for participating in this study. Today, I'd like to ask you some questions about your spending habits. First, can you tell me about a recent purchase you or someone in your family made and why you decided to buy it?", "zh": "感谢你参与这项研究。今天，我想问你一些关于消费习惯的问题。首先，你能告诉我最近你或你的家人买了一样什么东西，以及你们为什么决定买它吗？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0413a-speaking-q8.m4a"}, {"en": "I see. When you make a purchase, do you usually plan ahead or do you buy things spontaneously? Why?", "zh": "明白了。当你购物时，你通常是提前计划好的，还是会即兴购买？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0413a-speaking-q9.m4a"}, {"en": "Interesting. Some people believe that creating a monthly or weekly budget is essential for managing finances effectively. When you decide whether to buy something, which matters more to you: getting good value for your money, or spending as little as possible? Why?", "zh": "有意思。有些人认为制定每月或每周的预算对于有效管理财务至关重要。当你决定是否购买某样东西时，对你来说更重要的是：获得物有所值，还是尽可能少花钱？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0413a-speaking-q10.m4a"}, {"en": "Good points. For my final question, I'd like to ask about using apps or online tools for managing spending habits. Do you think people will increasingly rely on financial apps and tools to manage their money, or will people prefer to hire personal financial managers? Explain your thoughts.", "zh": "说得有道理。最后一个问题，我想问问关于使用应用程序或在线工具来管理消费习惯。你认为人们会越来越依赖金融应用和工具来管理他们的钱，还是会更倾向于聘请个人理财经理？请解释你的想法。", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0413a-speaking-q11.m4a"}]}, {"id": "mock-31", "n": 31, "en": "Commuting", "zh": "通勤", "scenario": "You have volunteered for a research study about people's experiences with commuting. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [7], "items": [{"en": "Thank you for your willingness to participate today. I'd like to ask you some questions about your experiences with commuting. First, what kinds of places do you usually go to during the week, and how do you get there?", "zh": "感谢你今天愿意参与。我想问一些关于你通勤经历的问题。首先，你平时工作日通常去哪些地方？你是怎么到达那里的？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0420a-speaking-q8.m4a"}, {"en": "Got it. Can you describe how someone in your family or a friend usually travels to work or school? How much time does it take and what transportation does the person use?", "zh": "明白了。你能描述一下你的家人或朋友通常如何通勤去上班或上学吗？通常需要多长时间？使用什么交通工具？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0420a-speaking-q9.m4a"}, {"en": "Okay, thanks. Next question. Some people believe that living close to work or school improves quality of life, while others think location doesn't matter much. What do you think? And why?", "zh": "好的，谢谢。下一个问题。有些人认为住在离工作或学校近的地方能提高生活质量，而另一些人认为地点没那么重要。你怎么看？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0420a-speaking-q10.m4a"}, {"en": "Great. Final question. Some people believe that employers should reimburse employees for their commuting costs, while others think that employees should pay for their own travel to work. Which view do you agree with, and why?", "zh": "很好。最后一个问题。有些人认为雇主应该报销员工的通勤费用，而另一些人认为员工应该自己支付上班的交通费用。你同意哪种观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0420a-speaking-q11.m4a"}]}, {"id": "mock-32", "n": 32, "en": "Personal Organization", "zh": "个人整理", "scenario": "You have volunteered for a research study at your university about personal organization habits. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [9], "items": [{"en": "Thanks for volunteering to help us with this research. Today, I'd like to ask you some questions about your personal organization habits. Do you consider yourself to be an organized person? Why or why not?", "zh": "感谢你志愿协助我们的研究。今天，我想问你一些关于你个人组织习惯的问题。你认为自己是一个有条理的人吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0420b-speaking-q8.m4a"}, {"en": "Got it. Now, would you say that your organization habits have changed or stayed the same over time? Why do you think that is?", "zh": "明白了。那么，你觉得你的组织习惯随时间是改变了还是保持不变？你认为原因是什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0420b-speaking-q9.m4a"}, {"en": "Very good. Next question: Do you think organizational skills should be taught in schools? Why or why not?", "zh": "很好。下一个问题：你认为组织能力应该在学校里教授吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0420b-speaking-q10.m4a"}, {"en": "Sounds good. And my final question: Some people believe that being organized can significantly reduce stress. Do you agree or disagree with this viewpoint? Why?", "zh": "好的。我的最后一个问题：有些人认为有条理能显著减轻压力。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0420b-speaking-q11.m4a"}]}, {"id": "mock-33", "n": 33, "en": "Goals & Achievements", "zh": "目标与成就", "scenario": "As part of a university project, you have agreed to take part in a short research interview about personal goals and achievements. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [9], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your personal goals and achievements. First, do you currently have any specific personal goals you are working towards? Give details to explain your answer.", "zh": "感谢您同意参与。我想问您一些关于个人目标和成就的问题。首先，您目前是否有任何正在努力实现的特定个人目标？请详细说明。", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0421a-speaking-q8.m4a"}, {"en": "Thank you. Can you describe some steps you can take to achieve these goals, or to achieve goals in general? What are the challenges you face when taking these steps?", "zh": "谢谢。您能描述一下为实现这些目标，或通常为实现目标可以采取哪些步骤吗？在采取这些步骤时，您会面临哪些挑战？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0421a-speaking-q9.m4a"}, {"en": "Interesting. Can you describe an accomplishment that holds special meaning for you? What did you achieve, and why is it significant to you?", "zh": "很有趣。您能描述一项对您有特殊意义的成就吗？您取得了什么成就，为什么它对您很重要？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0421a-speaking-q10.m4a"}, {"en": "Great. Some people believe that setting and working towards individual goals is crucial for self-improvement and personal growth. Do you agree or disagree with this idea? Why?", "zh": "很好。有些人认为，设定并努力实现个人目标对自我提升和个人成长至关重要。您同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0421a-speaking-q11.m4a"}]}, {"id": "mock-34", "n": 34, "en": "Sleep Habits", "zh": "睡眠习惯", "scenario": "You have volunteered for a research study about sleep habits. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [0], "items": [{"en": "Thank you for your time. I'd like to ask you some questions about your sleep habits. First, do you usually go to bed early or late?", "zh": "感谢你抽出时间。我想问你一些关于睡眠习惯的问题。首先，你通常睡得早还是晚？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0428a-speaking-q8.m4a"}, {"en": "Okay, thanks. What is your typical routine before bedtime? What do you usually do before going to bed?", "zh": "好的，谢谢。你睡前通常有什么例行程序？你睡前一般做什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0428a-speaking-q9.m4a"}, {"en": "Great. Now, some people have trouble sleeping when they stay overnight at a hotel or at a friend's house. Are you able to sleep well in unfamiliar places? Why or why not?", "zh": "很好。现在，有些人在酒店或朋友家过夜时会难以入睡。你能在陌生的地方睡得好吗？为什么能或为什么不能？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0428a-speaking-q10.m4a"}, {"en": "Many parents worry about their teenage children getting enough sleep. Some high schools have considered starting later in the morning to allow teenage students more time to sleep each night. What do you think of this idea? Explain why.", "zh": "许多父母担心他们的青少年孩子得不到足够的睡眠。一些高中已考虑推迟早上上课时间，以便青少年学生每晚有更多时间睡觉。你对这个想法有什么看法？请解释原因。", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0428a-speaking-q11.m4a"}]}, {"id": "mock-35", "n": 35, "en": "Shopping Habits", "zh": "购物习惯", "scenario": "You have volunteered for a research study about shopping habits. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [11], "items": [{"en": "Thank you for participating in our study. I'd like to learn more about your shopping habits. Do you shop more frequently online or in physical stores, and why?", "zh": "感谢你参与我们的研究。我想更多地了解你的购物习惯。你更常在线购物还是在实体店购物，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0429a-speaking-q8.m4a"}, {"en": "Thanks for sharing. Can you tell me about one or two factors that most influence your decision to purchase a product? For example, do you consider price, brand, or quality? Why?", "zh": "感谢分享。你能告诉我一两个最影响你购买产品决定的因素吗？例如，你考虑价格、品牌还是质量？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0429a-speaking-q9.m4a"}, {"en": "I appreciate your insights. Now, thinking back to a recent shopping experience, can you describe a product you bought that you were particularly satisfied with and explain why?", "zh": "感谢你的见解。现在，回想一下最近的一次购物经历，你能描述一下你买过的、特别满意的一个产品，并解释一下原因吗？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0429a-speaking-q10.m4a"}, {"en": "Interesting. As online shopping continues to grow, some people believe that physical stores will become obsolete. Do you agree or disagree with this viewpoint? Why or why not?", "zh": "有意思。随着网上购物的持续增长，有些人认为实体店将变得过时。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0429a-speaking-q11.m4a"}]}, {"id": "mock-36", "n": 36, "en": "Social Media Use", "zh": "社交媒体使用", "scenario": "You are participating in a research study about social media use. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [13], "items": [{"en": "Thank you for your time today. I'd like to discuss social media use with you. Which social media platforms do you or your friends use? How often do you or they use them?", "zh": "感谢你今天抽出时间。我想和你聊聊社交媒体的使用。你或你的朋友们使用哪些社交媒体平台？你或他们使用它们的频率如何？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0429b-speaking-q8.m4a"}, {"en": "Thank you. Why do you or they primarily use social media? Is it for staying in touch, entertainment, or another reason?", "zh": "谢谢。你或他们主要为什么使用社交媒体？是为了保持联系、娱乐，还是其他原因？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0429b-speaking-q9.m4a"}, {"en": "Interesting. Can you share a positive experience you or someone you know had while using social media?", "zh": "有意思。你能分享一次你或你认识的人在使用社交媒体时的积极经历吗？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0429b-speaking-q10.m4a"}, {"en": "There's an ongoing debate about social media's impact on face-to-face communication. Some say it decreases the likelihood of making plans to see friends face-to-face, while others argue it makes face-to-face connection easier. What is your opinion and why?", "zh": "关于社交媒体对面对面交流的影响，目前存在一些争论。有人认为它减少了人们约朋友线下见面的可能性，也有人认为它让面对面的联系变得更容易。你的观点是什么，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0429b-speaking-q11.m4a"}]}, {"id": "mock-37", "n": 37, "en": "Artistic Activities", "zh": "艺术活动", "scenario": "I am studying people's views on art and self-expression. You will have a short online interview with me. I will ask you some questions about artistic activities. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [3], "items": [{"en": "Thanks for speaking with me. I'd like to talk with you about art and music. Do you engage in any artistic activities such as painting or playing music regularly? If so, what do you do? If not, which artistic activity would you like to try if you had the chance?", "zh": "感谢你与我交谈。我想和你聊聊艺术和音乐。你是否经常参与任何艺术活动，比如绘画或演奏音乐？如果是，你具体做什么？如果不是，如果有机会，你最想尝试哪种艺术活动？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0429c-speaking-q8.m4a"}, {"en": "What kind of art or music do you enjoy the most, and how do you typically experience it, through creation or appreciation?", "zh": "你最喜欢哪种艺术或音乐？你通常如何体验它——是通过创作还是欣赏？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0429c-speaking-q9.m4a"}, {"en": "If you were creating art or music, would you prefer sharing your work publicly or keeping it private? What influences your decision?", "zh": "如果你在创作艺术或音乐，你更愿意公开分享你的作品，还是将其保留为私密？是什么影响了你的决定？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0429c-speaking-q10.m4a"}, {"en": "Some people think art and music can be powerful ways to communicate emotions and ideas that are difficult to express with words. Do you agree or disagree? Why?", "zh": "有些人认为艺术和音乐是传达那些难以用言语表达的情感和想法的强大方式。你同意还是不同意？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0429c-speaking-q11.m4a"}]}, {"id": "mock-38", "n": 38, "en": "Remote Work", "zh": "远程工作", "scenario": "You received an email from your university inviting you to join a research study about remote work. You have scheduled a short online interview with me to answer a few questions. I will ask you about your views and experiences with remote work. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [7], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about remote work. First, do you prefer to work remotely? How often would you prefer to work remotely?", "zh": "感谢你同意参与。我想问你一些关于远程工作的问题。首先，你更喜欢远程工作吗？你希望多久远程工作一次？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0530a-speaking-q8.m4a"}, {"en": "Thank you. What challenges or difficulties do you think remote work may involve?", "zh": "谢谢。你认为远程工作可能涉及哪些挑战或困难？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0530a-speaking-q9.m4a"}, {"en": "I see. Do you think companies should ensure fairness when giving employees remote-work opportunities? Why or why not?", "zh": "明白了。你认为公司在给予员工远程工作机会时应该确保公平性吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0530a-speaking-q10.m4a"}, {"en": "Great. Do you think remote work will become a mainstream trend in the future? Why or why not?", "zh": "很好。你认为远程工作在未来会成为主流趋势吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0530a-speaking-q11.m4a"}]}, {"id": "mock-39", "n": 39, "en": "Parks & Recreation", "zh":
