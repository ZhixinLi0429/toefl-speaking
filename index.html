<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>托福口语</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--fs:16px;--blue:#1976d2;--line:#e6e8eb}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#111;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:100;background:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 var(--line)}
.tab-bar{display:flex}
.tab-btn{flex:1;padding:13px 4px 11px;border:none;background:none;font-size:15px;font-weight:500;color:#555;border-bottom:3px solid transparent}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar select{flex:0 1 auto;min-width:0;max-width:42%;border:1px solid #d0d7de;border-radius:16px;background:#fff;padding:5px 10px;font-size:13px}
.pill{flex:0 0 auto;border:1px solid #d0d7de;background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;color:#333;white-space:nowrap}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg{display:flex;flex:0 0 auto;border:1px solid #d0d7de;border-radius:16px;overflow:hidden}
.seg button{border:none;background:#fff;padding:5px 12px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid #d0d7de}
.seg button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;color:var(--blue);border:1px solid #90caf9;padding:4px 11px;border-radius:14px;font-size:13px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab-content{display:none;padding:12px;max-width:820px;margin:0 auto}
.tab-content.active{display:block}
.meta{font-size:12px;color:#888;margin:0 2px 8px}
.card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:var(--fs)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title{font-size:16px;font-weight:600;color:var(--blue)}
.card-title small{display:block;color:#777;font-weight:400;font-size:12px;margin-top:1px}
.star{border:none;background:none;font-size:21px;color:#c2c2c2;padding:0 2px;line-height:1}
.star.on{color:#f5a623}
.scenario{font-size:.88em;color:#444;background:#f6f8e8;padding:8px 10px;border-radius:6px;margin:10px 0 0;line-height:1.55}
.scenario span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scenario.full span{display:block}
.actions{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.btn{border:none;background:var(--blue);color:#fff;border-radius:18px;padding:7px 14px;font-size:14px}
.btn.ghost{background:#e3f2fd;color:var(--blue)}
.item{border-top:1px solid #f0f0f0;padding:9px 0}
.item.playing{background:#e3f2fd;margin:0 -16px;padding:9px 16px}
.item-head{display:flex;align-items:center;gap:8px}
.qno{font-weight:600;color:var(--blue);min-width:26px;font-size:15px}
.play{width:34px;height:34px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:13px;flex-shrink:0}
.play.tts{background:#7e57c2}
.reveal{border:1px solid #cfd8dc;background:#fff;color:#455a64;border-radius:14px;padding:2px 10px;font-size:12px}
.tag{font-size:11px;color:#7e57c2}
.thumb{height:42px;width:58px;object-fit:cover;border-radius:4px;margin-left:auto;background:#eee}
.text{margin:7px 0 0;line-height:1.65}
.zh{font-size:.92em;color:#444;margin-top:2px}
.interview .item{border:none;border-left:3px solid #00897b;background:#fafafa;margin:8px 0;padding:9px 12px;border-radius:6px}
.interview .item.playing{background:#e0f2f1;margin:8px 0}
.note-add{border:none;background:none;color:#888;font-size:13px;padding:8px 0 0}
textarea{width:100%;min-height:64px;resize:vertical;font-size:15px;line-height:1.7;padding:9px 10px;border:1px solid #e0e0e0;border-radius:6px;margin-top:8px;background:#fcfcfc}
.ann-highlight{background:#fff3a3}.ann-bold{font-weight:700}.ann-underline{text-decoration:underline}.ann-italic{font-style:italic}
.annotatable{-webkit-user-select:text;user-select:text}
.ann-bar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;padding:8px;background:#263238;z-index:300}
.ann-bar button{border:none;border-radius:6px;padding:6px 10px;font-size:14px;background:#fff}
.ann-bar .b-highlight{background:#fff3a3}
.player{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;z-index:200}
.player .now{flex:1;min-width:0;font-size:13px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player button{border:none;background:#f0f2f4;border-radius:50%;width:40px;height:40px;font-size:15px;flex-shrink:0}
.player button.main{background:var(--blue);color:#fff}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:#f5f5f5;border-radius:14px 14px 0 0;z-index:260;padding:0 12px calc(76px + env(safe-area-inset-bottom))}
.sheet-head{position:sticky;top:0;background:#f5f5f5;display:flex;justify-content:space-between;align-items:center;padding:12px 2px 8px;z-index:1}
.sheet-head b{font-size:15px}
.sheet-head button{border:none;background:#e0e0e0;border-radius:50%;width:30px;height:30px}
.set{background:#fff;border-radius:10px;padding:4px 14px;margin-bottom:12px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
.set-row:last-child{border-bottom:none}
.set-row small{display:block;color:#888;font-size:12px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:400}
.lightbox img{max-width:96vw;max-height:78vh;border-radius:6px}
.lightbox .cap{position:absolute;bottom:40px;left:16px;right:16px;color:#fff;text-align:center;font-size:15px;line-height:1.5}
.related{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.related .lab{font-size:12px;color:#666}
.qchip{border:1px solid #00897b;color:#00796b;background:#fff;border-radius:14px;padding:3px 10px;font-size:13px}
.outline{font-size:var(--fs);line-height:1.65}
.outline ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed #d6dbe0}
.outline>ul{padding-left:0;border-left:none}
.outline li{margin:3px 0}
.outline .node{display:flex;gap:4px;align-items:flex-start}
.outline .tw{flex:0 0 18px;height:24px;border:none;background:none;color:var(--blue);padding:0;font-size:11px;transition:transform .15s}
.outline .tw.leaf{color:#c0c0c0}
.outline li.closed>ul{display:none}
.outline li.closed>.node .tw{transform:rotate(-90deg)}
.outline .h{flex:1;min-width:0}
.outline .h b{color:#0d47a1}
.outline .h .blue{color:var(--blue);font-style:normal}
.outline li.cover>.node .h{color:transparent;background:#e8eaf6;border-radius:4px}
.outline li.cover>.node .h *{color:transparent!important}
.outline-title{font-size:17px;font-weight:600;color:var(--blue);margin-bottom:6px}
.empty{text-align:center;color:#888;padding:30px 0}
.back-top{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;border:none;background:rgba(25,118,210,.9);color:#fff;font-size:18px;z-index:150}
</style>
</head>
<body>
<div class="top">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="repeat">Repeat</button>
    <button class="tab-btn" data-tab="recite">Interview 背诵</button>
    <button class="tab-btn" data-tab="interview">Interview 题目</button>
  </div>
  <div id="bar-repeat" class="toolbar"></div>
  <div id="bar-interview" class="toolbar" hidden></div>
  <div id="bar-recite" hidden>
    <div id="noteChips" class="chips"></div>
    <div class="toolbar">
      <div class="seg" id="foldSeg">
        <button data-fold="open" class="on">全部展开</button><button data-fold="closed">只看标题</button><button data-fold="cover">背诵遮挡</button>
      </div>
    </div>
  </div>
</div>
<div id="tab-repeat" class="tab-content active"></div>
<div id="tab-recite" class="tab-content"></div>
<div id="tab-interview" class="tab-content interview"></div>

<div class="ann-bar" id="annBar" hidden>
  <button class="b-highlight" data-ann="highlight">高亮</button>
  <button data-ann="bold"><b>加粗</b></button>
  <button data-ann="underline"><u>下划线</u></button>
  <button data-ann="italic"><i>斜体</i></button>
  <button data-ann="clear">清除</button>
</div>

<div class="player" id="player">
  <button id="pPrev" title="上一句">⏮</button>
  <button id="pPlay" class="main" title="播放/暂停">▶</button>
  <button id="pNext" title="下一句">⏭</button>
  <div class="now" id="pNow"></div>
  <button id="pSet" title="设置">⚙</button>
</div>
<button class="back-top" id="backTop" hidden>↑</button>

<script id="data" type="application/json">{"repeat": [{"id": "mock-1", "n": 1, "en": "Grocery Store", "zh": "杂货店", "scenario": "You are working a part-time job at a grocery store near campus. You are being trained to assist customers. Listen to your trainer and repeat what he says. Repeat only once.", "cats": [2], "items": [{"en": "Milk and yogurt are in the dairy section.", "zh": "牛奶和酸奶在乳制品区。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0121b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121b-repeat-q1.webp"}, {"en": "Bread is freshly baked on site every day.", "zh": "面包每天都是现场新鲜烘焙的。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0121b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121b-repeat-q2.webp"}, {"en": "We have a huge selection of fresh fruits and vegetables.", "zh": "我们有种类极其丰富的新鲜水果和蔬菜。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0121b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121b-repeat-q3.webp"}, {"en": "This flyer has all our weekly deals and special discounts.", "zh": "这份传单上有我们本周所有的特惠和特别折扣。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0121b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121b-repeat-q4.webp"}, {"en": "The checkout counter is located at the front of the store.", "zh": "收银台位于商店的前部。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0121b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121b-repeat-q5.webp"}, {"en": "If you need help while shopping, please don't hesitate to ask a full time store associate.", "zh": "如果您购物时需要帮助，请随时询问全职店员。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0121b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121b-repeat-q6.webp"}, {"en": "Download our app and sign up for our newsletter to stay informed about upcoming sales.", "zh": "下载我们的应用程序并注册我们的新闻通讯，以了解即将进行的促销活动。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0121b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121b-repeat-q7.webp"}]}, {"id": "mock-2", "n": 2, "en": "Student Help Desk", "zh": "学生服务台", "scenario": "You are working at the student help desk. Your manager is teaching you how to help new students learn how to use the university's email system. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [1], "items": [{"en": "Check your inbox for new messages.", "zh": "检查收件箱是否有新消息。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0121c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121c-repeat-q1.webp"}, {"en": "Select Compose to write your e-mail.", "zh": "选择撰写以编写您的电子邮件。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0121c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121c-repeat-q2.webp"}, {"en": "Select from your contacts list to add recipients to your note.", "zh": "从您的联系人列表中选择以向您的邮件添加收件人。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0121c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121c-repeat-q3.webp"}, {"en": "Review sent items to confirm your messages were delivered.", "zh": "查看已发送项目以确认您的消息已发送。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0121c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121c-repeat-q4.webp"}, {"en": "Use folders to organize your correspondence efficiently.", "zh": "使用文件夹高效地组织您的通信。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0121c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121c-repeat-q5.webp"}, {"en": "Set up a few topical filters to manage incoming communications.", "zh": "设置一些主题过滤器来管理传入的通信。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0121c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121c-repeat-q6.webp"}, {"en": "To be safe, remember to log out to keep your electronic mail secure in our system.", "zh": "为安全起见，请记住登出，以在我们的系统中保持您的电子邮件安全。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0121c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0121c-repeat-q7.webp"}]}, {"id": "mock-3", "n": 3, "en": "Woodworking Class", "zh": "木工课", "scenario": "You are learning to guide new students on how to use tools in a woodworking class. Listen to the speaker and repeat what she says. Repeat only once.", "cats": [0], "items": [{"en": "Welcome to the wood shop.", "zh": "欢迎来到木工坊。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0127a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127a-repeat-q1.webp"}, {"en": "This tool box contains everything you should need.", "zh": "这个工具箱包含了你可能需要的所有东西。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0127a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127a-repeat-q2.webp"}, {"en": "You will learn to use your saw in our classes.", "zh": "你将在我们的课程中学习使用锯子。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0127a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127a-repeat-q3.webp"}, {"en": "Your screwdriver can be used with all of our carpentry machines.", "zh": "你的螺丝刀可以配合我们所有的木工机器使用。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0127a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127a-repeat-q4.webp"}, {"en": "All wood will need to be smooth, so use the sand paper provided.", "zh": "所有的木材都需要打磨光滑，所以请使用提供的砂纸。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0127a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127a-repeat-q5.webp"}, {"en": "Use only what is needed so that your supplies last all quarter.", "zh": "只使用所需的材料，以便你的 supplies 能够支撑整个学期。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0127a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127a-repeat-q6.webp"}, {"en": "Before you leave the class room, be sure to put all your tools back into the tool box.", "zh": "离开教室前，请务必将所有工具放回工具箱。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0127a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127a-repeat-q7.webp"}]}, {"id": "mock-4", "n": 4, "en": "University Open House", "zh": "大学开放日", "scenario": "You are learning to assist visitors at a university open house. Listen to the speaker and repeat what she says. Repeat only once.", "cats": [3], "items": [{"en": "Welcome to our campus tour.", "zh": "欢迎参加我们的校园参观。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0127b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127b-repeat-q1.webp"}, {"en": "The enrollment office is straight ahead.", "zh": "招生办公室就在正前方。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0127b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127b-repeat-q2.webp"}, {"en": "Next door you will see the library.", "zh": "隔壁就是图书馆。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0127b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127b-repeat-q3.webp"}, {"en": "The cafeteria has many meal options available.", "zh": "食堂提供多种餐饮选择。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0127b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127b-repeat-q4.webp"}, {"en": "A university lecture hall is located over here.", "zh": "大学演讲厅位于这边。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0127b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127b-repeat-q5.webp"}, {"en": "If you have any questions, please stop by the information desk.", "zh": "如果您有任何问题，请到咨询台咨询。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0127b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127b-repeat-q6.webp"}, {"en": "Lastly, please also remember to check the event schedule at the entrance.", "zh": "最后，也请记得在入口处查看活动日程。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0127b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0127b-repeat-q7.webp"}]}, {"id": "mock-5", "n": 5, "en": "Botanical Garden", "zh": "植物园", "scenario": "You are volunteering at a botanical garden near your university. Listen to your trainer and repeat what he says. Repeat only once.", "cats": [7], "items": [{"en": "You can buy tickets at the entrance.", "zh": "你可以在入口处买票。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0128a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128a-repeat-q1.webp"}, {"en": "The Rose Garden is beautiful this season.", "zh": "这个季节的玫瑰园很美。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0128a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128a-repeat-q2.webp"}, {"en": "The pond is a popular spot for sitting and relaxing.", "zh": "这个池塘是人们坐下休息的热门地点。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0128a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128a-repeat-q3.webp"}, {"en": "Visit the greenhouse for a variety of exotic plants.", "zh": "去温室看看各种各样的异国植物。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0128a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128a-repeat-q4.webp"}, {"en": "Check the bulletin board for information about guided tours.", "zh": "查看公告板了解导览游的信息。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0128a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128a-repeat-q5.webp"}, {"en": "The gift shop offers souvenirs and gardening books at reasonable prices.", "zh": "礼品店提供价格合理的纪念品和园艺书籍。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0128a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128a-repeat-q6.webp"}, {"en": "Enjoy your lunch at our cafe, which has outdoor seating overlooking the grounds.", "zh": "在我们的咖啡馆享用午餐吧，那里有俯瞰园景的户外座位。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0128a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128a-repeat-q7.webp"}]}, {"id": "mock-6", "n": 6, "en": "Class Registration", "zh": "课程注册", "scenario": "You are being trained to help new students register for classes. Listen to your trainer and repeat what she says. Repeat only once.", "cats": [1], "items": [{"en": "Enter your name and student ID number.", "zh": "输入你的姓名和学号。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0128b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128b-repeat-q1.webp"}, {"en": "Browse the course catalog to choose your classes.", "zh": "浏览课程目录来选择你的课程。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0128b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128b-repeat-q2.webp"}, {"en": "You can use the Schedule Planner tool to avoid time conflicts.", "zh": "你可以使用课程计划工具来避免时间冲突。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0128b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128b-repeat-q3.webp"}, {"en": "If a class is already full, a pop up message will appear.", "zh": "如果一门课已满，会弹出提示信息。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0128b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128b-repeat-q4.webp"}, {"en": "Contact the instructor to see if more seats can be added.", "zh": "联系授课老师，看看是否可以增加更多名额。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0128b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128b-repeat-q5.webp"}, {"en": "You can still add or drop classes up until the second week of the new semester.", "zh": "在新学期的第二周之前，你仍然可以增减课程。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0128b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128b-repeat-q6.webp"}, {"en": "For your records, print out a list of your classes or e-mail a copy to yourself.", "zh": "为了留存记录，请打印一份你的课程清单或给自己发一份电子邮件副本。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0128b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0128b-repeat-q7.webp"}]}, {"id": "mock-7", "n": 7, "en": "Wildlife Sanctuary", "zh": "野生动物保护区", "scenario": "You have an internship at a wildlife sanctuary. Your manager is teaching you how to assist visitors there. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [7], "items": [{"en": "You will see birds living in their treetop homes.", "zh": "你会看到鸟儿生活在它们树顶的家中。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0201a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201a-repeat-q1.webp"}, {"en": "This space houses animals from Africa.", "zh": "这个空间饲养着来自非洲的动物。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0201a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201a-repeat-q2.webp"}, {"en": "Many reptiles live here, including snakes, lizards and turtles.", "zh": "许多爬行动物生活在这里，包括蛇、蜥蜴和乌龟。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0201a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201a-repeat-q3.webp"}, {"en": "Brightly colored butterflies are found in this peaceful area.", "zh": "色彩鲜艳的蝴蝶在这个宁静的区域被发现。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0201a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201a-repeat-q4.webp"}, {"en": "Staff are available to explain the displays in more detail.", "zh": "工作人员可以更详细地讲解展品。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0201a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201a-repeat-q5.webp"}, {"en": "Guides lead nature walks, highlighting native species and protected habitats.", "zh": "导游带领自然徒步，重点介绍本地物种和受保护的栖息地。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0201a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201a-repeat-q6.webp"}, {"en": "To explore locations, trail paths, and key features, you can download the map for free.", "zh": "要探索地点、步道路径和关键特征，您可以免费下载地图。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0201a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201a-repeat-q7.webp"}]}, {"id": "mock-8", "n": 8, "en": "Community Center", "zh": "社区中心", "scenario": "You are volunteering at a community center as part of a course requirement. Your manager is training you to assist visitors there. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [4], "items": [{"en": "The cafe offers refreshments and snacks.", "zh": "这家咖啡馆提供茶点和小吃。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0201b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201b-repeat-q1.webp"}, {"en": "Rooms can be reserved for group gatherings.", "zh": "房间可用于团体聚会的预订。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0201b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201b-repeat-q2.webp"}, {"en": "The art studio offers classes and workshops every day.", "zh": "该艺术工作室每天提供课程和研讨会。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0201b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201b-repeat-q3.webp"}, {"en": "The library provides books, learning resources and more.", "zh": "图书馆提供书籍、学习资源及更多服务。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0201b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201b-repeat-q4.webp"}, {"en": "The gymnasium is used for sports and fitness activities.", "zh": "体育馆用于体育和健身活动。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0201b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201b-repeat-q5.webp"}, {"en": "Staff are available for assistance with facility reservations.", "zh": "工作人员可协助设施预订。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0201b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201b-repeat-q6.webp"}, {"en": "Because this is a new center, help is available at no additional cost.", "zh": "由于这是一个新中心，帮助服务免费提供。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0201b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0201b-repeat-q7.webp"}]}, {"id": "mock-9", "n": 9, "en": "Sporting Event", "zh": "体育赛事", "scenario": "You are working at a university. Your manager is teaching you how to assist people at a university sporting event. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [6], "items": [{"en": "You can select your section and seat.", "zh": "你可以选择你的区域和座位。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0201c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0201c-repeat-q1.webp"}, {"en": "We have many different snacks and drinks for sale.", "zh": "我们有许多不同的小吃和饮料出售。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0201c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0201c-repeat-q2.webp"}, {"en": "Family toilets are located by each of the sections.", "zh": "家庭洗手间位于每个区域旁边。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0201c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0201c-repeat-q3.webp"}, {"en": "Tickets and season passes are available near the front gate.", "zh": "门票和季票可在前门附近购买。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0201c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0201c-repeat-q4.webp"}, {"en": "The visitor entrance to the stadium is through here.", "zh": "体育场的游客入口在这里。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0201c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0201c-repeat-q5.webp"}, {"en": "Should you have questions about maps or event times, there are staff that can assist you.", "zh": "如果您对地图或活动时间有疑问，有工作人员可以提供帮助。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0201c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0201c-repeat-q6.webp"}, {"en": "You can download the map to your phone or tablet if you need any help navigating.", "zh": "如果您需要导航帮助，可以将地图下载到您的手机或平板电脑上。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0201c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0201c-repeat-q7.webp"}]}, {"id": "mock-10", "n": 10, "en": "University Tech Store", "zh": "大学科技商店", "scenario": "You are being trained to assist customers at a university tech store. Listen to your trainer and repeat what she says. Repeat only once.", "cats": [2], "items": [{"en": "Laptops are located in this aisle.", "zh": "笔记本电脑位于这个过道。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0202-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0202-repeat-q1.webp"}, {"en": "We have a wide assortment of headphones.", "zh": "我们有各式各样的耳机。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0202-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0202-repeat-q2.webp"}, {"en": "To pick up an online order, go to the checkout counter.", "zh": "取线上订单请到收银台。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0202-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0202-repeat-q3.webp"}, {"en": "Get a phone case for free if you purchase a smartphone from us.", "zh": "购买我们的智能手机可免费获得手机壳。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0202-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0202-repeat-q4.webp"}, {"en": "Sign up for a membership to receive member-only discounts.", "zh": "注册会员可享受会员专属折扣。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0202-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0202-repeat-q5.webp"}, {"en": "You can return unused products for a full refund within one week of purchase.", "zh": "购买后一周内，未使用的产品可全额退款。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0202-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0202-repeat-q6.webp"}, {"en": "We are here to help if you need advice on which model is most suitable for your needs.", "zh": "如果您需要关于哪款型号最适合您需求的建议，我们乐意提供帮助。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0202-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0202-repeat-q7.webp"}]}, {"id": "mock-11", "n": 11, "en": "University Library", "zh": "大学图书馆", "scenario": "You are working a part-time job at the university library. Your manager is training you to help visitors use the library's resources. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [5], "items": [{"en": "The computer lab has free Wi-Fi access.", "zh": "计算机实验室提供免费Wi-Fi。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0210-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0210-repeat-q5.webp"}, {"en": "The reading room is a quiet space for patrons.", "zh": "阅览室是供读者使用的安静空间。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0210-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0210-repeat-q1.webp"}, {"en": "The children's section has books and activities for kids.", "zh": "儿童区有适合孩子的书籍和活动。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0210-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0210-repeat-q4.webp"}, {"en": "The reference desk can provide assistance for research projects.", "zh": "参考咨询台可以为研究项目提供帮助。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0210-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0210-repeat-q3.webp"}, {"en": "Study rooms can be reserved for group work and other meetings.", "zh": "自习室可以预约用于小组作业和其他会议。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0210-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0210-repeat-q7.webp"}, {"en": "Library staff are available for help finding resources here or at other locations.", "zh": "图书馆工作人员可以协助您查找本馆或其他地点的资源。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0210-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0210-repeat-q2.webp"}, {"en": "If you are looking for other specific locations and services, please use our guide.", "zh": "如果您在寻找其他特定位置和服务，请使用我们的指南。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0210-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0210-repeat-q6.webp"}]}, {"id": "mock-12", "n": 12, "en": "Library Orientation", "zh": "图书馆入学指导", "scenario": "You are working at the university library. Your manager is training you to give new students an orientation. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [5], "items": [{"en": "The library books are located here.", "zh": "图书馆的书籍位于此处。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0225-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0225-repeat-q6.webp"}, {"en": "Study rooms can be reserved for group work.", "zh": "学习室可预订用于小组作业。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0225-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0225-repeat-study-rooms.webp"}, {"en": "Our computer lab has workstations with internet access.", "zh": "我们的计算机实验室设有可联网的工作站。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0225-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0225-repeat-q3.webp"}, {"en": "Seek help at the reference desk for any research assistance.", "zh": "如需任何研究协助，请到参考咨询台寻求帮助。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0225-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0225-repeat-q1.webp"}, {"en": "Tasty refreshments and healthy snacks are at the basement cafe.", "zh": "地下层的咖啡厅提供美味的点心和健康的零食。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0225-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0225-repeat-q4.webp"}, {"en": "For your convenience, we have a map with a list of sections and resources.", "zh": "为方便您，我们提供了一份包含各区域和资源列表的地图。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0225-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0225-repeat-q2.webp"}, {"en": "If you have general or specific questions, our staff are here to meet your needs.", "zh": "如果您有任何一般或具体问题，我们的工作人员在这里满足您的需求。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0225-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0225-repeat-q7.webp"}]}, {"id": "mock-13", "n": 13, "en": "Weather Report", "zh": "天气预报", "scenario": "You are learning how to give the weather report for the university radio station. Listen to the speaker and repeat what she says. Repeat only once.", "cats": [4], "items": [{"en": "Today will be sunny and clear.", "zh": "今天将是晴朗的一天。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0228-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0228-repeat-q1.webp"}, {"en": "Expect cloudy conditions in the afternoon.", "zh": "预计下午将转为多云天气。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0228-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0228-repeat-q2.webp"}, {"en": "Rain showers are predicted for the evening.", "zh": "预计晚间将有阵雨。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0228-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0228-repeat-q3.webp"}, {"en": "Temperatures will range from 15 to 20 degrees Celsius.", "zh": "气温将在15至20摄氏度之间。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0228-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0228-repeat-q4.webp"}, {"en": "Winds will be light around 10 kilometers per hour.", "zh": "风力轻微，风速约每小时10公里。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0228-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0228-repeat-q5.webp"}, {"en": "Keep an umbrella handy for possible evening rain.", "zh": "请随身携带雨伞，以防晚间下雨。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0228-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0228-repeat-q6.webp"}, {"en": "When you need a weather update, check out our new online app, now available all day.", "zh": "当您需要天气更新时，请查看我们的新在线应用，全天候可用。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0228-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0228-repeat-q7.webp"}]}, {"id": "mock-14", "n": 14, "en": "Birdwatching", "zh": "观鸟", "scenario": "You are being trained to explain birdwatching to learners in a nature reserve. Listen to your trainer and repeat what the trainer says. Repeat only once.", "cats": [0], "items": [{"en": "Look toward the treetops, where you may find nests.", "zh": "朝树梢看去，你可能会找到鸟巢。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-04xx-lr06-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr06-repeat-q1.webp"}, {"en": "Note details to help identify birds.", "zh": "记下细节以帮助识别鸟类。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-04xx-lr06-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr06-repeat-q2.webp"}, {"en": "Keep a record of each sighting to share later with the group.", "zh": "记录下每次目击的情况，以便稍后与小组分享。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-04xx-lr06-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr06-repeat-q3.webp"}, {"en": "Wear proper footwear to keep from slipping while exploring outdoors.", "zh": "穿着合适的鞋子，以防在户外探索时滑倒。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-04xx-lr06-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr06-repeat-q4.webp"}, {"en": "Keep your head covered to protect yourself from the sun during the walk.", "zh": "在散步时，请遮盖头部以防日晒。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-04xx-lr06-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr06-repeat-q5.webp"}, {"en": "When getting ready for a day outdoors, be sure to pack the essentials.", "zh": "为户外活动做准备时，务必打包好必需品。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-04xx-lr06-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr06-repeat-q6.webp"}, {"en": "If you spot a bird nearby, avoid sudden movements so it does not fly away.", "zh": "如果你在附近发现了一只鸟，请避免突然移动，以免它飞走。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-04xx-lr06-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-04xx-lr06-repeat-q7.webp"}]}, {"id": "mock-15", "n": 15, "en": "Clothing Store", "zh": "服装店", "scenario": "You are working a part-time job at a clothing store near campus. Your manager is training you to assist customers at the store. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [2], "items": [{"en": "The women's clothing section is this way.", "zh": "女装区在这边。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0302b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302b-repeat-q1.webp"}, {"en": "Our men's corner has shirts, trousers, and jackets.", "zh": "我们的男士专区有衬衫、裤子和夹克。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0302b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302b-repeat-q2.webp"}, {"en": "Our accessories are on display near the entrance.", "zh": "我们的配饰在入口附近展示。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0302b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302b-repeat-q3.webp"}, {"en": "Fitting rooms are available here for trying on clothes.", "zh": "这里有试衣间供您试穿衣服。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0302b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302b-repeat-q4.webp"}, {"en": "The checkout for payment is by the exit when you're ready.", "zh": "准备付款时，结账台在出口处。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0302b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302b-repeat-q5.webp"}, {"en": "Ask the store associates if you need help locating specific items.", "zh": "如果需要帮助寻找特定商品，请咨询店员。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0302b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302b-repeat-q6.webp"}, {"en": "If you get lost, check the store map for the layout and location of departments.", "zh": "如果迷路了，可以查看商店地图了解各部门的布局和位置。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0302b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302b-repeat-q7.webp"}]}, {"id": "mock-16", "n": 16, "en": "Library Printing Services", "zh": "图书馆打印服务", "scenario": "You are being trained to show students how to use the campus library's printing services. Listen to the speaker and repeat what he says. Repeat only once.", "cats": [5], "items": [{"en": "Welcome to the Help Desk.", "zh": "欢迎来到服务台。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0304-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0304-repeat-q1.webp"}, {"en": "First, select the printer from your computer.", "zh": "首先，从你的电脑上选择打印机。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0304-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0304-repeat-q2.webp"}, {"en": "Check the paper tray supply before you start.", "zh": "开始前请检查纸盒的纸张供应。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0304-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0304-repeat-q3.webp"}, {"en": "You can use your student ID for any other services.", "zh": "你可以使用学生证办理任何其他服务。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0304-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0304-repeat-q4.webp"}, {"en": "You can pay at the payment kiosk if you prefer that method.", "zh": "如果你更喜欢这种方式，可以在付款亭付款。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0304-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0304-repeat-q5.webp"}, {"en": "The help desk is available if you need assistance.", "zh": "如果你需要帮助，服务台随时可用。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0304-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0304-repeat-q6.webp"}, {"en": "When you are ready, simply select Print from your computer and retrieve your document.", "zh": "当你准备好后，只需从你的电脑上选择打印，然后取回文件。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0304-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0304-repeat-q7.webp"}]}, {"id": "mock-17", "n": 17, "en": "Dining Hall Tour", "zh": "食堂参观", "scenario": "You are being trained to give a tour of the dining hall. Listen to the speaker and repeat what he says. Repeat only once.", "cats": [3], "items": [{"en": "Let's tour the dining hall.", "zh": "我们参观一下餐厅吧。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0306-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0306-repeat-q1.webp"}, {"en": "The food station is here.", "zh": "食品站在这里。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0306-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0306-repeat-q2.webp"}, {"en": "Our seating area is very roomy.", "zh": "我们的用餐区非常宽敞。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0306-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0306-repeat-q3.webp"}, {"en": "The beverage machines provide students with drinks and refreshments.", "zh": "饮料机为学生提供饮料和点心。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0306-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0306-repeat-q4.webp"}, {"en": "The cashier will take your payment for your food and drinks over here.", "zh": "收银员会在这里收取您食物和饮料的费用。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0306-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0306-repeat-q5.webp"}, {"en": "Remember to clean up after you eat and throw away your trash.", "zh": "记得用餐后清理并扔掉垃圾。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0306-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0306-repeat-q6.webp"}, {"en": "If you want to know what is being offered, just check the daily menu for special dishes.", "zh": "如果您想知道有什么供应，只需查看每日菜单上的特色菜。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0306-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0306-repeat-q7.webp"}]}, {"id": "mock-18", "n": 18, "en": "Computer Lab", "zh": "计算机实验室", "scenario": "You are working at a university's computer lab. Your manager is training you to assist new students. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [1], "items": [{"en": "Use your email address to log in.", "zh": "使用您的电子邮箱地址登录。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0310-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0310-repeat-q1.webp"}, {"en": "You can print all your documents here.", "zh": "您可以在这里打印所有文件。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0310-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0310-repeat-q2.webp"}, {"en": "You can also access the scanners in this corner free of charge.", "zh": "您也可以免费使用这个角落的扫描仪。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0310-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0310-repeat-q3.webp"}, {"en": "Visit the help desk to solve any technical problems.", "zh": "请到服务台解决任何技术问题。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0310-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0310-repeat-q4.webp"}, {"en": "Check to make sure the Wi-Fi connection is stable and secure.", "zh": "请检查以确保Wi-Fi连接稳定且安全。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0310-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0310-repeat-q5.webp"}, {"en": "Remember to save your work frequently to avoid data loss or corruption.", "zh": "请记得频繁保存您的工作，以避免数据丢失或损坏。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0310-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0310-repeat-q6.webp"}, {"en": "If you are unsure when the lab is open, you can check the weekly schedule here.", "zh": "如果您不确定实验室何时开放，可以在这里查看每周时间表。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0310-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0310-repeat-q7.webp"}]}, {"id": "mock-19", "n": 19, "en": "Video Equipment Tutorial", "zh": "视频设备教程", "scenario": "You are learning how to give a tutorial on the video equipment for faculty to use in the classroom. Listen to the speaker and repeat what he says. Repeat only once.", "cats": [1], "items": [{"en": "Your equipment is ready.", "zh": "您的设备已准备就绪。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0314-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0314-repeat-q7.webp"}, {"en": "You can use this station for projection.", "zh": "您可以使用这个工位进行投影。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0314-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0314-repeat-q1.webp"}, {"en": "This computer connects to the monitor.", "zh": "这台电脑连接到显示器。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0314-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0314-repeat-q5.webp"}, {"en": "We also provide a microphone for use in presentations.", "zh": "我们还提供麦克风供演讲时使用。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0314-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0314-repeat-q3.webp"}, {"en": "You should check your connections before you start to present.", "zh": "在开始演讲之前，您应该检查一下您的连接。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0314-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0314-repeat-q4.webp"}, {"en": "Remember to upload your slides so you can display them with ease.", "zh": "记得上传您的幻灯片，以便轻松展示。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0314-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0314-repeat-q2.webp"}, {"en": "If you find yourself needing assistance, call us on the helpline and we will assist you.", "zh": "如果您需要帮助，请拨打我们的帮助热线，我们将为您提供协助。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0314-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0314-repeat-q6.webp"}]}, {"id": "mock-20", "n": 20, "en": "Bicycle Repair Workshop", "zh": "自行车修理工坊", "scenario": "You have a part-time job working at a bicycle repair workshop near campus. The technician is showing you how to train people to fix a flat tire. Listen to the technician and repeat what the technician says. Repeat only once.", "cats": [0], "items": [{"en": "First, select the right tool to remove the wheel.", "zh": "首先，选择正确的工具来拆下车轮。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0317-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test2-repeat-q1.webp"}, {"en": "Next, deflate the tire completely.", "zh": "接下来，将轮胎完全放气。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0317-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test2-repeat-q2.webp"}, {"en": "Carefully locate the puncture hole and mark it with a pen.", "zh": "仔细找到破洞，并用笔标记出来。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0317-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test2-repeat-q3.webp"}, {"en": "Select a patch from the repair kit and apply it firmly.", "zh": "从修理包中取出一块补胎片，并牢固地贴上。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0317-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test2-repeat-q4.webp"}, {"en": "Use the pump to inflate the tire to the correct pressure.", "zh": "使用打气筒将轮胎充气至正确的气压。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0317-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test2-repeat-q5.webp"}, {"en": "Check for additional leaks by submerging the tube in a bucket of water.", "zh": "将内胎浸入一桶水中，以检查是否有其他漏气点。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0317-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test2-repeat-q6.webp"}, {"en": "If there are no new problems, reattach the wheel securely to the bicycle.", "zh": "如果没有新问题，将车轮牢固地重新安装到自行车上。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0317-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test2-repeat-q7.webp"}]}, {"id": "mock-21", "n": 21, "en": "Tourist Landmarks", "zh": "旅游地标", "scenario": "You are working a summer internship for the city. Your supervisor is teaching you how to provide tourists information about landmarks. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [4], "items": [{"en": "This castle is famous for its towers.", "zh": "这座城堡以其塔楼而闻名。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0204c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0204c-repeat-q1.webp"}, {"en": "The statue celebrates important events.", "zh": "这座雕像纪念重要的事件。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0204c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0204c-repeat-q2.webp"}, {"en": "Visit the market to buy local goods and fresh produce.", "zh": "去市场购买当地商品和新鲜农产品。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0204c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0204c-repeat-q3.webp"}, {"en": "The park is perfect for relaxing and outdoor activities.", "zh": "这个公园非常适合放松和进行户外活动。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0204c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0204c-repeat-q4.webp"}, {"en": "See the art displays and historical relics at the museum.", "zh": "参观博物馆的艺术品和历史文物。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0204c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0204c-repeat-q5.webp"}, {"en": "Guided city tours provide detailed information about each landmark.", "zh": "导游带领的城市观光提供每个地标的详细信息。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0204c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0204c-repeat-q6.webp"}, {"en": "If needed, check out the city map for directions and transportation options.", "zh": "如有需要，可以查看城市地图了解方向和交通选项。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0204c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0204c-repeat-q7.webp"}]}, {"id": "mock-22", "n": 22, "en": "Botanical Garden", "zh": "植物园", "scenario": "You are working at a botanical garden at your university. Your manager is training you to help visitors at the garden. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [7], "items": [{"en": "Check the map for specific collections.", "zh": "查看地图了解具体的收藏品。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0208c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0208c-repeat-q1.webp"}, {"en": "Tropical plants are housed in the greenhouse.", "zh": "热带植物陈列在温室里。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0208c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0208c-repeat-q2.webp"}, {"en": "Water features like ponds and fountains add tranquility.", "zh": "像池塘和喷泉这样的水景增添了宁静。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0208c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0208c-repeat-q3.webp"}, {"en": "The visitor center also sells souvenirs and some snacks.", "zh": "游客中心也出售纪念品和一些零食。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0208c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0208c-repeat-q4.webp"}, {"en": "The herb garden includes culinary and medicinal plants.", "zh": "草药园包括烹饪和药用植物。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0208c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0208c-repeat-q5.webp"}, {"en": "The garden features many varieties of roses that are only cultivated here.", "zh": "这个花园有许多只在此处培育的玫瑰品种。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0208c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0208c-repeat-q6.webp"}, {"en": "If you are interested in a deeper understanding, guided tours are offered hourly.", "zh": "如果您有兴趣更深入地了解，每小时都有导览服务。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0208c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0208c-repeat-q7.webp"}]}, {"id": "mock-23", "n": 23, "en": "Home Improvement Store", "zh": "家居建材商店", "scenario": "You are working a part-time job at a home improvement store near campus. Your manager is training you to assist customers at the store. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [2], "items": [{"en": "Lighting is located near the entrance.", "zh": "照明位于入口附近。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0316b-speaking-q1-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0316b-repeat-p1.webp"}, {"en": "Flooring includes tile, wood, and carpet.", "zh": "地板材料包括瓷砖、木材和地毯。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0316b-speaking-q2-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0316b-repeat-p2.webp"}, {"en": "A wide variety of paint colors are available.", "zh": "提供多种油漆颜色。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0316b-speaking-q3-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0316b-repeat-p3.webp"}, {"en": "The tools area has everything from hammers to drills.", "zh": "工具区有从锤子到电钻等各种工具。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0316b-speaking-q4-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0316b-repeat-p4.webp"}, {"en": "Garden supplies are available at the back of the store.", "zh": "园艺用品在商店后部提供。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0316b-speaking-q5-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0316b-repeat-p5.webp"}, {"en": "Anyone returning an item should be directed to the service desk.", "zh": "任何退货的顾客都应被引导至服务台。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0316b-speaking-q6-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0316b-repeat-p6.webp"}, {"en": "Customers may need help in many sections, so move around the store to assist them.", "zh": "顾客可能需要在许多区域得到帮助，因此请在店内走动以协助他们。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0316b-speaking-q7-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0316b-repeat-p7.webp"}]}, {"id": "mock-24", "n": 24, "en": "University Gym", "zh": "大学健身房", "scenario": "You are working at the university gym. Your manager is teaching you how to assist students there. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [6], "items": [{"en": "Soccer matches and practice take place here.", "zh": "足球比赛和训练在这里进行。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0318-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test1-repeat-q1.webp"}, {"en": "You can practice basketball or play games.", "zh": "你可以练习篮球或进行比赛。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0318-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test1-repeat-q2.webp"}, {"en": "Be sure to reserve a court in advance to play tennis.", "zh": "请务必提前预约球场来打网球。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0318-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test1-repeat-q3.webp"}, {"en": "Enjoy a swim or unwind in the water with your friends.", "zh": "享受游泳，或和朋友在水中放松。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0318-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test1-repeat-q4.webp"}, {"en": "Various exercise equipment is available here.", "zh": "这里有各种健身器材可供使用。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0318-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test1-repeat-q5.webp"}, {"en": "Personal trainers are available for individual guidance for a small price.", "zh": "私人教练可提供个人指导，只需支付少量费用。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0318-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test1-repeat-q6.webp"}, {"en": "If you need help getting around, check the map for specific areas and facilities.", "zh": "如果您需要帮助游览，请查看地图了解具体区域和设施。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0318-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/test1-repeat-q7.webp"}]}, {"id": "mock-25", "n": 25, "en": "Online Learning Platform", "zh": "在线学习平台", "scenario": "You are being trained to help students use the university's online learning platform. Listen to your trainer and repeat what she says. Repeat only once.", "cats": [1], "items": [{"en": "Log into the dashboard with your credentials.", "zh": "使用您的登录凭证登录仪表盘。", "audio": "https://wofo.cc/toefl/speaking-media/Milo-piece-0323a-speaking-q1-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0323a-repeat-p1.webp"}, {"en": "Check the assignments tab for homework due dates.", "zh": "在“作业”标签页查看作业截止日期。", "audio": "https://wofo.cc/toefl/speaking-media/Milo-piece-0323a-speaking-q2-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0323a-repeat-p2.webp"}, {"en": "Access your course materials to read and download them.", "zh": "访问您的课程材料进行阅读和下载。", "audio": "https://wofo.cc/toefl/speaking-media/Milo-piece-0323a-speaking-q3-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0323a-repeat-p3.webp"}, {"en": "Participate in discussion boards to engage with peers.", "zh": "参与讨论区，与同伴互动。", "audio": "https://wofo.cc/toefl/speaking-media/Milo-piece-0323a-speaking-q4-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0323a-repeat-p4.webp"}, {"en": "Track your progress by viewing your grades regularly online.", "zh": "通过定期在线查看成绩来跟踪您的学习进度。", "audio": "https://wofo.cc/toefl/speaking-media/Milo-piece-0323a-speaking-q5-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0323a-repeat-p5.webp"}, {"en": "Set up your daily notifications to stay updated on any new posts.", "zh": "设置每日通知，以随时了解任何新帖子。", "audio": "https://wofo.cc/toefl/speaking-media/Milo-piece-0323a-speaking-q6-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0323a-repeat-p6.webp"}, {"en": "Please use the help section we provided if you feel the need to resolve any issues.", "zh": "如果您需要解决任何问题，请使用我们提供的帮助部分。", "audio": "https://wofo.cc/toefl/speaking-media/Milo-piece-0323a-speaking-q7-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0323a-repeat-p7.webp"}]}, {"id": "mock-26", "n": 26, "en": "Baking Cookies", "zh": "烤饼干", "scenario": "You are volunteering at the local community center near campus. A chef is training you how to teach children the steps for baking cookies. Listen to the chef and repeat what the chef says. Repeat only once.", "cats": [0], "items": [{"en": "Begin by mixing the butter and sugar.", "zh": "首先，混合黄油和糖。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0324-speaking-q1-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0324-repeat-p1.webp"}, {"en": "Spread the dough so the cookies bake evenly.", "zh": "把面团摊开，这样饼干才能烤得均匀。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0324-speaking-q2-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0324-repeat-p2.webp"}, {"en": "Preheat the oven to the appropriate temperature.", "zh": "将烤箱预热到合适的温度。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0324-speaking-q3-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0324-repeat-p3.webp"}, {"en": "Evenly space the cookie shapes on the baking sheet.", "zh": "在烤盘上均匀地摆放饼干形状。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0324-speaking-q4-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0324-repeat-p4.webp"}, {"en": "Insert the tray and bake until the cookie edges are golden.", "zh": "放入烤盘，烘烤至饼干边缘呈金黄色。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0324-speaking-q5-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0324-repeat-p5.webp"}, {"en": "After the baking time is complete, cool the cookies on the rack for five minutes.", "zh": "烘烤时间结束后，将饼干在烤架上冷却五分钟。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0324-speaking-q6-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0324-repeat-p6.webp"}, {"en": "Pour yourself a glass of milk and enjoy warm cookies fresh out of the oven.", "zh": "给自己倒一杯牛奶，享用刚出炉的热饼干。", "audio": "https://wofo.cc/toefl/speaking-media/Mia-piece-0324-speaking-q7-samevoice.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0324-repeat-p7.webp"}]}, {"id": "mock-27", "n": 27, "en": "Gym Equipment", "zh": "健身器材", "scenario": "You are explaining how to use the university's gym equipment. Listen to the speaker and repeat what he says. Repeat only once.", "cats": [6], "items": [{"en": "Let's begin our gym tour.", "zh": "让我们开始健身房导览吧。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0326-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0326-repeat-p1.webp"}, {"en": "You can start with a warm-up on the treadmill.", "zh": "你可以先在跑步机上做个热身。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0326-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0326-repeat-p2.webp"}, {"en": "We have a weights area for strength training.", "zh": "我们有一个用于力量训练的器械区。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0326-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0326-repeat-p3.webp"}, {"en": "Our rowing machines are best if you want a full-body workout.", "zh": "如果你想进行全身锻炼，划船机是最好的选择。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0326-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0326-repeat-p4.webp"}, {"en": "These stationary bikes can help to improve your endurance.", "zh": "这些动感单车可以帮助你提高耐力。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0326-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0326-repeat-p5.webp"}, {"en": "We also have a water fountain for guests to use when they want.", "zh": "我们还有一个饮水机，客人需要时可以随时使用。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0326-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0326-repeat-p6.webp"}, {"en": "If you find a need for assistance in any way, please ask at the help desk.", "zh": "如果你需要任何帮助，请到服务台询问。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0326-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0326-repeat-p7.webp"}]}, {"id": "mock-28", "n": 28, "en": "Maritime Museum", "zh": "海事博物馆", "scenario": "You are working in a maritime museum as part of an internship. Your manager is training you to be a tour guide at the museum. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [8], "items": [{"en": "This area shows early sailing ships.", "zh": "这个区域展示了早期的帆船。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0401a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0401a-repeat-q1.webp"}, {"en": "Some older style boats used steam for power.", "zh": "一些老式船只使用蒸汽作为动力。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0401a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0401a-repeat-q2.webp"}, {"en": "These very accurate ship models show how designs have changed.", "zh": "这些非常精确的船舶模型展示了设计是如何演变的。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0401a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0401a-repeat-q3.webp"}, {"en": "Before satellites, these tools helped sailors navigate oceans.", "zh": "在卫星出现之前，这些工具帮助水手在海洋中导航。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0401a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0401a-repeat-q4.webp"}, {"en": "Let me explain how trade routes shaped global shipping over time.", "zh": "让我来解释一下贸易路线是如何随着时间的推移塑造全球航运的。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0401a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0401a-repeat-q5.webp"}, {"en": "Feel free to ask questions if you want to know more about anything you've seen.", "zh": "如果您想了解更多您所看到的任何内容，请随时提问。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0401a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0401a-repeat-q6.webp"}, {"en": "For non-fiction books and novels about ships, be sure to visit the gift shop.", "zh": "如需关于船舶的非虚构类书籍和小说，请务必参观礼品店。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0401a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0401a-repeat-q7.webp"}]}, {"id": "mock-29", "n": 29, "en": "Amusement Park", "zh": "游乐园", "scenario": "You are working as a guide at an amusement park. Your manager is training you to help visitors at the park. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [4], "items": [{"en": "The roller coasters offer a thrilling time.", "zh": "过山车提供了刺激的体验。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0405c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260405/piece-0405c-repeat-q1.webp"}, {"en": "Water rides provide a chance to cool off.", "zh": "水上项目提供了乘凉的机会。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0405c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260405/piece-0405c-repeat-q2.webp"}, {"en": "There are special opportunities for any young guests.", "zh": "这里有为所有年轻游客准备的特别机会。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0405c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260405/piece-0405c-repeat-q3.webp"}, {"en": "Over here is the food court with many dining options.", "zh": "这边是美食广场，提供多种餐饮选择。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0405c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260405/piece-0405c-repeat-q4.webp"}, {"en": "The souvenir store sells park-themed merchandise for your shopping needs.", "zh": "纪念品商店出售以公园为主题的商品，满足您的购物需求。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0405c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260405/piece-0405c-repeat-q5.webp"}, {"en": "For more information, park maps and schedules are available at the entrance.", "zh": "如需更多信息，可在入口处获取公园地图和时刻表。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0405c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260405/piece-0405c-repeat-q6.webp"}, {"en": "If you're looking for more, check the map for ride locations and visitor amenities.", "zh": "如果您想了解更多，可以查看地图了解游乐设施位置和游客服务设施。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0405c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260405/piece-0405c-repeat-q7.webp"}]}, {"id": "mock-30", "n": 30, "en": "Making a Salad", "zh": "制作沙拉", "scenario": "You are volunteering at a community center near campus. The leader is showing you how to help schoolchildren learn how to make a salad. Listen to the leader and repeat what the leader says. Repeat only once.", "cats": [0], "items": [{"en": "First, rinse the vegetables in the sink.", "zh": "首先，在水槽里冲洗蔬菜。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0406a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406a-repeat-p1.webp"}, {"en": "Use the cutting board to chop the vegetables.", "zh": "用砧板切蔬菜。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0406a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406a-repeat-p2.webp"}, {"en": "Place the chopped vegetables into a large mixing bowl.", "zh": "将切好的蔬菜放入一个大搅拌碗中。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0406a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406a-repeat-p3.webp"}, {"en": "Add dressing slowly so the salad does not get soggy.", "zh": "慢慢加入沙拉酱，这样沙拉就不会变得软烂。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0406a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406a-repeat-p4.webp"}, {"en": "Use the tongs to toss all of the ingredients together evenly.", "zh": "用夹子将所有食材均匀地拌在一起。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0406a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406a-repeat-p5.webp"}, {"en": "Store leftover food in the container and put it in the refrigerator for later.", "zh": "将剩余的食物存放在容器中，并放入冰箱以备后用。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0406a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406a-repeat-p6.webp"}, {"en": "When the activity is finished, wash the dishes and leave the sink area clean for everyone.", "zh": "活动结束后，洗好餐具，保持水槽区域干净，方便大家使用。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0406a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406a-repeat-p7.webp"}]}, {"id": "mock-31", "n": 31, "en": "Amusement Park Tour", "zh": "游乐园导览", "scenario": "You are learning how to give a tour of an amusement park. Listen to the speaker and repeat what she says. Repeat only once.", "cats": [4], "items": [{"en": "The roller coasters offer a thrilling time.", "zh": "过山车提供了刺激的体验。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0302a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302a-repeat-q1.webp"}, {"en": "Water rides provide a chance to cool off.", "zh": "水上项目提供了降温的机会。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0302a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302a-repeat-q2.webp"}, {"en": "The children's area has rides for younger guests.", "zh": "儿童区为年龄较小的游客提供了游乐设施。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0302a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302a-repeat-q3.webp"}, {"en": "Over here is the food court with many dining options.", "zh": "这里是美食广场，有许多餐饮选择。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0302a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302a-repeat-q4.webp"}, {"en": "The souvenir store sells park-themed merchandise for your shopping needs.", "zh": "纪念品商店出售以公园为主题的商品，满足您的购物需求。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0302a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302a-repeat-q5.webp"}, {"en": "For more information, park maps and schedules are available at the entrance.", "zh": "欲了解更多信息，公园地图和时刻表可在入口处获取。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0302a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302a-repeat-q6.webp"}, {"en": "If you're looking for more, check the map for ride locations and visitor amenities.", "zh": "如果您想了解更多，可以查看地图了解游乐设施位置和游客便利设施。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0302a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260424/piece-0302a-repeat-q7.webp"}]}, {"id": "mock-32", "n": 32, "en": "Museum", "zh": "博物馆", "scenario": "You are working at a museum. Your manager is teaching you how to assist visitors at the museum. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [8], "items": [{"en": "Ancient artifacts are in the first section.", "zh": "古代文物在第一个区域。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0406b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406b-repeat-p1.webp"}, {"en": "Modern art is displayed in this gallery.", "zh": "现代艺术在这个画廊展出。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0406b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406b-repeat-p2.webp"}, {"en": "The learning labs offer activities for visitors of all ages.", "zh": "学习实验室为所有年龄段的访客提供活动。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0406b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406b-repeat-
