 "公园与休闲", "scenario": "You received an email from your university inviting you to join a research study about parks and recreational spaces. You have scheduled a short online interview with me to answer a few questions. I will ask you about your experiences and opinions related to parks and public recreation areas. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [1], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about parks and recreational spaces. First, tell me about a memorable trip that you or one of your friends took to a park or recreational area. What made it special?", "zh": "感谢你同意参与。我想问你一些关于公园和休闲空间的问题。首先，请告诉我一次你或你的朋友去公园或休闲区的难忘经历。是什么让它如此特别？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0530b-speaking-q8.m4a"}, {"en": "Thank you. Do you think parks and recreational spaces are more important for adults or for children? Why or why not?", "zh": "谢谢。你认为公园和休闲空间对成年人更重要，还是对儿童更重要？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0530b-speaking-q9.m4a"}, {"en": "I see. Some people believe that parks play a crucial role in promoting community health and well-being by providing outdoor spaces where people can relax, exercise, or play, so local governments should spend more money on them. What is your opinion? Do you agree or disagree, and why?", "zh": "明白了。有些人认为，公园通过提供人们可以放松、锻炼或玩耍的户外空间，在促进社区健康和福祉方面发挥着至关重要的作用，因此地方政府应该在这方面投入更多资金。你的看法是什么？你同意还是不同意？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0530b-speaking-q10.m4a"}, {"en": "Great. In many large cities, there is a tension between building more parks for residents to relax and play in and using that space to build more housing. Do you think the need for more housing is more important or less important than the need for parks and recreational spaces? Why?", "zh": "好的。在许多大城市，为居民建设更多公园供其放松玩耍的空间与利用该空间建造更多住房之间存在矛盾。你认为对更多住房的需求比对公园和休闲空间的需求更重要还是更不重要？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0530b-speaking-q11.m4a"}]}, {"id": "mock-40", "n": 40, "en": "Weather Experiences", "zh": "天气经历", "scenario": "You have agreed to participate in a research study about people's experiences with weather. You will have a short online interview with me. I will ask you some questions about local weather, rain, seasons, and extreme weather. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [14], "items": [{"en": "Thank you for participating. I'd like to ask you some questions about weather. First, typically, what is the weather like during the year in the place where you live?", "zh": "感谢参与。我想问你一些关于天气的问题。首先，通常情况下，你居住的地方一年中的天气是怎样的？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0601a-speaking-q8.m4a"}, {"en": "Thank you. How do you usually prepare for a day when the weather forecast predicts rain?", "zh": "谢谢。当天气预报预测有雨时，你通常如何为那一天做准备？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0601a-speaking-q9.m4a"}, {"en": "I see. If you were to choose a place to live, would you prefer consistent weather throughout the whole year or distinct seasons? Why do you have this preference?", "zh": "明白了。如果你要选择一个地方居住，你会更喜欢一年四季天气都一致，还是季节分明？为什么你有这样的偏好？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0601a-speaking-q10.m4a"}, {"en": "Great. Places experience extreme weather like sudden temperature swings or strong storms. Should communities invest more in adapting to these weather extremes? What measures would be most helpful?", "zh": "很好。有些地方会经历极端天气，比如气温骤变或强风暴。社区是否应该投入更多资源来适应这些极端天气？哪些措施会最有帮助？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0601a-speaking-q11.m4a"}]}, {"id": "mock-41", "n": 41, "en": "Exercise Routines", "zh": "运动习惯", "scenario": "You have agreed to participate in a research study about people's experiences with exercise. You will have a short online interview with me. I will ask you some questions about exercise routines, motivation, and health. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [0], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about exercise. First, if you were to have a regular exercise routine, when during the day would it occur? Why is that?", "zh": "感谢您同意参与。我想问您一些关于锻炼的问题。首先，如果您要制定一个定期的锻炼计划，它会在一天中的什么时候进行？为什么选择这个时间？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0601b-speaking-q8.m4a"}, {"en": "Thank you. If you were to design an exercise plan for yourself, what kinds of activities would you consider including and why?", "zh": "谢谢。如果您要为自己设计一个锻炼计划，您会考虑包含哪些活动类型？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0601b-speaking-q9.m4a"}, {"en": "I see. Do you think exercising alone or with others makes a difference in motivation or enjoyment?", "zh": "明白了。您认为独自锻炼和与他人一起锻炼，在动力或乐趣方面有区别吗？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0601b-speaking-q10.m4a"}, {"en": "Great. Some people believe that too much regular exercise can be detrimental to maintaining both physical and mental health. Do you agree or disagree with this belief? Why or why not?", "zh": "很好。有些人认为，过多的定期锻炼可能对维持身心健康有害。您同意还是不同意这一观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0601b-speaking-q11.m4a"}]}, {"id": "mock-42", "n": 42, "en": "Shopping & Environment", "zh": "购物与环保", "scenario": "You have signed up for a study run by a university research group that is investigating shopping habits. You will have a short online interview with me. I will ask you some questions about shopping experiences, preferences, and environmental concerns. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [11], "items": [{"en": "Thank you for taking part. I'd like to ask you some questions about shopping habits. First, when was your last shopping trip, and what did you buy? Did you have a good shopping experience?", "zh": "感谢参与。我想问你一些关于购物习惯的问题。首先，你上次购物是什么时候？买了什么？购物体验愉快吗？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0607b-speaking-q8.m4a"}, {"en": "Thank you. When you shop, which do you like better, shopping for yourself or shopping for others? Why?", "zh": "谢谢。你购物时，更喜欢为自己购物还是为他人购物？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0607b-speaking-q9.m4a"}, {"en": "I see. In recent years, people's shopping preferences have shifted in various ways. Do you think that in the future, people will continue to change how and where they shop? Why or why not?", "zh": "明白了。近年来，人们的购物偏好发生了各种变化。你认为未来人们是否会继续改变购物方式和地点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0607b-speaking-q10.m4a"}, {"en": "Great. Some people believe that buying too many products you do not need harms the environment. Do you agree with this idea? Why or why not?", "zh": "很好。有些人认为购买太多不需要的产品会损害环境。你同意这个观点吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0607b-speaking-q11.m4a"}]}, {"id": "mock-43", "n": 43, "en": "Climate & Weather", "zh": "气候与天气", "scenario": "You have volunteered for a research study about climate and weather. You will have a short online interview with me. I will ask you some questions about your experiences and opinions related to climate and extreme weather. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [14], "items": [{"en": "Thank you for joining the study. I'd like to ask you some questions about climate and weather. First, what is the climate like in the city where you live?", "zh": "感谢您参与这项研究。我想问您一些关于气候和天气的问题。首先，您所在城市的气候如何？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613a-speaking-q8.m4a"}, {"en": "Thank you. How do you prepare when the weather forecast says it will rain?", "zh": "谢谢。当天气预报说要下雨时，您会如何准备？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613a-speaking-q9.m4a"}, {"en": "I see. Would you prefer to live in a city with a mild, consistent climate or a city with four distinct seasons? Please explain your preference.", "zh": "我明白了。您更愿意生活在气候温和、四季如一的城市，还是四季分明的城市？请解释您的偏好。", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613a-speaking-q10.m4a"}, {"en": "Great. What measures do you think governments should take to mitigate the effects of extreme weather?", "zh": "很好。您认为政府应采取哪些措施来减轻极端天气的影响？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613a-speaking-q11.m4a"}]}, {"id": "mock-44", "n": 44, "en": "Digital Device Use", "zh": "数字设备使用", "scenario": "You have agreed to participate in a research study about digital device use. You have scheduled a short online interview with me to answer a few questions. I will ask you about your use of smartphones, tablets, computers, and other digital tools. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [13], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your use of digital devices. First, how many hours a day do you typically spend using electronics like smartphones, tablets, or computers?", "zh": "感谢你同意参与。我想问一些关于你使用数字设备的问题。首先，你通常每天花多少小时使用智能手机、平板电脑或电脑等电子设备？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613b-speaking-q8.m4a"}, {"en": "Thank you. What types of activities do you usually do on your digital devices? For example, do you use them for work, entertainment, or socializing?", "zh": "谢谢。你通常在数字设备上进行哪些类型的活动？例如，你用它们工作、娱乐还是社交？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613b-speaking-q9.m4a"}, {"en": "I see. Can you tell me about a time when you needed to take a break from using digital tools? How did it affect you?", "zh": "明白了。你能告诉我一次你需要暂时停止使用数字工具的经历吗？它对你有什么影响？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613b-speaking-q10.m4a"}, {"en": "Great. Some people believe that spending too much time on personal technology can negatively impact face-to-face social interactions. Do you agree or disagree with this viewpoint? Why?", "zh": "好的。有些人认为在个人技术上花费过多时间会对面对面的社交互动产生负面影响。你同意还是不同意这种观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0613b-speaking-q11.m4a"}]}, {"id": "mock-45", "n": 45, "en": "Leisure Activities", "zh": "休闲活动", "scenario": "You have agreed to participate in a research study about leisure activities. You will have a short online interview with me. I will ask you some questions about how you spend your free time and how leisure affects mental health. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [2], "items": [{"en": "Thank you for joining the study. I'd like to ask you some questions about leisure activities. First, do you usually spend your leisure or free time indoors or outdoors?", "zh": "感谢您参加这项研究。我想问您一些关于休闲活动的问题。首先，您通常在室内还是户外度过您的闲暇时光？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0613c-speaking-q8.m4a"}, {"en": "Thank you. Can you describe one of your favorite leisure activities and explain why you enjoy it?", "zh": "谢谢。请描述一项您最喜欢的休闲活动，并解释为什么您喜欢它？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0613c-speaking-q9.m4a"}, {"en": "I see. Do you prefer to engage in the same leisure activities over and over or do you regularly seek out new activities?", "zh": "明白了。您更喜欢反复进行同一种休闲活动，还是经常尝试新的活动？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0613c-speaking-q10.m4a"}, {"en": "Great. Some people believe that regularly engaging in leisure activities is important for mental health. What are your thoughts on this?", "zh": "很好。有些人认为定期参与休闲活动对心理健康很重要。您对此有什么看法？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0613c-speaking-q11.m4a"}]}, {"id": "mock-46", "n": 46, "en": "Personal Organization", "zh": "个人整理", "scenario": "You have volunteered for a research study about personal organization habits. You will have a short online interview with me. I will ask you some questions about organization in daily life, work, and school. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [9], "items": [{"en": "Thank you for volunteering. I'd like to ask you some questions about personal organization habits. First, do you feel more comfortable when things are organized, or does it not matter much to you? Why?", "zh": "感谢你参与。我想问你一些关于个人组织习惯的问题。首先，当事物井然有序时，你会感到更自在吗？还是这对对你来说没多大影响？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0616b-speaking-q8.m4a"}, {"en": "Thank you. What is one habit or routine you think can be helpful for people who want to be more organized?", "zh": "谢谢。你认为对于希望更有条理的人来说，哪个习惯或惯例是有帮助的？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0616b-speaking-q9.m4a"}, {"en": "I see. Do you think organization is something people are born with or something they can learn? Why?", "zh": "明白了。你认为条理性是与生俱来的，还是可以后天学习的？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0616b-speaking-q10.m4a"}, {"en": "Great. Is organization as important in one's personal life as it is in one's work or school life? Why?", "zh": "很好。条理性在个人生活中是否与在工作或学校生活中同样重要？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0616b-speaking-q11.m4a"}]}, {"id": "mock-47", "n": 47, "en": "Personal Finances", "zh": "个人财务", "scenario": "As part of a university research project, you have agreed to take part in a short interview about personal finances. You will have a short online interview with me. I will ask you some questions about budgeting, money-related choices, and financial education. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [12], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about personal finances. First, do you typically keep a budget for your expenses, or do you manage them informally?", "zh": "感谢你同意参与。我想问一些关于个人财务的问题。首先，你通常会为自己的开支做预算，还是以非正式的方式管理？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0617a-speaking-q8.m4a"}, {"en": "Thank you. Who or what would you say most influences the way you make money-related choices: your family, your friends, or your own experience? Why?", "zh": "谢谢。你认为谁或什么对你做财务相关决定的方式影响最大：你的家人、朋友，还是你自己的经验？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0617a-speaking-q9.m4a"}, {"en": "I see. If you were to receive extra money, such as a gift, how would you decide what to do with it? For instance, would you spend it or save it? Why?", "zh": "明白了。如果你意外得到一笔钱，比如一份礼物，你会如何决定怎么处理它？例如，你会花掉它还是存起来？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0617a-speaking-q10.m4a"}, {"en": "Great. Some experts believe that personal finance should be something that schools teach to prepare young people for future money management. Do you agree or disagree with this idea? What impact do you think it would have on students?", "zh": "好的。一些专家认为，个人理财应该是学校教授的内容，以帮助年轻人为未来的财务管理做好准备。你同意还是不同意这个观点？你认为这会对学生产生什么影响？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0617a-speaking-q11.m4a"}]}, {"id": "mock-48", "n": 48, "en": "Spending Time in Nature", "zh": "亲近自然", "scenario": "You are participating in a research study conducted by your university about spending time in nature. You will meet online with me. I will ask you some questions about your experiences with nature. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [1], "items": [{"en": "Thank you for joining this research study. Today I'd like to ask you some questions about your experiences with nature. To get started, how often do you spend time in nature, and where do you usually go?", "zh": "感谢您参与这项研究。今天我想问您一些关于您与大自然相处经历的问题。首先，您多久去一次大自然？通常去哪里？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0621a-speaking-q8.m4a"}, {"en": "Thank you. When you are outdoors in natural areas, what kinds of activities do you usually do? And why are those activities enjoyable or meaningful to you?", "zh": "谢谢。当您身处户外自然区域时，通常会进行哪些活动？这些活动为何对您来说有趣或有意义？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0621a-speaking-q9.m4a"}, {"en": "I see. Some people visit nature to relax, while others go to challenge themselves with more active activities like hiking or mountain biking. Which do you usually prefer? Why?", "zh": "我明白了。有些人去大自然是为了放松，而另一些人则去那里挑战更活跃的活动，比如徒步或山地骑行。您通常更喜欢哪种方式？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0621a-speaking-q10.m4a"}, {"en": "Great. Many people believe that spending more time in nature can improve a person's mental and physical well-being. Do you agree or disagree with this idea? Why?", "zh": "好的。许多人认为，花更多时间在大自然中可以改善一个人的身心健康。您同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0621a-speaking-q11.m4a"}]}, {"id": "mock-49", "n": 49, "en": "Gardening & Plants", "zh": "园艺与植物", "scenario": "You received an email from your university inviting you to join a research study about gardening and plants. You have scheduled a short online interview with me to answer a few questions. I will ask you about your experiences with gardens and plants. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [1], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about gardening and plants. First, do you have a garden or any plants that you take care of? If so, how often do you spend time gardening, and if not, why?", "zh": "感谢你同意参与。我想问你一些关于园艺和植物的问题。首先，你有一个花园或任何你照顾的植物吗？如果有，你多久花时间在园艺上？如果没有，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0624a-speaking-q8.m4a"}, {"en": "Thank you. What kinds of plants or gardens have you seen or heard about that you found interesting or appealing? Describe them and talk about why you found them interesting or appealing.", "zh": "谢谢。你见过或听说过哪些让你觉得有趣或有吸引力的植物或花园？描述它们，并谈谈你为什么觉得它们有趣或有吸引力。", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0624a-speaking-q9.m4a"}, {"en": "I see. What challenges do you think people face when trying to grow plants or maintain a garden?", "zh": "明白了。你认为人们在尝试种植植物或维护花园时会面临哪些挑战？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0624a-speaking-q10.m4a"}, {"en": "Great. Some people believe that gardening can have positive effects on personal mental health and wellbeing. Do you agree or disagree with this viewpoint? Why?", "zh": "很好。有些人认为园艺对个人心理健康和幸福感有积极影响。你同意还是不同意这个观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0624a-speaking-q11.m4a"}]}, {"id": "mock-50", "n": 50, "en": "Time Management", "zh": "时间管理", "scenario": "You received an email from your university inviting you to join a research study about time management. You have scheduled a short online interview with me to answer a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [9], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about your time management habits. First, do you use any tools or techniques to manage your time effectively? Please give some examples.", "zh": "感谢你同意参与。我想问一些关于你时间管理习惯的问题。首先，你使用任何工具或技巧来有效管理时间吗？请举一些例子。", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0523d-speaking-q8.m4a"}, {"en": "Thank you. Can you describe a typical day for you and explain how you organize your time?", "zh": "谢谢。你能描述一下你典型的一天，并解释你如何组织时间吗？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0523d-speaking-q9.m4a"}, {"en": "Interesting. Tell me about a time when you had to manage multiple tasks or responsibilities at once. How did you handle it?", "zh": "有趣。请告诉我一次你必须同时处理多项任务或职责的经历。你是如何处理的？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0523d-speaking-q10.m4a"}, {"en": "Great. Some people believe that managing your time wisely can lead to higher productivity, while others think it can cause unnecessary stress and prefer a looser schedule. What is your opinion on this? Why?", "zh": "很好。有些人认为明智地管理时间可以提高生产力，而另一些人认为这会导致不必要的压力，并更喜欢更宽松的日程安排。你对此有什么看法？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0523d-speaking-q11.m4a"}]}, {"id": "mock-51", "n": 51, "en": "Musical Experiences", "zh": "音乐体验", "scenario": "You have agreed to participate in a research study about musical experiences. You will have a short online interview with me. I will ask you some questions about your experiences with music. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [3], "items": [{"en": "Thank you for agreeing to take part in the study. I'd like to ask you some questions about your experiences with music. First, how important is music in your life? Why?", "zh": "感谢你同意参与这项研究。我想问一些关于你音乐经历的问题。首先，音乐在你的生活中有多重要？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0505a-speaking-q8.m4a"}, {"en": "Great, that's interesting. Now, if you had to choose, would you rather create music yourself or listen to music created by others? Why?", "zh": "很好，那很有趣。现在，如果你必须选择，你更愿意自己创作音乐还是听别人创作的音乐？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0505a-speaking-q9.m4a"}, {"en": "Okay, noted. Do you think music should be a required part of children's education? Why or why not?", "zh": "好的，明白了。你认为音乐应该是儿童教育的必修部分吗？为什么是或为什么不是？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0505a-speaking-q10.m4a"}, {"en": "Fair enough. Final question. Some people believe that live music has a stronger impact than recorded music. Do you agree or disagree with that? Why or why not?", "zh": "有道理。最后一个问题。有些人认为现场音乐比录制音乐影响更大。你同意还是不同意？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0505a-speaking-q11.m4a"}]}, {"id": "mock-52", "n": 52, "en": "Renewable Energy", "zh": "可再生能源", "scenario": "You have volunteered for a research study about renewable energy. You will have a short online interview with me. I will ask you some questions about your opinions on renewable energy and its implementation. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [14], "items": [{"en": "Thanks for your participation. I'd like to discuss your views on renewable energy. To start, how important is the issue of renewable energy, such as wind and solar power, to you personally? Why would you say you feel that way?", "zh": "感谢参与。我想讨论一下你对可再生能源的看法。首先，可再生能源（如风能和太阳能）对你个人而言有多重要？你为什么会有这样的感受？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0518b-speaking-q8.m4a"}, {"en": "Now, describe a time when you or someone you know tried to reduce energy use. What actions were taken, and what made it easy or difficult?", "zh": "现在，请描述一次你或你认识的人试图减少能源消耗的经历。采取了哪些行动？是什么让这个过程变得容易或困难？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0518b-speaking-q9.m4a"}, {"en": "Great. In your daily life, have you noticed any renewable energy initiatives in your community? If yes, what have you seen, and how do they impact your area? If not, what's an initiative that might be beneficial for your community?", "zh": "很好。在你的日常生活中，你是否注意到你所在的社区有任何可再生能源倡议？如果有，你看到了什么？它们对你的社区有什么影响？如果没有，什么样的倡议可能对你的社区有益？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0518b-speaking-q10.m4a"}, {"en": "Interesting. Many believe transitioning to renewable energy is crucial for environmental sustainability, while others worry about the costs involved. Do you think the benefits of renewable energy outweigh the drawbacks? Why or why not?", "zh": "有意思。许多人认为向可再生能源过渡对环境可持续性至关重要，而另一些人则担心其成本。你认为可再生能源的益处是否大于弊端？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0518b-speaking-q11.m4a"}]}, {"id": "mock-53", "n": 53, "en": "Technology & Household Tasks", "zh": "科技与家务", "scenario": "You have agreed to participate in a research study about technology and household tasks. You will have a short online interview with me. I will ask you some questions about the work people do at home and how technology can affect it. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [8], "items": [{"en": "Thank you for taking the time to speak with me. First, tell me about yourself. Do you currently live with others or on your own?", "zh": "感谢你抽出时间与我交谈。首先，请介绍一下你自己。你目前是和他人同住，还是独自居住？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0520a-speaking-q8.m4a"}, {"en": "Thank you. Thinking about the time you spend at home, aside from sleeping, tell me what you currently spend the most time doing. For example, do you spend most of your time at home preparing for school or work, or doing household work or tasks such as cooking or cleaning?", "zh": "好的。想一想你在家的时间，除了睡觉，告诉我你目前花时间最多的事情是什么。例如，你在家是花大部分时间准备上学或工作，还是做家务，比如做饭或打扫？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0520a-speaking-q9.m4a"}, {"en": "Okay. Now I'd like you to think about work or tasks at home that have to be done again and again, such as preparing food or paying bills. Which task do you find most important, and why?", "zh": "好的。现在，请你想一想家里必须重复做的工作或任务，比如准备食物或支付账单。你觉得哪项任务最重要，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0520a-speaking-q10.m4a"}, {"en": "Some people believe household responsibilities should be shared equally among everyone living in a home, while others think they should depend on each person's schedule and abilities. Which view do you agree with, and why?", "zh": "有些人认为家庭责任应该在家里的每个人之间平均分担，而另一些人则认为应该根据每个人的时间表和能力来决定。你同意哪种观点，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0520a-speaking-q11.m4a"}]}, {"id": "mock-54", "n": 54, "en": "Musical Experiences", "zh": "音乐体验", "scenario": "You have volunteered for a research study about musical experiences. You will have a short online interview with me. I will ask you some questions about your experiences with music. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [3], "items": [{"en": "Thanks for participating. I'd like to ask you about your musical experiences. Do you play a musical instrument or sing? If not, what would you choose to learn how to do? Piano or guitar?", "zh": "感谢参与。我想问一下你的音乐经历。你会演奏乐器或唱歌吗？如果不会，你会选择学习什么？钢琴还是吉他？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0523-speaking-q8.m4a"}, {"en": "Thank you. Please describe one memorable experience you have had with music. What made it special?", "zh": "谢谢。请描述一次你难忘的音乐经历。是什么让它如此特别？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0523-speaking-q9.m4a"}, {"en": "I see. When you listen to music, do you prefer to listen by yourself or with others? Why?", "zh": "明白了。当你听音乐时，你更喜欢独自聆听还是与他人一起？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0523-speaking-q10.m4a"}, {"en": "Some people believe that music education should be a compulsory part of school curriculum. Do you agree or disagree with this view? Please explain your reasons.", "zh": "有些人认为音乐教育应该成为学校课程的必修部分。你同意还是不同意这个观点？请解释你的理由。", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0523-speaking-q11.m4a"}]}, {"id": "mock-55", "n": 55, "en": "History Education", "zh": "历史教育", "scenario": "You have volunteered for a research study about history education. You will have a short online interview with me. I will ask you some questions about your experiences with history education. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [3], "items": [{"en": "It's great to have you here. I'm interested in learning about your experiences with history education. First, what is one aspect of history that you find particularly interesting?", "zh": "很高兴你来参加。我对了解你接受历史教育的经历很感兴趣。首先，你觉得历史的哪个方面特别有趣？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0603-speaking-q8.m4a"}, {"en": "Fascinating. Now think about when you studied history in school. What was a history-related activity or project you enjoyed, and what made it engaging for you?", "zh": "很有趣。现在回想一下你在学校学习历史的经历。你喜欢哪项与历史相关的活动或项目，它为什么吸引你？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0603-speaking-q9.m4a"}, {"en": "That's interesting. Some people enjoy visiting historical sites. If you were to visit a historical site you've never before visited, which one would you choose, and why?", "zh": "这很有趣。有些人喜欢参观历史遗址。如果你要去参观一个从未去过的历史遗址，你会选择哪一个，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0603-speaking-q10.m4a"}, {"en": "Good insights. History education is often debated in terms of its relevance in modern curriculums. Do you think the study of history remains important in today's educational system? Why or why not?", "zh": "见解很好。历史教育在现代课程中的相关性常有争议。你认为在当今的教育体系中，学习历史仍然重要吗？为什么重要或为什么不重要？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0603-speaking-q11.m4a"}]}, {"id": "mock-56", "n": 56, "en": "Hobbies", "zh": "爱好", "scenario": "You have agreed to participate in a research study about hobbies. You will have a short online interview with me. I will ask you some questions about your experiences with hobbies. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [2], "items": [{"en": "Thanks for being involved in this research. I'd like to ask you some questions about hobbies. First, what kinds of hobbies do you think are especially popular today? Why do you think that is?", "zh": "感谢您参与这项研究。我想问您一些关于爱好的问题。首先，您认为当今哪些类型的爱好特别流行？为什么您认为是这样？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0614-speaking-q8.m4a"}, {"en": "Sounds good. Next, what role do you think friends, family, or community play in encouraging someone to take up a hobby?", "zh": "好的。接下来，您认为朋友、家人或社区在鼓励某人培养爱好方面扮演什么角色？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0614-speaking-q9.m4a"}, {"en": "Noted. Now many people start hobbies but don't continue with them. What do you think leads people to give up on their hobbies?", "zh": "明白了。现在很多人开始培养爱好但没能坚持下去。您认为是什么导致人们放弃他们的爱好？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0614-speaking-q10.m4a"}, {"en": "Okay, thanks. Last one, some people believe spending time on hobbies is essential, while others see it as a luxury. What is your opinion?", "zh": "好的，谢谢。最后一个，有些人认为花时间在爱好上至关重要，而另一些人则视之为一种奢侈。您的看法是什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0614-speaking-q11.m4a"}]}, {"id": "mock-57", "n": 57, "en": "Recycling & Waste", "zh": "回收与废物管理", "scenario": "You have agreed to participate in a research study about recycling and waste management. You will have a short online interview with me. I will ask you some questions about your experiences with recycling and waste management. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [14], "items": [{"en": "Thank you for taking the time to speak with us today. I'd like to ask you some questions about your experiences with recycling and waste management. First, do you regularly recycle items such as paper, plastic, and glass? Why or why not?", "zh": "感谢您今天抽出时间与我们交谈。我想问您一些关于您在回收和废物处理方面的经历。首先，您是否经常回收纸张、塑料和玻璃等物品？为什么回收或不回收？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0623-speaking-q8.m4a"}, {"en": "Thanks. Can you describe the recycling practices in your household or community?", "zh": "谢谢。能否描述一下您家庭或社区的回收实践？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0623-speaking-q9.m4a"}, {"en": "Great, that's helpful. What challenges or difficulties do you face when trying to recycle? And how do you overcome them?", "zh": "很好，这很有帮助。在尝试回收时，您面临哪些挑战或困难？您如何克服它们？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0623-speaking-q10.m4a"}, {"en": "Some people believe that effective recycling programs are crucial for reducing pollution and conserving natural resources, and therefore should be mandatory. Do you agree or disagree with this belief? Why or why not?", "zh": "有些人认为有效的回收计划对于减少污染和保护自然资源至关重要，因此应该是强制性的。您是否同意或不同意这一观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0623-speaking-q11.m4a"}]}, {"id": "mock-58", "n": 58, "en": "Learning New Hobbies", "zh": "学习新爱好", "scenario": "You have agreed to participate in a research study about learning new hobbies. You will have a short online interview with me. I will ask you some questions about learning new hobbies. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [2], "items": [{"en": "Thanks for being involved in this research. I'd like to ask you some questions about learning new hobbies. First, what kinds of hobbies do your friends or family enjoy? Why do you think they enjoy doing them?", "zh": "感谢参与这项研究。我想问你一些关于学习新爱好的问题。首先，你的朋友或家人喜欢哪些类型的爱好？你认为他们为什么喜欢做这些？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0624-speaking-q8.m4a"}, {"en": "Thanks for that. Now, if your school or workplace were to organize after-work hobby clubs, which clubs do you think would interest the most people?", "zh": "谢谢。那么，如果你们学校或工作单位组织下班后的爱好俱乐部，你认为哪些俱乐部会最吸引人？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0624-speaking-q9.m4a"}, {"en": "Great, that's helpful. Next, do you think hobbies should mostly be relaxing, or is it better if they challenge you? Why?", "zh": "好的，这很有帮助。接下来，你认为爱好主要是用来放松的，还是最好能挑战自己？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0624-speaking-q10.m4a"}, {"en": "Got it. Now, last question. How important do you think it is for people to keep exploring new hobbies as they grow older? Why?", "zh": "明白了。最后一个问题。你认为随着年龄增长，人们不断探索新爱好的重要性有多大？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0624-speaking-q11.m4a"}]}, {"id": "mock-59", "n": 59, "en": "Studying History", "zh": "学习历史", "scenario": "You are participating in a research interview with me about how people study history. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [3], "items": [{"en": "Thanks for joining the study. First, do you mainly gain historical knowledge from school classes or from independent reading outside class?", "zh": "感谢参与这项研究。首先，你获取历史知识的主要途径是课堂学习还是课外自主阅读？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0704a-speaking-q8.m4a"}, {"en": "When studying history, which area interests you more: culture, politics, or another topic?", "zh": "在学习历史时，你更感兴趣哪个领域：文化、政治还是其他主题？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0704a-speaking-q9.m4a"}, {"en": "Have you visited a museum? Can places like museums deepen your understanding of history?", "zh": "你参观过博物馆吗？像博物馆这样的地方能加深你对历史的理解吗？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0704a-speaking-q10.m4a"}, {"en": "Do you agree that studying history can help people avoid repeating past mistakes? Why or why not?", "zh": "你同意学习历史可以帮助人们避免重蹈覆辙吗？为什么同意或不同意？", "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0704a-speaking-q11.m4a"}]}, {"id": "mock-60", "n": 60, "en": "Gift-Giving & Culture", "zh": "送礼与文化", "scenario": "You have volunteered for a research study about gift-giving habits and culture. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [6], "items": [{"en": "Thanks for your time. I'd like to ask you some questions about gift-giving habits. First, do you like to give gifts? Why?", "zh": "感谢你的时间。我想问你一些关于送礼习惯的问题。首先，你喜欢送礼物吗？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0704b-speaking-q8.m4a"}, {"en": "Thank you. What are the factors that you consider when giving gifts to other people?", "zh": "谢谢。在给别人送礼时，你会考虑哪些因素？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0704b-speaking-q9.m4a"}, {"en": "I see. What is one memorable gift you have received, or that you gave to others before?", "zh": "我明白了。你收到过，或者送给别人过，什么印象深刻的礼物？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0704b-speaking-q10.m4a"}, {"en": "Great. Last question. Do you prefer to make a wish list and let other people send you gifts on the list, or do you prefer to have surprises?", "zh": "很好。最后一个问题。你更喜欢列一个心愿清单让别人按清单送你礼物，还是更喜欢惊喜？", "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0704b-speaking-q11.m4a"}]}, {"id": "mock-61", "n": 61, "en": "Spending & Economics", "zh": "消费与经济学", "scenario": "You have agreed to take part in a university research study on spending habits and economics. You will have a short online interview with me. I will ask you a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [12], "items": [{"en": "Thanks for joining today's interview. I'd like to ask you a few questions about spending habits. First, when you buy products, do you tend to make impulse purchases, or do you carefully plan what to buy?", "zh": "感谢参加今天的访谈。我想问你一些关于消费习惯的问题。首先，当你购买产品时，你倾向于冲动购物，还是仔细计划要买什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0722-spending-speaking-q8.m4a"}, {"en": "Great. Now let me ask about budgeting. Some people set a weekly or monthly budget, and others do not. What is your approach to managing expenses?", "zh": "很好。现在我想问问预算方面。有些人会制定每周或每月的预算，有些人则不会。你管理开支的方式是什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0722-spending-speaking-q9.m4a"}, {"en": "Interesting to hear your thoughts. When making an expensive purchase, some people prefer to wait and save up their money, while others prefer to have the item right away and pay for it over time. Which do you prefer, and why?", "zh": "听到你的想法很有意思。在购买昂贵物品时，有些人倾向于等待并存钱，而另一些人则希望立刻拥有该物品，并分期付款。你更倾向于哪种方式，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0722-spending-speaking-q10.m4a"}, {"en": "Lastly, some people believe it is important to save as much money as possible for the future, while others feel it is better to spend more freely on things that bring satisfaction. What is your opinion, and why?", "zh": "最后，有些人认为为未来尽可能多地存钱很重要，而另一些人则认为在带来满足感的事物上更自由地消费更好。你的看法是什么，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0722-spending-speaking-q11.m4a"}]}, {"id": "mock-62", "n": 62, "en": "Leisure Activities", "zh": "休闲活动", "scenario": "You have volunteered to participate in a research study about leisure activities. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [2], "items": [{"en": "Thank you for joining the study. Today, I'd like to ask you some questions about leisure activities. First, how often do you find time to relax during your week, and what usually allows you to do so?", "zh": "感谢你参加这次研究。今天，我想问你一些关于休闲活动的问题。首先，在一周中，你多久能找到时间放松一次？通常是什么让你能够做到这一点？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0722-leisure-speaking-q8.m4a"}, {"en": "Thank you. Thinking about your typical day, what is one activity or hobby you usually do for enjoyment or relaxation? Why do you enjoy this particular activity?", "zh": "谢谢。想想你典型的一天，你通常会做什么活动或爱好来获得享受或放松？为什么你特别喜欢这项活动？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0722-leisure-speaking-q9.m4a"}, {"en": "I see. Some people enjoy social activities during their leisure time, while others prefer solitary activities. Which do you prefer, and why?", "zh": "明白了。有些人喜欢在空闲时间进行社交活动，而另一些人则更喜欢独处活动。你更喜欢哪一种？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0722-leisure-speaking-q10.m4a"}, {"en": "Great. And lastly, some people see leisure time as a basic need for everyone, while others see it as a luxury that depends on personal circumstances. Which view do you agree with, and why?", "zh": "很好。最后，有些人认为空闲时间是每个人的基本需求，而另一些人则认为这是一种取决于个人情况的奢侈品。你同意哪种观点？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0722-leisure-speaking-q11.m4a"}]}, {"id": "mock-63", "n": 63, "en": "Gift Giving", "zh": "送礼", "scenario": "You have agreed to participate in a research study about gift giving. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [6], "items": [{"en": "Thanks for your time. I'd like to ask you some questions about gift giving. First, do you enjoy giving gifts? Why or why not?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0721c-interview-speaking-q8.m4a"}, {"en": "Thank you. How do you decide what gift to give? What factors do you consider?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0721c-interview-speaking-q9.m4a"}, {"en": "I see. Describe a memorable gift you have given or received. What made it special?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0721c-interview-speaking-q10.m4a"}, {"en": "Great. Some people think it is helpful to make online gift registries so others know exactly what to give, while others feel gifts should be a surprise. Which point of view do you agree with, and why?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/David-piece-0721c-interview-speaking-q11.m4a"}]}, {"id": "mock-64", "n": 64, "en": "Environmental Awareness", "zh": "环保意识", "scenario": "You are taking part in a research study about environmental awareness and lifestyle choices. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [14], "items": [{"en": "Thanks for taking part in the study. Today I'd like to ask you a few questions about environmental awareness and lifestyle choices. First, what, if any, environmentally friendly practices, such as recycling, do you employ in your daily life?", "zh": "感谢你参与这项研究。今天我想问你几个关于环保意识和生活方式选择的问题。首先，在日常生活中，你是否采用了任何环保实践，比如回收利用？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0721b-speaking-q8.m4a"}, {"en": "Thank you. Can you share a specific example of how you reduce your environmental impact at home, at school, or at work?", "zh": "谢谢。你能分享一个具体的例子，说明你在家里、学校或工作中是如何减少对环境的影响的吗？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0721b-speaking-q9.m4a"}, {"en": "I see. If you were to make one change to help the environment, what would it be, and why?", "zh": "我明白了。如果你要做出一个改变来帮助环境，那会是什么，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0721b-speaking-q10.m4a"}, {"en": "Good points. Some people believe that individual actions alone are not enough to address environmental problems. Do you agree or disagree with this statement? Why?", "zh": "说得好。有些人认为仅靠个人行动不足以解决环境问题。你同意还是不同意这个说法？为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0721b-speaking-q11.m4a"}]}, {"id": "mock-65", "n": 65, "en": "Learning History", "zh": "学习历史", "scenario": "You are participating in a research study about awareness of history. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [3], "items": [{"en": "Thanks for joining the study. First, have you gained most of your knowledge of history through school or from outside of school?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0721a-interview-speaking-q8.m4a"}, {"en": "Thank you. When learning about history, whether through school or on your own, what aspects do you find most intriguing: cultural, political, or something else?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0721a-interview-speaking-q9.m4a"}, {"en": "I see. Have you ever visited a historical site or museum? Do you think visiting such a place enhances your understanding of history? Why or why not?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0721a-interview-speaking-q10.m4a"}, {"en": "Good points. Some people believe that studying history helps prevent repeating past mistakes. Do you agree or disagree with this idea? Why?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0721a-interview-speaking-q11.m4a"}]}, {"id": "mock-66", "n": 66, "en": "Community Life", "zh": "社区生活", "scenario": "You are contributing to a research project about social interactions and community life. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [5], "items": [{"en": "Thank you for joining this research project. I'd like to ask you some questions about social interactions and community life. First, do you participate in community activities or groups? If so, what kinds do you enjoy? If not, what kind of group might you want to join, and why?", "zh": "感谢你参与这个研究项目。我想问你一些关于社交互动和社区生活的问题。首先，你是否参与社区活动或团体？如果是，你喜欢哪种类型？如果不参与，你可能想加入什么样的团体，为什么？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0720b-speaking-q8.m4a"}, {"en": "Thank you. How important do you think social interactions are for maintaining a healthy lifestyle? Please explain why.", "zh": "谢谢。你认为社交互动对于维持健康的生活方式有多重要？请解释原因。", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0720b-speaking-q9.m4a"}, {"en": "I see. What changes have you noticed in the ways you or your friends interact socially over the past few years? Was this change good or bad in your opinion?", "zh": "我明白了。在过去的几年里，你注意到你或你的朋友社交互动方式有什么变化吗？在你看来，这种变化是好是坏？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0720b-speaking-q10.m4a"}, {"en": "Good points. Do you think online social platforms will eventually replace face-to-face interactions, or will personal interactions remain indispensable? Why do you think so?", "zh": "说得有道理。你认为在线社交平台最终会取代面对面的交流，还是个人互动将仍然不可或缺？你为什么这样认为？", "audio": "https://wofo.cc/toefl/speaking-media/Sully-piece-0720b-speaking-q11.m4a"}]}, {"id": "mock-67", "n": 67, "en": "Education Background", "zh": "教育背景", "scenario": "You are participating in a study about education. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [10], "items": [{"en": "Thanks for taking part. Can you tell me about your educational background and what field you have specialized in or plan to specialize in?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0826b-interview-speaking-q8.m4a"}, {"en": "All right. Please describe a project or an assignment during your studies that you found particularly challenging. What was challenging about it?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0826b-interview-speaking-q9.m4a"}, {"en": "Noted. In your opinion, what is the most important skill students should develop during their education? Please provide reasons for your answer.", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0826b-interview-speaking-q10.m4a"}, {"en": "One last thing. Some people feel it is important for students to study a wide range of subjects, even if those subjects will not be relevant to their future careers. Do you agree or disagree with this perspective? Why?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Harold-piece-0826b-interview-speaking-q11.m4a"}]}, {"id": "mock-68", "n": 68, "en": "Hobbies & Activities", "zh": "爱好与活动", "scenario": "You are participating in a research study conducted by your university about hobbies. You will meet online with me. I will ask you a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [2], "items": [{"en": "Thanks for joining. Do you have a specific hobby or activity that you enjoy doing regularly?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0826a-interview-speaking-q8.m4a"}, {"en": "Good. What kinds of hobbies or pastimes are common in your country? What do you think makes these activities appealing to many people?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0826a-interview-speaking-q9.m4a"}, {"en": "I hear you. Some people feel that hobbies help them relax and recharge, while others enjoy them for a challenge or a new skill. In what way do you think your hobby benefits you? Why?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0826a-interview-speaking-q10.m4a"}, {"en": "Lastly. Some people say that finding time for hobbies is becoming harder because of busy lifestyles and work commitments. Do you agree or disagree with this perspective? Why?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Julia-piece-0826a-interview-speaking-q11.m4a"}]}, {"id": "mock-69", "n": 69, "en": "Personal Development", "zh": "个人发展", "scenario": "You have volunteered for a research study at your university about personal development. You will have a short online interview with me. I will ask you some questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [9], "items": [{"en": "Thank you for agreeing to participate. I'd like to ask you some questions about personal development. First, what skills or qualities would you like to develop in the future? Why?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0812b-interview-speaking-q8.m4a"}, {"en": "Thank you. When you think about improving yourself, what usually pushes you to take action? Is it someone you know, an experience you've had, or something you've read or seen?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0812b-interview-speaking-q9.m4a"}, {"en": "That makes sense. Do you think personal development necessarily has to be something you do by yourself, or is it okay to receive help from others? Why?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0812b-interview-speaking-q10.m4a"}, {"en": "I appreciate that. Finally, do you think self-improvement is easier now than it was in the past? Why or why not?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Nikki-piece-0812b-interview-speaking-q11.m4a"}]}, {"id": "mock-70", "n": 70, "en": "", "zh": "", "scenario": "You have signed up for a study conducted by your university about people's experience with weather. You will have a short online interview with me. I will ask you a few questions. From this point on, the questions will not appear on screen, so please listen carefully.", "cats": [], "items": [{"en": "Thanks for agreeing to participate. I'll be asking you a few questions about weather patterns for this study. To begin, how would you describe the weather where you currently live? Tell me about it.", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0809a-interview-speaking-q8.m4a"}, {"en": "Interesting. Now, thinking about your daily life, how does the weather in your area affect your everyday activities, such as getting around or spending time outdoors?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0809a-interview-speaking-q9.m4a"}, {"en": "Great, thanks for explaining that. Next, what challenges does weather sometimes create for community activities, and what are some ways people adapt or respond to these challenges?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0809a-interview-speaking-q10.m4a"}, {"en": "Fascinating. Lastly, some researchers have suggested that weather can influence people's mental and physical well-being. Do you think this is true? Why or why not?", "zh": null, "audio": "https://wofo.cc/toefl/speaking-media/Jessica-piece-0809a-interview-speaking-q11.m4a"}]}], "notes": [{"id": "common", "label": "万能素材", "group": null, "nodes": [{"h": "<b>speaking space 1-3<\/b>（Group 1–3 通用）", "c": [{"h": "<u>Experience<\/u>", "c": [{"h": "运动经历 one time, I went to a local park for jogging, and ended up joining a group of strangers playing badminton, ~<b>(well, to be honest)<\/b>,<b> <\/b>didn&#x27;t know anyone, <b>(but they are really friendly)<\/b>,<b> <\/b>they just waved me over + handed me a racket, ~ played for almost 2 hours, <b>(like)<\/b>, joking around + cheering with each other + having really a lot of fun, we all were sweaty, but nobody wanted to stop, ~ never see any of them again, but still think about that afternoon sometimes, showed that sports can really bring people together, not need to know someone to connect with them"}, {"h": "绿植经历 / 公园体验 really like the park near my jogging route,", "c": [{"h": "the flowers and trees change with the seasons, never look the same, ~<b>(like)<\/b>, in spring there are pink flower, in fall the leaves turn golden, ~<b> <\/b>these changes make my daily run more enjoyable"}, {"h": "someone take great care of a flower bed near the entrance, ~ always looks neat, full of color, ~ <b>(every time I see it, I always have a nice feeling)<\/b>, that is why, started growing plans at home"}]}]}, {"h": "<u>Challenge<\/u>", "c": [{"h": "time, ~ with a busy schedule"}, {"h": "money, ~ have limited / tight budget, have to pay rent + cover living expenses"}, {"h": "too tired, ~ want to give it up / skip it, ~ build a habit first"}, {"h": "small space, ~ live in a small apartment"}]}, {"h": "<u>放松<\/u>", "c": [{"h": "wind down, slow down"}, {"h": "clear my mind, blow off the steam"}, {"h": "take a break from routine, hit the reset bottom"}, {"h": "feel refreshed and recharged, feel lighter and have more energy to get things down"}, {"h": "calm down, feel peaceful"}, {"h": "boost my mood and confident"}]}, {"h": "<u>朋友<\/u>", "c": [{"h": "hang out, ~ chat along the way, have fun, ~ help keep closed / get connected"}, {"h": "having someone beside you, help stay active + keep motivated, ~ also, 朋友聚, make it more enjoyable"}, {"h": "bring people together, not need to know someone to connect with them"}]}]}, {"h": "<b>speaking space 4-5<\/b>（Group 4–5 通用）", "c": [{"h": "<u>Experience<\/u>", "c": [{"h": "音乐经历 live concert, ~ showed that music can really bring people together, not need to know someone to connect with them"}, {"h": "电影经历 a drama I watched last weekend, ~ it is based on a true story about a man, who loses almost everything, but never gives up on his dream of building a better life for his family, ~ what I liked most was how real it felt, he faces so many setbacks, but just keeps going, ~ gave me a lot of energy and motivation, it is exactly the kind of movie that stays with you long after it is over"}]}]}, {"h": "<b>speaking space 6-9<\/b>（Group 6–9 通用）", "c": [{"h": "<u>Experience<\/u>", "c": [{"h": "遇到困难找别人梳理 be really stressed or feeling down, talk to friends or professor~ not tell me how to handle, but ask some simple questions, ~ think more clearly, point out things that I had overlooked, ~ help me see things differently, a short conversation can give me a new idea"}, {"h": "志愿活动 cleanup, book donation"}, {"h": "难忘的礼物"}, {"h": "传统节日"}, {"h": "文化节"}, {"h": "任务经历 had a challenging project, a huge project deadline, work late almost for several days + feel impossible to get it all done on time", "c": [{"h": "(1) 健康 skip jogging + order takeout, feel burn out, have no energy, take a few weeks to recover, ~ should take breaks even when busy, find the right balance"}, {"h": "(2) 收获 break it into smaller tasks + focus on the urgent part first + ask my professor for help (遇到困难找别人梳理), ~ get it done on time, learn how to manage pressure"}]}, {"h": "吃饭 / 聚会经历 a friend invited me to a small dinner with someone else, ~ did not know any of them, felt a little awkward / uncomfortable, ~ someone mentioned also like jogging, naturally started conversation + talked all night, ~ became friends, started running together on weekends, ~ best connections come from unexpected moments"}]}]}, {"h": "<b>speaking space 10-13<\/b>（Group 10–13 通用）", "c": [{"h": "<u>Experience<\/u>", "c": [{"h": "多项目经历multiple tasks (见 任务经历)"}, {"h": "我的一天", "c": [{"h": "start by commuting to work on the subway, usually put on some soft music or listen to a podcast, ~ clear my mind, make the commute more enjoyable"}, {"h": "at work, do research assistant work at a university, ~ most of my time is spent reading papers, analyzing data, and meeting with professors"}, {"h": "after work, go for a jog in a small local park near my apartment, ~ a great way to relieve stress and unwind after a long day"}, {"h": "before bed, take a hot shower, spend some time scrolling on my phone and watch short videos, ~ put on some soft music, go to sleep"}]}, {"h": "达成目标经历"}, {"h": "学校项目经历 (history)"}, {"h": "在线课程经历 (history)"}, {"h": "买电脑经历 bought a new laptop online last month, ~ my old one kept crashing, had to replace it,", "c": [{"h": "(购物) spend a few weeks comparing different models, reading reviews, + waited for a promotion to fit my budget, got it at a lower price, ~ it arrived in just two days, the batter life is great, the display is sharp and easy on the eyes, make long study hours much more comfortable, ~ really happy with it"}, {"h": "(财务) on a tight budget, so set a goal to save a fixed amount every month, ~ cut down on eating out, made a shopping list before going to the supermarket, and only bought what I actually needed, ~ not too much, but over time make a real difference, ~ after a few months, finally reached my goal, felt really rewarding, showed that effort leads to results"}]}]}]}, {"h": "<b>speaking space 14-15<\/b>（Group 14–15 通用）", "c": [{"h": "<u>Experience<\/u>", "c": [{"h": "社交媒体使用经历 once watched a short video about Chinese history on social media, ~ (history), ~ social media is actually a useful tool, can learn something valuable just by scrolling through your phone"}, {"h": "放下电子产品经历 had a challenging project, a huge project deadline, work late almost for several days, ~ I was staring at my computer all day, and scrolling through my phone at night, ~ after several days, felt burned out and had no energy to get things done, ~ so decided to take a break from all screens for a whole weekend, no phone, no laptop, just relaxed, ~ when came back, felt refreshed and recharged, could concentrate better, ~ short breaks from digital tools can make a big difference"}]}]}]}, {"id": "group-1", "label": "Group 1 健康与运动", "group": 1, "nodes": [{"h": "<b>睡得很晚 <\/b>go to bad late", "c": [{"h": "(1)<b> <\/b>my evening routine takes quite a lot of time, ~ <b>(like, I  usually)<\/b>, go jogging, cook meals, relax for a while, ~<b> (So, by the time)<\/b> I am done with everything, it is already past 11"}, {"h": "(2) 睡前 <b>(even after that)<\/b>, <b>(usually still) <\/b>scroll my phone, check messages, watch some short videos, ~ <b>(sometimes)<\/b>, take a hot shower, play some soft music, relax on the sofa, ~ enjoy my personal time, 放松"}, {"h": "<u>睡不好<\/u>", "c": [{"h": "(1) <b>(sometimes)<\/b>, have trouble sleeping, ~ <b>(especially when I&#x27;m in a new place)<\/b>, everything feel uncomfortable, the bed is not soft, the room is too quiet / noisy, ~ not used to the environment, so wake up serval times during the night"}, {"h": "(2) <b>(as you can imagine)<\/b>, the next day, feel really tired and zone out, have no energy to get things down, ~  take a couple of days to recover"}]}, {"h": "<u>睡得好<\/u>", "c": [{"h": "(1) need more sleep, ~ good for growth and brain development"}, {"h": "(2) the next day, feel refreshed and recharged, concentrate better, have enough energy to get things down, ~ study better / work better"}, {"h": "(3) even a short break, can make a big difference, ~ hit the reset bottom, become more productive"}]}]}, {"h": "<b>运动<\/b>", "c": [{"h": "<u>jogging<\/u>", "c": [{"h": "(1) stay fit, ~ sit at a desk all day at work, running gets my body moving, sleep much better at night"}, {"h": "(2) reduce stress, ~ after a long day at work, put on my headphones, focus on my breath, run at my own pace, ~ forget anything else, 放松 (——独自)"}, {"h": "(3)  running with a friend, a good way to hang out, ~ chat along the way, have fun, ~ help keep closed / get connected (——和别人)"}, {"h": "(4) 大自然 outdoors (见group 2), ~ 放松"}, {"h": "(5) 简单易学 simple and free, easy to start, ~ not need any equipment, or a gym membership, ~ start with 5 minutes, gradually increase the time and distance, ~  a easy way to build a regular exercise routine"}, {"h": "(6) 习惯 eventually build the habit / a regular exercise routine, great for mental health and physical health for the long term"}]}, {"h": "<u>strength training<\/u>", "c": [{"h": "(1) 增加<b> <\/b>add strength training to my routine, ~ running is good for for my heart, but not work my upper body, ~ sit at a desk all day at work, shoulders and back get really tight, ~ lifting weights, help build muscle, improve my posture"}, {"h": "(2) keep our bones strong in the long term, ~ even a few times a week, it can make a really big difference, ~ start with some workout video at home"}]}, {"h": "<u>swimming<\/u>", "c": [{"h": "(1) a full-body workout, ~ running is good for for my heart, but not work my upper body, ~ just sit at a desk all day at work, shoulders and back get really tight, ~  help me build muscle, improve my posture, ~ gentle on the body, great for the long term"}, {"h": "(2) a real life skill, ~ feel much safer and confident near a beach or a river, ~ <b> <\/b>keep me safe in an emergency"}]}, {"h": "<u>挑战<\/u>", "c": [{"h": "hard to stay motivated, ~ when tired after a long day at work, not feel like to go outdoors, want to give it up / skip it"}, {"h": "(1) set a small, realistic goal, ~ start with 5 minutes, gradually increase the time and distance, ~ every time hit the goal, feel rewarding, ~ eventually build the habit,"}, {"h": "(2) run with friends, ~ have someone beside you, stay active + keep motivated, ~ 朋友聚, make it more enjoyable"}]}, {"h": "<u>犒劳<\/u>", "c": [{"h": "(1) treat myself to a nice meal, or order my favorite takeout, or just take a break on weekends, ~ simple things, help feel rewarding + keep motivated"}, {"h": "(2) that itself is a reward, (好处health / relax ...)"}]}, {"h": "<u>过度锻炼<\/u>", "c": [{"h": "regular exercise is usually a good thing", "c": [{"h": "(1) 健康, 放松, 习惯, ~without it, would be much more stressed, ~ sleep badly, eat poorly, have no energy to get things done"}, {"h": "(2) of course, too much can be a problem, ~ your body need time to recover, if push too hard, might get injured, ~ the key is to find the right balance"}]}]}, {"h": "<u>对抗性运动<\/u> contact sports", "c": [{"h": "(1) teach valuable life skills, ~ teamwork, resilience, ~ hard to learn from a textbook, ~ when lose a game, learn how to handle disappointment + try again, ~ that kind of experience help build confidence"}, {"h": "(2) of course, safety should come first, ~ as long as follow the instructors&#x27; guidance, reduce the chance of getting seriously hurt"}]}]}, {"h": "<b>饮食<\/b> (见group 9)", "c": [{"h": "什么饮食习惯来保持健康"}]}, {"h": "<b>心理健康 mental health<\/b>", "c": [{"h": "(1) 和身体健康的关系 mental health directly affects physical health, ~today, many young people feel stressed, or even burned out, ~ they just focus on their bodies, but ignore how they feel inside, →  that is wrong, because metal stress has real physical consequences, ~ for me, when I am stressed, sleep badly, eat poorly, have no energy to get things done"}, {"h": "(2) start running"}, {"h": "(3) talk with friends"}]}]}, {"id": "group-2", "label": "Group 2 自然与户外", "group": 2, "nodes": [{"h": "<b>大自然 outdoors<\/b>", "c": [{"h": "(1) enjoy fresh air and natural light, listen to birds, just enjoy the moment, ~ being surrounding by nature, help calm down + feel peaceful, 放松"}, {"h": "(2) <u>做什么<\/u>", "c": [{"h": "spend time in nature every day through jogging, run in a park near my apartment, ~ 跑步 (after long day, at my own pace, with friends...)"}, {"h": "spend more time jogging in different place, ~ mostly run the same route in a park near my apartment, ~ love to explore new parks and trails along the river, ~ have different experiences"}]}, {"h": "(2) <u>室内 vs 户外<\/u>", "c": [{"h": "usually feel tired when sit at a desk all day at work, ~ shoulders and back get really tight, need to get outside + move around", "c": [{"h": "without getting enough sunlight and exercise, can lead to all kinds of problems, like back pain, weight gain, bad sleep, and a poor diet, ~ affect your physical health"}]}, {"h": "when I am outside, especially go for jogging, ~ 大自然, ~ notice a huge difference in my mood after jogging", "c": [{"h": "without spending enough time outdoors, tend to feel stressed and anxious, ~ affect your mental health, ~ think the nature is the best medicine for modern life, ~ 大自然"}]}]}]}, {"h": "<b>户外空间 free or charge<\/b>", "c": [{"h": "(1) should be free and open to everyone, ~ not everyone can afford gym memberships, some people are on a tight budget, ~ make sure everyone has equal access, regardless of their income"}, {"h": "(2) outdoor spaces are essential for public health, ~ parks and green spaces offer people a space to exercise and unwind, ~ 运动, 大自然"}, {"h": "(3) they bring people together, ~ everyone share the same place, strengthen community bonds ~ naturally builds a more welcoming, friendly community over time, make neighborhoods more livable"}]}, {"h": "<b>公园的重要性<\/b>", "c": [{"h": "(1) parks give a place to exercise, relax, and socialize, ~ all improve physical and mental health", "c": [{"h": "for children, safe spaces to run around, work out + play with friends, ~ essential for their physical development + social skills"}, {"h": "for adults, relax, ~ 放松, 运动,大自然"}]}, {"h": "(2) bring people together, ~ everyone share the same place, strengthen community bonds ~ naturally builds a more welcoming, friendly community over time, make neighborhoods more livable"}, {"h": "<u>住房 vs 公园<\/u> a city with only buildings and no green space, would seriously hurt people&#x27;s quality of life + mental health"}]}, {"h": "<b>园艺Gardening<\/b>", "c": [{"h": "(1) keep a few plants on my windowsill, ~ water and check them every few days, ~ really enjoy it, after a long day at work, help slow down 放松"}, {"h": "(2) put my phone away, do something real, ~ forget anything else, just focus on the moment"}, {"h": "(3) bring some nature into my city life, ~ having some green, make my apartment feel alive, 放松"}, {"h": "(4)  watching them grow, give a sense of accomplishment, ~ when they are growing well, feel rewarding and boost my mood"}, {"h": "(5) <u>挑战<\/u>", "c": [{"h": "limited space, live small apartments with no yard, ~ not get enough natural light, especially in winter, the plants can die pretty quickly"}, {"h": "with a busy schedule, ~ easy to forget to water and check them, not know how much water different plants need, ~ too much or too little water, can cause the plants to die within weeks"}]}]}]}, {"id": "group-3", "label": "Group 3 休闲与爱好", "group": 3, "nodes": [{"h": "<b>休闲活动 leisure activities / 爱好 habits<\/b>", "c": [{"h": "(1) <u>自己 jogging<\/u>", "c": [{"h": "spend more time outdoors, go jogging after work, ~ 跑步"}, {"h": "find time to relax every day, my evening routine is the best part of my day, ~ 睡前"}]}, {"h": "(2) <u>朋友 playing video games<\/u>", "c": [{"h": "most of my friends are really into video games, a easy way to  unwind /relax after work, ~ just sit on the sofa at home and play, no need to go anywhere + make plans"}, {"h": "play online together, ~ a good way to hang out, have fun together (have shared interests), ~ stay connected in modern life"}]}, {"h": "(3) <u>挑战<\/u>", "c": [{"h": "with a busy schedule / between work and study, not have enough free time, ~ if take several hours to learn it, have no time to <u><i class=\"blue\">relax, exercise, socialize<\/i><\/u>"}, {"h": "can be expensive, ~ my budget is pretty limited, still need to pay rent + cover living expense, ~ would take me several months to save enough money to get started"}]}]}, {"h": "<b>重复 or 尝试新的<\/b>", "c": [{"h": "(1) would get boring overtime, ~ when become a routine, will get tired of it, ~ switch to different habits, keep life exciting / interesting + stay active / motivated, ~ 跑步换路线"}, {"h": "(2) having different experiences, can offer the chance to meet new people, ~ natu eeling the same energy, ~ that shared excitement create a connection with strangers, cannot get from listening alone"}]}, {"h": "(5) 选乐器 choose to learn guitar", "c": [{"h": "portable, easy to start, ~ can practice anywhere, in a park or just in my room, fit perfectly in a small space, ~ can learn to play simple songs within a few weeks"}, {"h": "not much expensive, ~ even though have a limited budget, can spend a few weeks to save enough money to get started, ~ can find tons of free tutorials and courses online"}]}]}, {"h": "<u>movie<\/u>", "c": [{"h": "really enjoy watching movies on weekends,"}]}]}, {"h": "<b>公开分享 vs 私密<\/b>", "c": [{"h": "(1) keep it private, for me, creative stuff is more of a personal thing, ~ when find a great song, or watch a good movie, not need to share my feeling with another, ~ just want to make myself happy, not to please others"}, {"h": "(2) if share it publicly, would feel stressed, ~ would be worried about making it perfect, feel anxious about other people&#x27;s opinions, ~ cannot really relieve stress + enjoy the process, not fun anymore"}]}, {"h": "<b>艺术的意义<\/b> art and music", "c": [{"h": "(1) express ourselves + share feelings in ways that words cannot, ~ an upbeat song can boost your mood and confidence, while a soft one can calm you down, ~ help understand our own emotions better, really good for mental health"}, {"h": "(2) cross language + cultural barriers, ~ even if not understand the words, or speak the same language, a piece of music can still move you deeply, ~ that is something words alone cannot do"}, {"h": "(3) let you experience other people&#x27;s lives, ~ when watch stories about real people in real situations, sometimes see yourself in the characters, ~that feeling create strong emotional connections, stay with you long after the movie is over or walking out of the museum, ~  inspire you, gives you energy and motivation to keep going in your own life, change how you think or behave"}, {"h": "(4) different kinds of
