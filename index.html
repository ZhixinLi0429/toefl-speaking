e"}, {"h": "(2) when you meet someone socially, get to know them as a person, not just their job title, ~ that personal connection, make the professional relationship much stronger and more lasting"}, {"h": "(3) give a chance to take a break from the routine and recharge, ~ laughing and talking with people, can boost your mood"}, {"h": "(4) seeing people in person, keep the connection alive, ~ sharing the same space, laughing together, ~ give a sense of belonging, feel like you are part of group, ~ feel being valued"}]}]}, {"h": "<b>友谊/朋友的意义friendship<\/b>", "c": [{"h": "(1) help see a new perspective to think clearly (experience)"}, {"h": "(2) give emotional support, ~ stressed, talk to make me feel better, give a sense of comfort, someone care about you, be valued"}, {"h": "(3) hard to stay motivated, ~ when tired after a long day at work, not feel like to go outdoors, want to give it up / skip it", "c": [{"h": "run with friends, ~ have someone beside you, help stay active and keep motivated, ~ also, 朋友聚, make it more enjoyable, ~ eventually build the habit"}]}, {"h": "(3) push you to try new things, ~ started jogging because a friend invite me to join, ~ 尝试新的, make daily life more colorful, have fun together"}]}, {"h": "<b>志愿服务Volunteering<\/b>", "c": [{"h": "<u>cleanup<\/u>: a park clean up, pick up trash along the walking paths and the river + take 3 hours, fill several big bags of trash, ~ make the area much cleaner, ~ feel closer to my neighbors, work side by side + chat along the way"}, {"h": "<u>book donation<\/u>: organize a book donation, set up collection points around campus + ask students to donate their old textbooks, collect hundreds of books within just a few days, ~ give to students who couldn&#x27;t afford new ones, very grateful when receive books, ~ this small action make a big different in their studies"}, {"h": "(1) valuable life skill, teamwork + resilience, ~ work together, support each other, ~ hard to learn from a textbook"}, {"h": "(2) see the real world, meet with different people + care about the community, ~ learn to value the people and experiences around them"}]}]}, {"id": "group-7", "label": "Group 7 节日/文化/旅行", "group": 7, "nodes": [{"h": "<b>travel <\/b>", "c": [{"h": "(1) visit a natural park, really refreshing, ~ 大自然, a great way to escape the city for a while"}, {"h": "(2) explore new places / parks and trail along the river, ~ 尝试新的"}, {"h": "(3) <u>travel with friends<\/u>", "c": [{"h": "a great chance to hang out with friends, ~ after we all started working, hard to find time to see each other, ~ spend time with someone you care about, have fun together, enjoy the moment, ~ make the trip more meaningful"}, {"h": "split the costs, try more different food and experience"}, {"h": "feel safer when having someone beside, especially in an unfamiliar place, ~ give you peace of mind, can help each other,"}]}, {"h": "(4) <u>VR虚拟旅行<\/u>", "c": [{"h": "the real value in traveling is to get real experience in person, ~ experience different cultures and enjoy the views, feel the crowds and energy, 大自然, ~ that kind of experience, hard to get from a screen"}, {"h": "but travel virtually still have some values, a great way to preview a destination before you go, ~ get a sense of whether it is worth the trip, explore without spending money, and then plan the real trip when they are ready, ~ good for people on a tight budget"}]}]}, {"h": "<b>Trip Plan 做计划<\/b>", "c": [{"h": "(1) usually ask around first, ~ get recommendations from friends or families, provide better options, know what is worth visiting, ~ really helpful, save a lot of time"}, {"h": "(2) do some online research, ~ check social media, watch travel vlogs, ~ get a feel for the  place, ~ help compare prices for transportation and hotels, so I can find the best deals"}]}, {"h": "<b>礼物<\/b>", "c": [{"h": "(1) good gift not have to be expensive, just be useful, ~ always think about what the person actually likes, and what they need in their daily life, ~ practical is more important, can use in their daily life"}, {"h": "(2) a way to show someone that I care about them, ~ not have to be cost a lot, even handwritten card can show you have put real thought into it, make someone feel valued"}, {"h": "(3) see their reactions when they open it, ~ the look on their face, happy smile, always make me feel good, ~ more rewarding for me"}, {"h": "<u>难忘的礼物<\/u>", "c": [{"h": "a pair of running headphones, ~ practical and useful, can wear everyday when jogging, ~ put on some music, enjoy the run, 音乐"}, {"h": "show the person truly know what I need, ~ make me feel really cared for and valued"}]}, {"h": "<u>惊喜 vs 心愿清单wish list<\/u>", "c": [{"h": "prefer surprises, ~more touching and thoughtful, show they truly know me + have put real thought into it, ~ make me feel really cared for and valued"}, {"h": "wish list is like placing an order, ~ take away the personal touch, the gift not feel like it come from the heart, ~ a surprise make the whole moment more special and memorable"}]}]}, {"h": "<b>节日Holiday<\/b>", "c": [{"h": "(1) when big holiday, celebrate with family, ~ cook together, sit down for a big dinner, catch up on each other&#x27;s lives, ~ only happen once a year, feel really special"}, {"h": "(2) when smaller holidays, celebrate with friends, ~ hang out with friends, grab dinner somewhere, ~ a great way to unwind and enjoy some time together 放松, 朋友"}, {"h": "(3) <u>春节<\/u> Chinese new year: the longest break in China, ~ have time to be with family and friends without rushing", "c": [{"h": "the atmosphere was really special, ~ the streets were full of red lanterns, street food, crafts, and little games, ~ felt like the whole city was celebrating together, that energy made me really happy"}, {"h": "everyone was out, walking around, eating, and laughing, ~ that kind of shared excitement is something you don&#x27;t experience every day, hard to forget"}]}]}, {"h": "<b>传统节日/文化的意义<\/b>", "c": [{"h": "(1) traditions is still important, but the way people celebrate has changed, ~ take Chinese new year for example, ~ people used to visit each other in person, but now a lot of that happens over the phone or video call, ~ not disappearing, just evolving with modern life"}, {"h": "(2) help connect different generations,  ~ during holidays, the whole family sit together, kids learn customs naturally, ~ watching, joining in, asking questions, ~ culture get passed down through experience, from one generation to the next"}]}, {"h": "<b>文化节cultural festival<\/b>", "c": [{"h": "(1) went to a cultural festival once with my friends, a great experience", "c": [{"h": "tried different street foods, ~ really enjoyed rice cake, light and refreshing"}, {"h": "watched a traditional lion dance, ~ the costumes and movements, so impressive"}, {"h": "春节1、春节2"}]}, {"h": "(2) 再去一次 if went again, would love to try more hands-on activities", "c": [{"h": "last time, just walked around, tried some street food,~ next time, want to try making pottery, or paper cutting, ~ sounds fun, doing something with your hands help understand a culture better and deeper"}]}, {"h": "(3) 自己的文化 As for my own culture, would love to make dumplings", "c": [{"h": "a big part of Chinese culture, ~ the whole family get together around the table, bring people closer"}, {"h": "harder than it looks, ~ wrapping them up take practice, but a part of fun, ~ when finally get it right, feel a real sense of accomplishment, ~ taste even better, because you made them yourself"}]}, {"h": "<u>文化节的意义<\/u> both fun and a great way to keep traditions alive", "c": [{"h": "people show up for food and music, but end up learning something, ~ how dumplings are made, the stories behind the traditions"}, {"h": "a natural way to help young people feel connected to their roots, ~ learn about culture through experience, not by sitting in a history lesson, ~ make the learning more enjoyable, help understand a culture better and deeper"}]}]}]}, {"id": "group-8", "label": "Group 8 工作与通勤", "group": 8, "nodes": [{"h": "<b>工作和生活的平衡 make a good balance between work and personal life<\/b>", "c": [{"h": "(1) work take up a lot of my daily life, but try my best to maintain a good balance", "c": [{"h": "sit at a desk all day, 累"}, {"h": "after work, jogging, 睡前"}, {"h": "set boundaries, not check work messages after work + spend weekend time with friends + enjoy my own life, 放松"}]}, {"h": "(2) <u>RA work<\/u> (experience): work as a research assistant at a university", "c": [{"h": "(1) spend most of time reading papers, analyzing data, meet with professors every week, writing up findings"}, {"h": "(2) sit at a desk all day"}, {"h": "(4) require patience, ~ sometimes, need to spend weeks on one question before things start to make sense"}, {"h": "(3) when find something interesting in the data, or when things finally start to make sense after weeks of work, ~ feel really rewarding and meaningful, ~ those moments keep me motivated, make all the effort worth it."}]}]}, {"h": "<b>灵活时间/远程工作 flexible / remote work<\/b>", "c": [{"h": "(1) flexible hours, can work when they&#x27;re most productive, ~ not everyone does their best work from nine to five"}, {"h": "(2) save commuting time, have a more flexible schedule, ~ get home earlier + have more time to relax, ~ have more energy, work better"}, {"h": "(3) the trend is already happening, video calls + cloud tools make it easier, can be done just with a laptop and Wi-Fi"}, {"h": "(4) a win-win, ~ company can save on office space + management costs, employees can save on commuting + have a more flexible schedule"}, {"h": "(3) <u>挑战<\/u>", "c": [{"h": "hard to stay focused at home, more likely to scroll your phone + watch short videos, ~ should become more self-discipline"}, {"h": "hard to set boundaries, end up working longer hours, ~ no clear signal that the workday is over"}]}]}, {"h": "<b>flexible / remote work 的fairness问题<\/b>", "c": [{"h": "(1) not all jobs can be done remotely, ~ some roles require being on site, production + customer service, those might feel unfair if only some people get to work from home"}, {"h": "(2) company need to balance it, ~ offer other benefits, flexible hours + extra days off, ~ make sure they feel valued and treated fairly"}]}, {"h": "<b>换工作 vs 一个工作<\/b>", "c": [{"h": "(1) it takes time to really understand a job + get good at it, ~ keep switching, will be always starting from zero, ~ get deep enough to build real skills + strong relationships with colleagues"}, {"h": "(2) money: need a stable job, ~ pay rent + cover living expenses, ~ changing too often can be risky"}]}, {"h": "<b>大公司 vs 小公司<\/b>", "c": [{"h": "(1) get more chances to be involved in different task, handle many roles, ~ get deep enough to build real skills, grow faster"}, {"h": "(2) communication is much easier, ~ talk to boss directly + share your real ideas, ~ not have to go through layers of approval, ~ work more efficiently, ~ open environment, improve you performance + stay good mental health"}]}, {"h": "<b>好的工作 looking for a job / 对工作不满<\/b>", "c": [{"h": "(1) whether actually enjoy the work, ~ if not like what you do, hard to stay motivated or find it rewarding, ~ since spend most of your life at work, should make you feel meaningful, not just something you do to get through the day"}, {"h": "(2) money, ~ need a stable income, pay rent + cover living expenses, ~ changing jobs too often can be risky, should have financial stability"}, {"h": "(3) work-life balance, ~ have enough time to relax and recharge after work, ~ more productive, have more energy to get things down, ~ without that, easy to burn out, hurt your physical and mental health over time"}, {"h": "(4) look for chances to grow, ~ if the job offer you chance to learn something new + improve your skills, keep you engaged and motivated, ~ help you become better over time"}, {"h": "(3) work environment, ~ if the communication is open + people support each other, make the whole experience more enjoyable, ~ can do your best work"}]}, {"h": "<b>take the subway<\/b>", "c": [{"h": "(1) take subway almost every day, ~ go to work and back home, about 30 minutes each way, ~ 听歌, 放松"}, {"h": "(2) a practical option, ~ driving in the city is stressful, parking is hard to find, taking a taxi cost too much"}, {"h": "(3) save money, ~ no need to pay for gas, parking, or repairs, a monthly subway pass cost much less"}, {"h": "(4) <u>挑战<\/u> have rush hour, ~ get packed in the morning, can not even find a seat, ~ uncomfortable, especially in the summer"}, {"h": "(5) <u>朋友开车<\/u> drives to work every day, ~ his office is about the same distance as mine, his commute takes almost an hour because of traffic, ~ leaves home early to avoid rush hour, has to pay for a parking spot near his office"}]}, {"h": "<b>短距离通勤 commuting<\/b>", "c": [{"h": "(1) <u>搬家<\/u> the reason I choose my current apartment, ~ small, but only a 5 minute walk from the subway station, ~ before that, have to take a bus and then transfer to the subway, take over 1 hour"}, {"h": "(2) a short commute make a big different, can get home earlier, have more time to relax,  睡前"}]}, {"h": "<b>多投资公共交通<\/b>", "c": [{"h": "(1) if more people take the subway, fewer cars on the road, ~ less traffic + less pollution, ~ can make a big different in a crowded city"}, {"h": "(2) everyone have access, ~ not everyone can afford a car, ~ give a way to get around without spending too much, make life more convenience"}]}, {"h": "<b>公司报销通勤费<\/b>", "c": [{"h": "(1) only commute because they have to go to work, company should share some of that cost, ~ many already offer subway pass, my department does this, save me a lot each month"}, {"h": "(2) employee will feel valued, be willing to stay longer, ~ this kind of benefit help attract talented workers, ~ benefit the company itself"}]}]}, {"id": "group-9", "label": "Group 9 饮食与居家", "group": 9, "nodes": [{"h": "居家", "c": [{"h": "(1) enjoy decorating,~ live in a small apartment, keep things clean and simple, ~ 放松, ~ even small changes can make the space feel fresh"}, {"h": "(2) plants, put few plants on windowsill, ~ bring nature to city life, some green make the room feel more alive, ~ it did not cost much, but make a big difference"}, {"h": "(3) desk, move my desk near the window, ~ get more natural light, breath fresh air, much easier on my eyes, ~ clean my mind, boost my mood"}, {"h": "(4) <u>理想居住空间<\/u> the space should feel open, not too crowded + have a big window", "c": [{"h": "plants"}, {"h": "desk"}]}, {"h": "(5) <u>整洁的环境<\/u>", "c": [{"h": "if messy and crowded, feel stressed, can not focus, ~ waste time looking for things"}, {"h": "after clean up, organize everything, feel more clearer and lighter, ~ easier to clear my mind, boost my mood, get things down"}]}]}, {"h": "<b>饮食<\/b>", "c": [{"h": "(1) try to eat health, prefer something healthy and light,~ fresh ingredients, good quality, and safe to eat, ~ that is why I cook at home most of the time, ~ healthier and cheaper, ~ control what goes into the food, keep the nutrition balanced"}, {"h": "(2) eat a lot of vegetables, eggs, and fishes, ~ healthy and light, easy to cook"}, {"h": "(3) have fruits and milk every day, ~ get different nutrients, keep things balanced"}, {"h": "(4) on busy days, not have time to cook, ~ choose processed food or fast food, ~ try to get back to cooking the next day, not make it a habit"}, {"h": "(5) on weekends, when hang out with friends, we sometimes grab a milk tea or some fried chicken, ~ not a healthy choice, but part of fun"}, {"h": "<u>改变<\/u>", "c": [{"h": "used to order takeout almost every day, ~ over time, made me gain weight and feel sluggish, ~ so, started cooking simple meals at home, 在家做, ~ made a big different"}]}, {"h": "<u>出去吃 vs 在家做<\/u>", "c": [{"h": "eat out not often, once a month,~ on a tight budget, one restaurant meal can cost as much as several home-cooked ones"}, {"h": "cook at home most of the time,~ healthier and cheaper, ~ control what goes into the food, keep the nutrition balanced"}]}, {"h": "<u>食物质量 vs 氛围和服务<\/u>", "c": [{"h": "for me, food comes first, ~ going to a restaurant is about enjoying good food, ~ if the food is disappointing, simply would not go back, no matter how nice the place looks"}, {"h": "atmosphere and service do help, ~ a comfortable environment and good service, enhance the whole experience, ~ make the meal more enjoyable"}]}, {"h": "<u>健康食物不好吃<\/u>", "c": [{"h": "health food can taste good, just depend on how you prepare it, ~ season it well, cook it properly, ~ can be both healthy and delicious"}, {"h": "it is about forming good habits, ~ when first make the switch, can feel hard to give up junk food that tastes good but isn&#x27;t good for you, ~ for me, quit milk tea, switch to just water, feel much lighter and have more energy, ~ just need to give yourself time"}]}]}, {"h": "<b>居家 Household life<\/b>", "c": [{"h": "(1) live on my own, ~ have my own place, small but comfortable, ~ keep things the way I want, follow my own routine without disrupting anyone else"}, {"h": "(2) 做饭, 跑步, 睡前, 周末(电影), 绿植"}, {"h": "<u>重复家务<\/u>repetitive household:", "c": [{"h": "(1) take care of my plants, ~ simple routine, but help me slow down, ~ watch them grow little by little, a sense of accomplishment, 绿植"}, {"h": "(2) cooking at home regularly, ~ healthy and cheaper, 做饭"}]}, {"h": "<u>自己住坏处<\/u>", "c": [{"h": "get lonely sometimes, ~ when come home after a long day, no one to talk to, ~ have to find your own ways to relieve stress and unwind, like going for a run, or putting on some music"}, {"h": "if get sick, no one around to help, ~ have to push through it on my own, ~ probably the hardest part of living alone"}, {"h": "have to handle everything on your own, ~ cooking, cleaning, repairs, ~ force you to learn more life skills, figure things our through trail and error"}]}, {"h": "<u>家务分工<\/u> household responsibilities", "c": [{"h": "(1) depend on each person&#x27;s schedule and abilities, ~ more practical, ~ not everyone has the same free time, simply fifty-fifty not always fair"}, {"h": "(2) make more sense to let each person handle what they are good at, ~ some are better at cooking, others are better at cleaning, ~ as long as everyone does their part, it works out"}]}]}]}, {"id": "group-10", "label": "Group 10 个人管理与目标", "group": 10, "nodes": [{"h": "<b>组织/做计划/时间管理 organization / time management<\/b>", "c": [{"h": "(1) make to-do lists, set phone reminders for deadlines and meetings, ~ give me a clear picture of what needs to be done, make sure I don&#x27;t miss anything important, ~ help me stay on trace, really give me peace of mind"}, {"h": "(2) break bigger tasks down into smaller pieces, ~ make everything feel more manageable, ~ get things done one by one, give a sense of accomplishment, ~  boost my confidence, motivate me to keep going, try even harder next time"}, {"h": "<u>天生 vs 学习<\/u> didn&#x27;t always plan ahead before, just learned from mistakes,", "c": [{"h": "would leave everything to the last minute, end up rushing to finish things the night before the deadline"}, {"h": "those experiences taught me how important planning is, ~ over time, built the habit of writing things down and planning out my week, ~ made a huge difference"}]}]}, {"h": "<b>组织/做计划/时间管理的意义<\/b>", "c": [{"h": "(1) a really valuable life skill, ~ know how to manage your time and prioritize tasks, ~ handle pressure much better,  give you peace of mind knowing everything is under control", "c": [{"h": "without that, easy to feel stressed and anxious, ~ lose track of everything, feel hard to focus on anything properly, ~ end up wasting energy worrying, not actually getting things done"}]}, {"h": "(2) 组织/做计划1、组织/做计划2"}, {"h": "(3) <u>生活中也是<\/u>  居家-整洁的环境"}]}, {"h": "<b>set a goal <\/b>", "c": [{"h": "(1) try to build a regular exercise habit, ~ have been keeping up my running routine, gradually increasing my distance to improve my endurance and strength, ~ would love to join a local marathon someday"}, {"h": "<u>经历<\/u> built my daily jogging habit step by step, ~ in the beginning, running for 30 minutes without stopping was impossible for me, → I just started for 5 minutes, added a little more each week,~ a few months later, I finally hit my goal", "c": [{"h": "(如何实现) break the goal down into small steps, ...., that approach made it manageable, kept me motivated, 做计划"}, {"h": "(感受) ... felt rewarding and meaningful, ~ showed that little by little goes a longer way than we realized"}]}, {"h": "<u>挑战<\/u> find ways to stay motivated, ~ sometimes, just do not feel like going outside at all", "c": [{"h": "break goals down into small steps, ~ 组织/做计划2"}, {"h": "run with a friend can make a huge difference, ~ when have someone beside you, can keep me going, stay motivated"}, {"h": "reward myself after hitting a small goal, ~ a favorite meal, or a rest day, ~ makes the whole journey more enjoyable"}, {"h": "talk to friends or professor (experience)"}]}, {"h": "<u>设定目标的意义<\/u>", "c": [{"h": "(1) goals give you a clear direction and something to work towards, ~ without a goal, easy to feel lost or anxious, ~ might have a busy schedule but make no real progress, ~ end up feeling like you have wasted your time"}, {"h": "(2) when break a goal down into small steps, start making progress, ~ 组织/做计划2"}, {"h": "(3) help develop good habits, ~ when have a goal, naturally start to manage your time better, and prioritize tasks, ~ handle pressure much better"}, {"h": "(4) goals should be simple and realistic, ~ a ten-year-old cannot plan their whole future, but a small and clear goal can teach them that effort leads to results, ~ that lesson stay with them as they grow up"}]}]}]}, {"id": "group-11", "label": "Group 11 教育与成长", "group": 11, "nodes": [{"h": "<b>school experience<\/b>", "c": [{"h": "(1) really enjoyed school as a child", "c": [{"h": "during breaks, would run around and play with friends, ~ just have fun together, without thinking about anything else"}, {"h": "after school, a group of us would walk home together, chat along the way, ~ those moments were simple, but really happy"}, {"h": "still remember my Chinese teacher, ~ was very kind, always encouraged us, ~ whenever someone made a mistake, would just smile and say it was OK, and guide us to get it right, ~ made learning feel enjoyable and engaging, really helped me build confidence"}]}, {"h": "(2) 学校活动 school project (见 history)"}, {"h": "(3) 学习工具 used online learning platforms in school, ~ had short videos and practice tests", "c": [{"h": "still use one app after school to practice my English listening, ~ feel more like playing a game than studying, makes learning more enjoyable and engaging"}, {"h": "helped me build good learning habits, ~ learned how to learn on my own, ~ how to make a plan, break things down into smaller steps, and stay motivated, ~ made learning feel more manageable, could see myself making progress step by step"}]}]}, {"h": "<b>应试教育 vs 能力培养<\/b> facts vs problem-solving, teamwork", "c": [{"h": "(1) still need to teach basic knowledge, ~ subjects like math, science, and history, ~ help understand the world, shape how you think, how you see things, ~ that foundation is important and shouldn&#x27;t be replaced"}, {"h": "(2) can do more beyond just lecture, ~ for example, group projects, help develop problem-solving skills, learn to work with others, ~ practical skills, can only learn by doing"}]}, {"h": "<b>课堂学习 vs 在线学习<\/b>", "c": [{"h": "(1) online learning is much more flexible, ~ learn at your own pace, there is no fixed schedule to follow, ~ make learning more convenient and efficient, especially for people with busy lives"}, {"h": "(2) online platforms, offer a much wider range of courses with high-quality resources, ~ a 10-minute video can cover the whole chapter, often easier to follow than a traditional lecture, ~ make learning more effective"}, {"h": "(3) cheaper and more accessible, ~ anyone with an internet connection, can access high-quality courses, ~ make education more equal"}, {"h": "(4) video calls still allow real interaction with teachers and classmates, even across regions and time zones, ~ can still find great mentors and build real connections"}, {"h": "(5) encourage active learning, help build good learning habits, ~ learn how to learn on your own, ~ how to make a plan, break things down into smaller steps, and stay motivated, ~ a valuable skill, benefit you well beyond school"}, {"h": "(6) the trend is already here, online courses are already part of everyday education, ~ the flexibility and high-quality resources fit perfectly with the way people live and learn in modern life"}, {"h": "<u>缺点<\/u>", "c": [{"h": "easy to get distracted, ~ without the structure of a classroom, might end up scrolling your phone or putting on music, ~ easy to lose focus, ~ require a lot of self-discipline to stay on track"}, {"h": "not everyone can afford a laptop or a stable internet connection, ~ means that online learning isn&#x27;t truly equal for everyone, even if the courses themselves are free"}, {"h": "some subjects just cannot be taught effectively through a screen, ~ lab work, hands-on research, or any kind of physical practice, ~ those things can only be learned in person"}]}, {"h": "<u>没有固定上课时间<\/u>", "c": [{"h": "在线学习1、在线学习5"}]}, {"h": "<u>线上考试结果不可信<\/u>", "c": [{"h": "it is true that cheating is easier online, ~ students can search for answers, or ask someone for help without being noticed"}, {"h": "but technology is improving, ~ many online tests now use time limits, random question orders, and even camera monitoring to prevent cheating, ~ the gap between online and in-person testing is getting smaller, and it will keep improving"}]}]}, {"h": "<b>多样课程 vs 小班制<\/b>", "c": [{"h": "(1) in a small class, teachers can give more individual attention, ~ easier to ask questions, get feedback, and truly understand the material, ~ remember it much longer"}, {"h": "(2) allow for more real discussion, ~  there are fewer people, everyone has a chance to speak and share ideas, ~ make learning more engaging and interactive, understand the subject deeper"}, {"h": "(3) get to know your classmates and teachers better, ~ a open learning environment, build stronger relationship, ~ hard to get in a large lecture hall"}]}, {"h": "<b>独自 vs 小组<\/b>", "c": [{"h": "group 6 朋友的意义,", "c": [{"h": "~ ask questions, get feedback, and truly understand the material, ~ remember it much longer"}, {"h": "~ makes your preparation more complete than studying alone"}]}]}]}, {"id": "group-12", "label": "Group 12 购物与消费", "group": 12, "nodes": [{"h": "<b>网购 shop online<\/b>", "c": [{"h": "(1) shop online, but not very often, monthly or even less, mostly use it when I have already decided what I want, ~ mostly buy electronics, like laptops or headphones", "c": [{"h": "there are more choices online than in stores, easily compare different models and price, read reviews before making a decision, ~ help get the best option for big purchases"}, {"h": "order from home in just a few minutes, and get things delivered to my door, ~ fast and convenient, especially for people like me with busy schedules"}, {"h": "衣服不网购、fresh food不网购"}]}]}, {"h": "<b>实体店 physical stores<\/b>", "c": [{"h": "<u>超市<\/u>", "c": [{"h": "(1) go to the supermarket near my apartment several times a week (上一次 just a few days ago), ~ mostly buy things I need in daily life, especially fresh fruits and vegetables, ~ also grab some dairy products, like milk or yogurt, and packaged food only when I really need it", "c": [{"h": "don&#x27;t like buying too much at once, because fresh produce doesn&#x27;t last long, ~ just enough for the next day or two, everything stays fresh"}, {"h": "pick them out myself, so know they are good quality"}, {"h": "always plan ahead, ~ try to make a shopping list before I go, only buy what I actually need to fit my budget"}, {"h": "放松 (同 衣服)"}, {"h": "fast and convenient, ~ the supermarket is right near my apartment, can go whenever I run out of something, ~ not have to wait for delivery or plan a big trip, just walk in and pick what I need"}]}]}, {"h": "<u>衣服<\/u>", "c": [{"h": "(1) enjoy shopping for clothes, but don&#x27;t do it very often", "c": [{"h": "with a busy schedule, it takes time to find the right fit"}, {"h": "also on a tight budget, have to be careful about what I spend, ~ most of my money has to go to rent and living expense"}, {"h": "but love the shopping experience, a small way for me to unwind, ~ when go shopping, feel like a nice break from the routine, ~ wearing something new often clear my mind and boost my mood, make me feel refreshed"}, {"h": "自己购物 prefer shopping for myself, ~ know exactly what I need, don&#x27;t have to guess someone else&#x27;s preferences, ~ just easier and less stressful + (向上兼容)"}]}, {"h": "(2) prefer comfortable, casual styles", "c": [{"h": "not spend much time deciding what to wear, ~ most of my outfits look pretty similar, like T-shirts and running shoes, ~ easy to mix and match, a few basic colors can go with everything, ~  having a simple style make my mornings a lot easier"}, {"h": "sit at a desk all day and go for a jog after work, need clothes that are practical and easy to move in"}, {"h": "每天穿什么 depend on the weather, ~ check weather forecast, choose something appropriate, ~ If it is cold, will grab a jacket before I leave + (向上兼容)"}]}, {"h": "(3) never buy clothes online", "c": [{"h": "need to try things on to make sure they fit, can not judge the quality from a picture"}, {"h": "see how something looks and  feels, return them easier"}, {"h": "ordered something online before, it looked completely different from the picture, ~ the color was way too bright, and the design wasn&#x27;t what I expected"}]}]}]}, {"h": "<b>追逐潮流 / 买太多<\/b>", "c": [{"h": "(1) fashion trends come and go so quickly, spending a lot of money chasing every new style is pretty wasteful, ~ for me, choose comfortable, casual styles, ~ like T-shirts and running shoes, ~ easy to mix and match, a few basic colors can go with everything, ~ simple styles are more durable, they last longer and never really go out of style"}, {"h": "(2) create a lot of waste, ~ you might get excited about new clothes, but they just get thrown away once the trend fades or the excitement is gone, ~ really bad for the environment", "c": [{"h": "put a lot of pressure on landfills, ~ when people keep buying and throwing things away, they can take decades to break down, not sustainable"}, {"h": "production consumes a lot of energy and materials, ~ when people buy things they don&#x27;t need, that is a huge waste of resources"}, {"h": "for me, would rather buy a few high-quality pieces, ~ more eco-friendly, they last longer, ~ buying less but better is a smarter choice"}]}]}, {"h": "<b>购物方式的变化<\/b>", "c": [{"h": "(1) more people will shop online, ~ can compare prices, read reviews, and get things delivered to your door, ~  fast and convenient, especially for people with busy schedules"}, {"h": "(2) people will pay more attention to the environment, ~ not chase every new trend, but buy a few high-quality pieces, ~ more eco-friendly"}]}, {"h": "<b>网购 vs 实体店<\/b>", "c": [{"h": "(1) depend on what you are buying", "c": [{"h": "For electronics, like laptops or headphones, 网购"}, {"h": "For clothes, 衣服3"}, {"h": "For things I need in daily life, especially fresh fruits and vegetables, 超市"}]}, {"h": "(2) the way we shop will change, but stores will stay", "c": [{"h": "online shopping is convenient, but many people still enjoy shopping in person, ~ for things like clothes, 衣服3"}, {"h": "going to a store is also an experience, ~ pick out fresh food, try things on, 衣服-放松"}]}]}, {"h": "<b>购买的因素<\/b>", "c": [{"h": "(1) quality, ~ buy a few high-quality pieces, ~ more eco-friendly, they last longer", "c": [{"h": "used to go for the cheapest option, ~ often break quickly, cost more in the long term"}, {"h": "now, compare options and read reviews before I decide, especially for bigger purchases"}, {"h": "wait for a promotion, get it at a lower price"}]}, {"h": "(2) <u>冲动消费<\/u> always plan ahead, ~ try to make a shopping list before I go, only buy what I actually need to fit my budget", "c": [{"h": "on a tight budget, have to be careful about what I spend, ~ most of my money goes to rent and living expenses, there is not much room for impulse purchases"}, {"h": "but sometimes, when hungry or tired after work, walk past those shop, hard to say no, ~ might buy things like milk tea, fried chicken, or cake"}, {"h": "sometimes my friends and I split the bill on a big cake, can each have a piece without spending too much, ~ try to keep it under control"}]}]}, {"h": "<b>超市 grocery stores vs 农贸市场 farmers markets<\/b>", "c": [{"h": "(1) prefer groceries store, fast and convenient, ~ 超市-家附近"}, {"h": "(2) get everything in one place, ~ fruits, vegetables, dairy, and other daily items, ~ buy everything I need in one trip"}, {"h": "(3) open every day with fixed hours, fit my work schedule better, ~ farmers markets usually only open on weekends and close early, not very practical for me"}]}]}, {"id": "group-13", "label": "Group 13 理财与预算", "group": 13, "nodes": [{"h": "<b>管理钱 manage money<\/b>", "c": [{"h": "(1) always plan ahead, ~ try to make a shopping list before I go, only buy what I actually need to fit my budget", "c": [{"h": "on a tight budget, have to be careful about what I spend, ~ most of my money goes to rent and living expenses, there is not much room for impulse purchases"}, {"h": "create a lot of waste, ~ you might get excited about new clothes, but they just get thrown away once the trend fades or the excitement is gone, ~ really bad for the environment, 潮流2"}]}, {"h": "(2) check my spending regularly, usually at the end of each month, ~ go through how much I spent and how much I could save, ~ help me stay on track and avoid overspending"}, {"h": "(3) every month, put a fixed amount into savings, ~not too much, but over time make a real difference, ~ keep that money aside for emergencies, give me peace of mind when something unexpected happens"}, {"h": "(4) 大额消费 for expensive purchases, always save up and pay in full, ~ not like buying on credit, or paying in installments, because the interest make it more expensive in the end, ~ would rather spend a few months saving enough money before buying it, avoid that extra cost", "c": [{"h": "on a tight budget"}]}, {"h": "(5) 额外收入 if received extra money, would save most of it, or treat myself to something small, like a nice meal or a new pair of headphones, ~  wouldn&#x27;t spend it all at once, 管理钱3"}, {"h": "<u>理想的方式<\/u> just like what I have been doing, simple and practical"}]}, {"h": "<b>做计划的挑战/意义<\/b>", "c": [{"h": "<u>挑战<\/u>", "c": [{"h": "(1) not plan ahead, ~ 管理钱1, spend without keeping track, no idea where the money went by the end of month"}, {"h": "(2) impulse buying, see something I like and buy it without thinking, ~  冲动消费"}, {"h": "(3) never put anything into savings, ~ 管理钱3, when something unexpected happens, don&#x27;t know what to do, end up stressed and anxious"}, {"h": "(4) social pressure, chase the trend, ~ 潮流1、潮流2"}]}, {"h": "<u>意义<\/u>", "c": [{"h": "(1) help know where your money is going, ~ have a clear picture of your spending, make smarter decisions"}, {"h": "(2) help me stay on track and avoid overspending, ~ when plan ahead, know your limits, not much room for impulse buying or chasing trends"}, {"h": "(3) simple habits, like putting a fixed amount into savings every month, can make a real difference over time, ~ keep that money aside for emergencies, give me peace of mind when something unexpected happens"}]}]}, {"h": "<b>多存钱 vs 享受<\/b>", "c": [{"h": "(1) it is fine to treat yourself to something small, like a nice meal, or a new pair of headphones, ~ help relieve stress, recharge, and stay motivated, ~ will have more energy to get things down, ~ life isn&#x27;t just about saving, you can make it more meaningful and enjoyable"}, {"h": "(2) always plan ahead and make a budget every month, everything is under control, ~ once my rent, savings, and living expenses are covered, I know how much I have, ~ unlikely to overspend, can still stay on track with my financial goals"}]}, {"h": "<b>学校 vs 实践<\/b>", "c": [{"h": "(1) school need to teach basic knowledge, ~ subjects like math, science, and history, ~ help understand the world, shape how you think, how you see things, ~ that foundation is important, understanding numbers and logic help you build real financial literacy, ~ without that, hard to make smart financial decisions and manage money well"}, {"h": "(2) everyone has a different financial situation, ~ what works for one person might not work for another, hard to give one single answer that fits everyone, ~ have to learn through real-life experience"}, {"h": "(3) mistakes are part of the process, ~ when make a budget and overspend once or twice, will take something away from that experience, ~ learn from it, find better solutions, and do better next time, ~ good for students to learn by doing, trial and error give you a much deeper understanding than any classroom lesson / anyone&#x27;s advice could"}, {"h": "<u>怎么学会理财<\/u>", "c": [{"h": "实践2、实践3"}]}]}, {"h": "<b>物超所值 get good value vs 花更少的钱 spend little<\/b>", "c": [{"h": "group12-购买的因素"}]}, {"h": "<b>理财app vs 理财经理<\/b>", "c": [{"h": "(1) free, easy to use, ~ can do everything just on your phone, check your spending, set budgets, track savings, ~ really convenient, especially for people with busy schedules"}, {"h": "(2) the trend is already here, more and more people are using apps to manage their money, especially younger generations who grew up with smartphones, ~ it just feels natural to them"}, {"h": "(3) a personal financial manager makes more sense for people with large incomes or complex investments, ~ for most person like me, an app does the job perfectly well"}]}]}, {"id": "group-14", "label": "Group 14 科技与社交媒体", "group": 14, "nodes": [{"h": "<b>科技的使用<\/b>", "c": [{"h": "(1) a big part of my life, use it every day,", "c": [{"h": "spend most of my workday in front of a computer, about six or seven hours of screen time, ~  as a research assistant, read papers, analyze data, and write up findings"}, {"h": "spend another hour on my phone and headphones, ~ on subway home, listen to music or podcasts, + when go for a jog, put on my headphones + when get home, sprawl on the sofa, scroll through my phone, and watch short videos, ~ have some fun and unwind, help relieve stress and take a break from the routine"}]}, {"h": "(2) use social media", "c": [{"h": "stay connected with friends and family, ~ share updates, photos, and little things from daily life, just something fun, ~ sometimes, video call or send audio message, ~ a nice way to keep us in touch, especially when we has busy schedules and cannot meet up very often"}, {"h": "keep up with what&#x27;s happening around the world, ~ faster than traditional news, get updates in real time just on your phone, ~ follow some accounts that post high-quality videos about topics I am interested in, like health and technology, ~ easy to stay informed and discover new things"}, {"h": "online learning (group11-在线学习)"}]}, {"h": "<u>内容分享<\/u>", "c": [{"h": "totally fine to share everyday moments on social media, ~科技的使用2-1"}, {"h": "should be careful with private information, ~ things like ID numbers, home addresses, phone numbers, or financial details, should never be posted online, ~ can&#x27;t know who might see it or what it could be used for, it could put your safety at risk"}, {"h": "in turn, should respect other people&#x27;s privacy, ~ don&#x27;t post their photos or information without permission / asking"}]}]}, {"h": "<b>科技的意义/挑战<\/b>", "c": [{"h": "<u>意义<\/u>", "c": [{"h": "科技的使用1、科技的使用2-1、科技的使用2-2"}]}, {"h": "<u>挑战<\/u>", "c": [{"h": "(1) private, ~ 内容分享"}, {"h": "(2) face-to-face communication, ~ it is true that people spend less time talking face to face now, a lot of conversations happen through texting or video calls, ~ but I don&#x27;t think it hurts real connection, ~ 科技的使用2-1"}, {"h": "(3) technology changes so fast, feel stressful to keep up, ~ just get comfortable with a system, and then it updates, or a completely new tool comes along, ~ it is part of living in a digital world, need to keep pace with it, so can use it to benefit our work and life"}, {"h": "(4) job market, ~ job market keep changing but also bring new opportunities,~ replace simple, repeated tasks, like delivery robots and self-driving cars, ~ but at the same, create new works from new invention, like delivery drivers, prompt engineers, and some AI-related jobs"}, {"h": "(5) critical thinking, ~  more important now than ever, ~ there is so much information online, and not all of it is reliable, ~ people need to learn to evaluate what they read, not just follow someone else, and tell the difference between facts and misinformation, ~ a really valuable skill in the modern world"}, {"h": "(6) compare to others, ~ can&#x27;t really avoid social comparisons, but don&#x27;t have to feel bad about yourself, ~ seeing successful people online can actually be motivating, give you role models and a clearer sense of where you want to go"}]}]}]}, {"id": "group-15", "label": "Group 15 天气与环保", "group": 15, "nodes": [{"h": "<b>weather<\/b>", "c": [{"h": "(1) the city where I live has four distinct seasons", "c": [{"h": "summers are really hot and humid, sometimes reaching 38 or 39 degrees ~ can be hard to stay outside for long, ~ just start sweating the moment I step outside, so I move my jog to the evening when it cools down, or just skip it"}, {"h": "winters are pretty cold and dry, ~ freezing cold, temperatures drop below zero ~ mostly stay indoor"}, {"h": "spring and fall are the most comfortable, ~ perfect for outdoor activities, like jogging or just taking a walk, ~ very chill and charming, just enjoying the breeze and relaxing, but they go by too fast"}]}, {"h": "(2) would prefer four distinct seasons, really enjoy the changes", "c": [{"h": "really enjoy the changes, ~ in spring, the flowers turn pink, and in fall, the leaves turn golden, ~ feel nature coming alive"}, {"h": "after a long cold winter, really appreciate the warmth when it comes back, ~ if the weather were always the same, would just take nice weather for granted"}, {"h": "each season has its own charm, different clothes, different activities, ~ never gets boring"}]}, {"h": "(3) 下雨天 usually grab an umbrella, wear weatherproof shoes before going out, ~ check the forecast hourly, see if I need to adjust my plans, ~ if it is a raining hard, will skip my jog, take the subway and try to avoid walking outside"}]}, {"h": "<b>应对极端天气<\/b>", "c": [{"h": "(1) extreme weather is becoming more and more common, like typhoons, heavy rainstorms, snowstorms, droughts, flooding"}, {"h": "(2) should invest more in infrastructure and emergency response systems, like stronger buildings and early warning systems, ~ so people have more time to prepare and stay in a safer place"}, {"h": "(3) educate people on how to respond during extreme weather, ~ having basic knowledge, help people stay calm, make the right decisions, ~ that can be the difference between safety and danger"}]}, {"h": "<b>环保<\/b>", "c": [{"h": "<u>个人行动<\/u>", "c": [{"h": "(1) 节约能源 (experience) saving energy in everyday life is more of a habit for me, ~ turn off the lights when I leave a room, switch off chargers when they are not in use, and try not to waste water, ~ save energy, save money,", "c": [{"h": "once you start paying attention, you realize there is a lot you can do"}]}, {"h": "(2) 重复利用 try to reuse things as much as I can, ~ bring my own bag when shopping, use a reusable water bottle, and avoid buying plastic ones or things I don&#x27;t really need, ~ save resources (——recycling)"}, {"h": "(3) 垃圾分类 sort my trash every day, ~ paper, plastic, and kitchen waste go into separate bins, ~ that way, most of it can be recycled (——recycling)"}, {"h": "活动 help plant trees in my community", "c": [{"h": "trees help clean the air, cool things down, and create green spaces for people to enjoy, ~ simple but it makes a real difference, ~ would also be a great way to spend time outdoors and do something meaningful with the community."}]}]}, {"h": "<u>社区行动<\/u>", "c": [{"h": "(1) 绿地 has been planting more trees, creating green spaces, like small parks and gardens along the streets, ~ help clean the air, cool things down, ~ make the neighborhood feel fresher and cleaner, ~ also a nice place to relax, being around nature really boost your mood, help you calm down"}, {"h": "(2) 可再生能源 solar panels have already been used for hallway lights in our buildings, some even have them on the roof, ~ public charging stations for electric vehicles are becoming more and more common, ~ clean energy is becoming part of everyday life."}, {"h": "(3) 共享单车 the city has been building bike-sharing and improving public transportation, ~ cheap and convenient, ~ help reduce traffic and air pollution at the same time, encourage more people to go green"}, {"h": "(4) 垃圾分类 there are recycling bins with different colors and labels, ~ can easily sort their trash", "c": [{"h": "without them, people used to just put everything in one bag, a lot of recyclable stuff ended up in the landfill, ~ really bad for the environment"}]}]}]}, {"h": "<b>环保的困难<\/b>", "c": [{"h": "(1) with a busy schedule, sometimes just too tired to get things done properly, ~ might forget to sort my trash, or just put everything into one bag", "c": [{"h": "the key is to build a habit, ~ once you understand how recycling helps the environment, start to take it more seriously, ~ make it part of your routine over time"}]}, {"h": "(2) sometimes the rules aren&#x27;t clear, ~ when the recycling bins don&#x27;t have different colors or labels, really confusing, ~ just throwing things in the wrong bin, ~ make the whole sorting process much harder, create extra work for everyone", "c": [{"h": "give feedback to my community, ~ suggest them set clearer rules and better labels on the bins, ~ when the system is easy to follow, more people will actually take action"}]}]}, {"h": "<b>可再生能源的好处<\/b>", "c": [{"h": "(1) renewable energy is better for public health and safety, ~ burning fossil fuels causes a lot of air pollution, climate change and extreme weather, ~ cleaner energy brings cleaner air and a safer environment for everyone"}, {"h": "(2) fossil fuels will eventually run out, ~ should make the switch to renewable energy now for future generations"}, {"h": "(3) The first cost is high, but much cheaper to maintain, can lower the cost of energy, ~ we can benefit a lot from it in the long term"}]}, {"h": "<b>个人 vs 政府<\/b>", "c": [{"h": "(1) governments can set rules, regulate both individuals and factories, ~ without policies, a lot of people simply won&#x27;t take action on their own, ~ clear rules on how to protect the environment, help society build the habit and make it a norm over time"}, {"h": "(2) governments can invest in infrastructure, like recycling programs and renewable energy, ~ have a much bigger impact than individual efforts alone, this way, real change will come from"}, {"h": "(3) it still takes everyone&#x27;s effort, ~ policies set the direction, but people need to follow through, like sorting trash, saving energy, and choosing greener options in daily life, ~ when everyone does their part, real change comes from"}]}]}], "seed": {"repeat_mock-1": "flyer 传单 / at the front of 在前方", "repeat_mock-2": "check inbox 查看收件箱 / compose 撰写 / contacts list 联系人列表，add recipients to your note 添加收件人 / review sent items 查看已发送项目，were delivered 已发送 / use folders 使用文件夹，organize your correspondence 管理通信 / set up topical filters 设置主题过滤器，manage incoming communications 管理传入通信 / to be safe 安全起见，log out 登出，keep your electroni <script>
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const KEY = 'toefl_speaking_v1';
const $ = s => document.querySelector(s);
function el(tag, props, kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  (kids || []).forEach(c => c != null && e.append(c));
  return e;
}

// ---------- state ----------
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
if (!S || typeof S !== 'object') { S = JSON.parse(JSON.stringify(DATA.seed)); S.pref_seeded = DATA.seedAt || true; }
let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert('保存失败：' + e.message); } }, 150); }
const pref = (k, d) => S['pref_' + k] ?? d;
function setPref(k, v) { S['pref_' + k] = v; save(); }
function applyFont() { document.documentElement.style.setProperty('--fs', pref('fs', 16) + 'px'); }
applyFont();

// ---------- sections ----------
const SEC = {
  repeat: {
    groups: DATA.repeat, cats: DATA.repeatCats, extra: [['supplement', '补充材料']],
    entryId: g => g.n ? 'repeat-group-' + g.id : 'repeat-' + g.id,
    noteKey: g => g.n ? 'repeat_' + g.id : 'repeat_supplement_' + g.id.slice(11),
    gaps: [0, 2, 4, 6, 8], gapDefault: 4, unit: '句'
  },
  interview: {
    groups: DATA.interview, cats: DATA.interviewCats, extra: [],
    entryId: g => 'interview-group-' + g.id,
    noteKey: g => 'interview_notes_' + g.id,
    gaps: [0, 15, 30, 45], gapDefault: 45, unit: '题'
  }
};
const view = {};
for (const id of Object.keys(SEC)) view[id] = { cat: 'all', fav: false, list: [], nodes: new Map(), built: false, open: new Set() };
const catsOf = g => g.cats.length ? g.cats.map(String) : ['unassigned'];
function starKey(sid, g, qi) { return 'v2_star_' + SEC[sid].entryId(g) + (qi === undefined ? '' : '_q' + qi); }
function hasSaved(sid, g) { return !!S[starKey(sid, g)] || g.items.some((_, i) => !!S[starKey(sid, g, i)]); }
function titleOf(g) { return g.n ? 'MOCK-' + g.n + (g.en ? ' · ' + g.en : '') : '补充 · ' + g.en; }
const shortOf = g => g.n ? 'M' + g.n : g.en;
const showText = sid => !!pref(sid + '_text', false);

function visible(sid) {
  const v = view[sid];
  let gs = SEC[sid].groups.filter(g => v.cat === 'all' || catsOf(g).includes(v.cat)).filter(g => !v.fav || hasSaved(sid, g));
  if (pref('order', 'ordered') === 'random') {
    v.shuffle = v.shuffle || shuffle(SEC[sid].groups.map(g => g.id));
    gs = gs.slice().sort((a, b) => v.shuffle.indexOf(a.id) - v.shuffle.indexOf(b.id));
  }
  return gs;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildBar(sid) {
  const sec = SEC[sid], v = view[sid], bar = $('#bar-' + sid);
  const cat = el('select', { 'aria-label': '分类', onchange: () => { v.cat = cat.value; refresh(sid); window.scrollTo({ top: 0 }); } });
  const opts = [['all', '全部 (' + sec.groups.length + ')']]
    .concat(sec.cats.map((n, i) => [String(i), n + ' (' + sec.groups.filter(g => g.cats.includes(i)).length + ')']))
    .concat(sec.extra.map(([k, n]) => [k, n + ' (' + sec.groups.filter(g => g.cats.includes(k)).length + ')']));
  const un = sec.groups.filter(g => !g.cats.length).length;
  if (un) opts.push(['unassigned', '未分类 (' + un + ')']);
  opts.forEach(([k, n]) => cat.append(el('option', { value: k, text: n })));
  v.jump = el('select', { 'aria-label': '跳到', onchange: () => { const c = v.nodes.get(v.jump.value); if (c) c.scrollIntoView({ block: 'start' }); window.scrollBy(0, -(document.querySelector('.top').offsetHeight + 6)); v.jump.value = ''; } });
  v.fav = false;
  v.favBtn = el('button', { class: 'pill', text: '☆ 只看收藏', onclick: () => { v.fav = !v.fav; refresh(sid); window.scrollTo({ top: 0 }); } });
  v.textBtn = el('button', { class: 'pill', text: '显示原文', onclick: () => { setPref(sid + '_text', !showText(sid)); v.open.clear(); repaintTexts(sid); paintBar(sid); } });
  bar.append(cat, v.jump, v.favBtn, v.textBtn);
}
function paintBar(sid) {
  const v = view[sid];
  v.favBtn.classList.toggle('on', v.fav);
  v.textBtn.classList.toggle('on', showText(sid)); v.textBtn.textContent = showText(sid) ? '隐藏原文' : '显示原文';
  v.jump.replaceChildren(el('option', { value: '', text: '跳到…' }), ...v.list.map(g => el('option', { value: g.id, text: shortOf(g) + (g.zh ? ' ' + g.zh : '') })));
}

function cardFor(sid, g) {
  const v = view[sid];
  if (v.nodes.has(g.id)) return v.nodes.get(g.id);
  const sec = SEC[sid], card = el('div', { class: 'card', id: sid + '-' + g.id });
  const catName = typeof g.cats[0] === 'number' ? sec.cats[g.cats[0]] : '';
  card.append(el('div', { class: 'card-header' }, [
    el('div', { class: 'card-title' }, [document.createTextNode(titleOf(g)), el('small', { text: [g.zh, catName].filter(Boolean).join(' · ') })]),
    starBtn(starKey(sid, g), '收藏整组')
  ]));
  if (g.scenario) { const sc = el('div', { class: 'scenario' }, [el('span', { text: g.scenario })]); sc.onclick = () => sc.classList.toggle('full'); card.append(sc); }
  const acts = el('div', { class: 'actions' }, [el('button', { class: 'btn', text: '▶ 连续播放 ' + g.items.length + ' ' + sec.unit, onclick: () => Player.start(sid, g, 0) })]);
  if (sid === 'interview' && typeof g.cats[0] === 'number') {
    const gi = g.cats[0] + 1;
    acts.append(el('button', { class: 'btn ghost', text: '📒 背诵 Group ' + gi, onclick: () => { closeSheet(); openNote('group-' + gi); } }));
  }
  card.append(acts);
  g.items.forEach((it, i) => {
    const row = el('div', { class: 'item', 'data-q': i }), tts = !it.audio;
    row.append(el('div', { class: 'item-head' }, [
      el('span', { class: 'qno', text: 'Q' + (i + 1) }),
      el('button', { class: 'play' + (tts ? ' tts' : ''), title: tts ? '无原音频，用手机朗读' : '播放', text: '▶', onclick: () => Player.start(sid, g, i, true) }),
      starBtn(starKey(sid, g, i), '收藏这' + sec.unit),
      el('button', { class: 'reveal', text: '原文', onclick: () => { const k = g.id + ':' + i; v.open.has(k) ? v.open.delete(k) : v.open.add(k); paintText(sid, g, i, row); } }),
      tts ? el('span', { class: 'tag', text: '朗读' }) : null,
      it.img ? el('img', { class: 'thumb', src: it.img, loading: 'lazy', alt: 'Q' + (i + 1), onclick: () => lightbox(it.img, it.en) }) : null
    ]), el('div', { class: 'text' }));
    paintText(sid, g, i, row);
    card.append(row);
  });
  // Notes: show the box only when there is something in it, otherwise a small add link.
  const nk = sec.noteKey(g), ta = el('textarea', { placeholder: '笔记…' });
  ta.value = S[nk] || '';
  ta.addEventListener('input', () => { if (ta.value) S[nk] = ta.value; else delete S[nk]; save(); });
  const add = el('button', { class: 'note-add', text: '＋ 写笔记', onclick: () => { add.hidden = true; ta.hidden = false; ta.focus(); } });
  ta.hidden = !ta.value; add.hidden = !!ta.value;
  card.append(add, ta);
  v.nodes.set(g.id, card);
  return card;
}
function starBtn(key, label) {
  const b = el('button', { class: 'star', title: label, 'aria-label': label });
  const paint = () => { b.textContent = S[key] ? '★' : '☆'; b.classList.toggle('on', !!S[key]); };
  b.onclick = () => { if (S[key]) delete S[key]; else S[key] = true; paint(); save(); };
  paint(); return b;
}
function paintText(sid, g, i, row) {
  const v = view[sid], box = row.querySelector('.text'), it = g.items[i];
  const show = showText(sid) !== v.open.has(g.id + ':' + i);
  box.hidden = !show; row.querySelector('.reveal').textContent = show ? '隐藏' : '原文';
  if (!show) { box.replaceChildren(); return; }
  const nk = SEC[sid].noteKey(g);
  box.replaceChildren(el('div', {}, [annotatable(nk, 'q' + i + '-en', it.en)]),
    pref('zh', true) && it.zh ? el('div', { class: 'zh' }, [annotatable(nk, 'q' + i + '-zh', it.zh)]) : null);
}
function repaintTexts(sid) {
  const sec = SEC[sid];
  view[sid].nodes.forEach((card, gid) => { const g = sec.groups.find(x => x.id === gid); card.querySelectorAll('.item').forEach(row => paintText(sid, g, +row.dataset.q, row)); });
}

// ---------- annotations (same storage format as test_v2) ----------
function annList(nk, ik, len) {
  const all = S[nk + '_annotations'] || {}, a = Array.isArray(all[ik]) ? all[ik] : [];
  return a.filter(x => x && typeof x.type === 'string' && Number.isInteger(x.start) && Number.isInteger(x.end) && x.start >= 0 && x.end <= len && x.start < x.end);
}
function annotatable(nk, ik, text) { const span = el('span', { class: 'annotatable' }); span._ann = { nk, ik, text }; renderAnn(span); return span; }
function renderAnn(span) {
  const { nk, ik, text } = span._ann, anns = annList(nk, ik, text.length), cuts = new Set([0, text.length]);
  anns.forEach(a => { cuts.add(a.start); cuts.add(a.end); });
  const pos = [...cuts].sort((a, b) => a - b); span.replaceChildren();
  for (let i = 0; i < pos.length - 1; i++) {
    const seg = text.slice(pos[i], pos[i + 1]), types = [...new Set(anns.filter(a => a.start <= pos[i] && a.end >= pos[i + 1]).map(a => a.type))];
    span.append(types.length ? el('span', { class: types.map(t => 'ann-' + t).join(' '), text: seg }) : document.createTextNode(seg));
  }
}
let annSel = null;
function offsetIn(root, node, off) { const r = document.createRange(); r.selectNodeContents(root); r.setEnd(node, off); return r.toString().length; }
document.addEventListener('selectionchange', () => {
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed) { setTimeout(() => { if (getSelection().isCollapsed) { annSel = null; $('#annBar').hidden = true; } }, 200); return; }
  const r = s.getRangeAt(0), host = n => (n.nodeType === 3 ? n.parentNode : n).closest('.annotatable');
  const a = host(r.startContainer), b = host(r.endContainer);
  if (!a || a !== b) { annSel = null; $('#annBar').hidden = true; return; }
  const x = offsetIn(a, r.startContainer, r.startOffset), y = offsetIn(a, r.endContainer, r.endOffset);
  if (x === y) return;
  annSel = { span: a, start: Math.min(x, y), end: Math.max(x, y) }; $('#annBar').hidden = false;
});
document.querySelectorAll('#annBar button').forEach(b => {
  b.addEventListener('pointerdown', e => e.preventDefault());
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => {
    if (!annSel) return;
    const { span, start, end } = annSel, { nk, ik, text } = span._ann, type = b.dataset.ann;
    let anns = annList(nk, ik, text.length);
    if (type === 'clear') {
      const keep = [];
      anns.forEach(a => {
        if (a.end <= start || a.start >= end) { keep.push(a); return; }
        if (a.start < start) keep.push({ type: a.type, start: a.start, end: start });
        if (a.end > end) keep.push({ type: a.type, start: end, end: a.end });
      });
      anns = keep;
    } else if (!anns.some(a => a.type === type && a.start === start && a.end === end)) anns.push({ type, start, end });
    const all = S[nk + '_annotations'] || {}; all[ik] = anns; S[nk + '_annotations'] = all; save();
    renderAnn(span); getSelection().removeAllRanges(); annSel = null; $('#annBar').hidden = true;
  });
});

// ---------- list ----------
function refresh(sid) {
  const v = view[sid];
  if (!v.built) { buildBar(sid); v.built = true; }
  v.list = visible(sid);
  v.box = v.box || $('#tab-' + sid);
  const meta = el('div', { class: 'meta', text: v.list.length + ' 组' + (v.fav ? '（收藏）' : '') + ' · 已收藏 ' + SEC[sid].groups.filter(g => hasSaved(sid, g)).length + ' 组' });
  v.box.replaceChildren(meta, ...v.list.map(g => {
    const card = cardFor(sid, g);
    // Cards are cached; re-sync text visibility in case toggles changed while off-screen.
    card.querySelectorAll('.item').forEach(row => paintText(sid, g, +row.dataset.q, row));
    return card;
  }), v.list.length ? null : el('p', { class: 'empty', text: v.fav ? '还没有收藏。点 ☆ 收藏一句或一整组。' : '这个分类下没有题。' }));
  paintBar(sid);
}

// ---------- player ----------
const audio = new Audio(); audio.preload = 'auto';
const Player = {
  sid: null, g: null, i: 0, single: false, timer: null, state: 'idle', tts: 0,
  get after() { return pref('after', 'stop'); },
  start(sid, g, i, single) { this.stop(true); this.resumeNext = false; this.sid = sid; this.g = g; this.i = i; this.single = !!single; this.play(); },
  item() { return this.g && this.g.items[this.i]; },
  gap() { return +pref('gap_' + this.sid, SEC[this.sid].gapDefault); },
  play() {
    const it = this.item(); if (!it) return this.stop();
    this.state = 'playing'; this.mark(); this.paint();
    const rate = +pref('rate', 1);
    if (it.audio) {
      if (audio.src !== it.audio) audio.src = it.audio;
      audio.playbackRate = rate; audio.currentTime = 0;
      // AbortError just means we switched sentences mid-load; only real failures fall back to TTS.
      audio.play().catch(e => { if (e.name !== 'AbortError' && this.state === 'playing' && this.item() === it) this.speak(it.en, rate); });
    } else this.speak(it.en, rate);
  },
  speak(text, rate) {
    if (!('speechSynthesis' in window)) { this.ended(); return; }
    const token = ++this.tts;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate * 0.95;
    // cancel() fires onerror on the old utterance; the token keeps it from advancing playback.
    u.onend = u.onerror = () => { if (token === this.tts) this.ended(); };
    speechSynthesis.speak(u);
  },
  ended() {
    if (this.state !== 'playing') return;
    if (this.single) return this.stop(false, true);
    const last = this.i >= this.g.items.length - 1;
    if (last && this.after === 'stop') return this.stop(false, true);
    const gap = this.gap();
    this.state = 'gap'; this.paint(gap);
    this.timer = setTimeout(() => this.advance(1), gap * 1000);
  },
  advance(d) {
    clearTimeout(this.timer); this.resumeNext = false;
    if (!this.g) return;
    let i = this.i + d;
    if (i >= this.g.items.length) {
      if (this.after === 'loop') i = 0;
      else if (this.after === 'next') {
        const v = view[this.sid], k = v.list.findIndex(x => x.id === this.g.id), nxt = v.list[k + 1];
        if (nxt) { this.g = nxt; this.i = 0; this.play(); return; }
        return this.stop(false, true);
      } else return this.stop(false, true);
    }
    if (i < 0) i = 0;
    this.i = i; this.single = false; this.play();
  },
  toggle() {
    if (this.state === 'playing') { this.state = 'paused'; audio.pause(); this.tts++; if (window.speechSynthesis) speechSynthesis.cancel(); this.paint(); }
    else if (this.state === 'gap') { clearTimeout(this.timer); this.state = 'paused'; this.resumeNext = true; this.paint(); }
    else if (this.state === 'paused' && this.resumeNext) { this.resumeNext = false; this.advance(1); }
    else if (this.state === 'paused') {
      const it = this.item();
      if (it && it.audio && audio.src === it.audio && audio.currentTime > 0 && !audio.ended) { this.state = 'playing'; audio.play(); this.paint(); } else this.play();
    } else if (SEC[current]) { const g = view[current].list[0]; if (g) this.start(current, g, 0); }
  },
  stop(silent, keep) {
    clearTimeout(this.timer); audio.pause(); this.tts++; if (window.speechSynthesis) speechSynthesis.cancel();
    this.state = keep ? 'paused' : 'idle'; if (!keep) this.unmark();
    if (!silent) this.paint();
  },
  mark() {
    this.unmark();
    const card = view[this.sid].nodes.get(this.g.id) || cardFor(this.sid, this.g);
    const row = card.querySelector('.item[data-q="' + this.i + '"]');
    if (row) { row.classList.add('playing'); if (card.isConnected) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  },
  unmark() { document.querySelectorAll('.item.playing').forEach(n => n.classList.remove('playing')); },
  paint(gap) {
    $('#pPlay').textContent = this.state === 'playing' || this.state === 'gap' ? '⏸' : '▶';
    if (!this.g) { $('#pNow').textContent = '点 ▶ 播放单句，或「连续播放」整组'; return; }
    $('#pNow').textContent = shortOf(this.g) + ' · Q' + (this.i + 1) + '/' + this.g.items.length +
      (this.state === 'gap' ? ' · ' + (this.sid === 'interview' ? '作答' : '跟读') + ' ' + gap + 's' : this.state === 'paused' ? ' · 已暂停' : '');
  }
};
audio.addEventListener('ended', () => Player.ended());
audio.addEventListener('error', () => { const it = Player.item(); if (Player.state === 'playing' && it && it.audio && audio.src === it.audio) Player.speak(it.en, +pref('rate', 1)); });
$('#pPlay').onclick = () => Player.toggle();
$('#pNext').onclick = () => Player.g && Player.advance(1);
$('#pPrev').onclick = () => Player.g && Player.advance(-1);

// ---------- sheets ----------
let sheetOpen = null;
function openSheet(title, content) {
  closeSheet(true);
  const mask = el('div', { class: 'mask', onclick: () => closeSheet() });
  const sheet = el('div', { class: 'sheet' }, [el('div', { class: 'sheet-head' }, [el('b', { text: title }), el('button', { text: '✕', onclick: () => closeSheet() })]), content]);
  document.body.append(mask, sheet); sheetOpen = { mask, sheet };
  // Android back button closes the sheet instead of leaving the app.
  history.pushState({ sheet: 1 }, '');
}
function closeSheet(replacing) {
  if (!sheetOpen) return;
  sheetOpen.mask.remove(); sheetOpen.sheet.remove(); sheetOpen = null;
  if (!replacing && history.state && history.state.sheet) history.back();
  if (current === 'interview') refresh('interview');   // a card may have been borrowed by the sheet
}
window.addEventListener('popstate', () => { if (sheetOpen) { const s = sheetOpen; sheetOpen = null; s.mask.remove(); s.sheet.remove(); if (current === 'interview') refresh('interview'); } });

function settings() {
  const row = (label, sub, ctl) => el('div', { class: 'set-row' }, [el('div', {}, [document.createTextNode(label), sub ? el('small', { text: sub }) : null]), ctl]);
  const seg = (vals, cur, on) => {
    const s = el('div', { class: 'seg' });
    vals.forEach(([v, n]) => s.append(el('button', { class: String(v) === String(cur) ? 'on' : '', text: n, onclick: () => { on(v); s.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === n)); } })));
    return s;
  };
  const gapSeg = sid => seg(SEC[sid].gaps.map(s => [s, s ? s + 's' : '不停']), pref('gap_' + sid, SEC[sid].gapDefault), v => setPref('gap_' + sid, v));
  const body = el('div', {}, [
    el('div', { class: 'set' }, [
      row('播放速度', null, seg([[0.8, '0.8x'], [1, '1x'], [1.2, '1.2x']], pref('rate', 1), v => { setPref('rate', v); audio.playbackRate = v; })),
      row('Repeat 句间停顿', '给跟读留时间', gapSeg('repeat')),
      row('Interview 题间停顿', '给作答留时间', gapSeg('interview')),
      row('一组播完后', null, seg([['stop', '停止'], ['loop', '本组循环'], ['next', '下一组']], Player.after, v => setPref('after', v)))
    ]),
    el('div', { class: 'set' }, [
      row('字号', null, seg([[14, '小'], [16, '中'], [18, '大'], [20, '特大']], pref('fs', 16), v => { setPref('fs', v); applyFont(); })),
      row('原文显示中文', null, seg([[true, '显示'], [false, '不显示']], pref('zh', true), v => { setPref('zh', v); repaintTexts('repeat'); repaintTexts('interview'); })),
      row('题目顺序', null, seg([['ordered', '正序'], ['random', '随机']], pref('order', 'ordered'), v => { setPref('order', v); view.repeat.shuffle = view.interview.shuffle = null; if (SEC[current]) refresh(current); }))
    ]),
    el('p', { class: 'meta', text: '收藏、笔记、标注存在这台手机的浏览器里。音频和图片在线加载，需要联网。' })
  ]);
  openSheet('设置', body);
}
$('#pSet').onclick = settings;

function lightbox(src, cap) {
  const box = el('div', { class: 'lightbox', onclick: () => box.remove() }, [el('img', { src }), cap ? el('div', { class: 'cap', text: cap }) : null]);
  document.body.append(box);
}

// ---------- Interview 背诵 ----------
const notesView = { cur: null, fold: 'open' };
function buildNotes() {
  if (notesView.built) return; notesView.built = true;
  DATA.notes.forEach(n => $('#noteChips').append(el('button', { class: 'chip', 'data-note': n.id, text: n.group ? n.group + ' ' + n.label.replace(/^Group \d+\s*/, '') : n.label, onclick: () => openNote(n.id) })));
  $('#foldSeg').querySelectorAll('button').forEach(b => b.onclick = () => setFold(b.dataset.fold));
}
function renderTree(nodes) {
  const ul = el('ul');
  nodes.forEach(n => {
    const kids = n.c && n.c.length, li = el('li');
    const tw = el('button', { class: 'tw' + (kids ? '' : ' leaf'), text: kids ? '▼' : '•', 'aria-label': kids ? '折叠/展开' : null, onclick: () => { if (kids) li.classList.toggle('closed'); } });
    const h = el('div', { class: 'h', html: n.h });
    h.onclick = () => li.classList.remove('cover');
    li.append(el('div', { class: 'node' }, [tw, h]));
    if (kids) li.append(renderTree(n.c));
    ul.append(li);
  });
  return ul;
}
function setFold(mode) {
  notesView.fold = mode;
  $('#foldSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.fold === mode));
  const box = $('#tab-recite'), lis = box.querySelectorAll('.outline li');
  lis.forEach(li => li.classList.remove('closed', 'cover'));
  if (mode === 'closed') lis.forEach(li => { if (li.querySelector('ul')) li.classList.add('closed'); });
  // Cover only leaf lines: headings stay visible as recall cues.
  if (mode === 'cover') box.querySelectorAll('.outline li li').forEach(li => { if (!li.querySelector('ul')) li.classList.add('cover'); });
}
function openNote(id) {
  buildNotes();
  const n = DATA.notes.find(x => x.id === id) || DATA.notes[1]; notesView.cur = n.id; setPref('note', n.id);
  if (current !== 'recite') switchTab('recite');
  $('#noteChips').querySelectorAll('[data-note]').forEach(b => { const on = b.dataset.note === n.id; b.classList.toggle('on', on); if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' }); });
  const box = $('#tab-recite'), kids = [];
  if (n.group) {
    const rel = el('div', { class: 'related' }, [el('span', { class: 'lab', text: '这组的 Interview 题：' })]);
    DATA.interview.filter(g => g.cats.includes(n.group - 1)).forEach(g => rel.append(el('button', { class: 'qchip', text: 'M' + g.n + ' ' + (g.zh || g.en), onclick: () => openSheet(titleOf(g), cardFor('interview', g)) })));
    kids.push(rel);
  } else kids.push(el('p', { class: 'meta', text: '每个 speaking space 文件开头、不属于某个 Group 的内容（Experience、Challenge、放松、朋友），哪组都能用。' }));
  kids.push(el('div', { class: 'card outline' }, [el('div', { class: 'outline-title', text: n.label }), renderTree(n.nodes)]));
  box.replaceChildren(...kids);
  setFold(notesView.fold);
  window.scrollTo({ top: 0 });
}

// ---------- tabs ----------
let current = null;
function switchTab(id) {
  current = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + id));
  ['repeat', 'interview', 'recite'].forEach(t => { $('#bar-' + t).hidden = t !== id; });
  if (SEC[id]) refresh(id);
  else if (!notesView.cur) openNote(pref('note', 'group-1'));
  setPref('tab', id);
}
document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { switchTab(b.dataset.tab); window.scrollTo({ top: 0 }); });
const backTop = $('#backTop');
backTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
window.addEventListener('scroll', () => { backTop.hidden = window.scrollY < 600; }, { passive: true });
switchTab(['repeat', 'recite', 'interview'].includes(pref('tab')) ? pref('tab') : 'repeat');
Player.paint();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
