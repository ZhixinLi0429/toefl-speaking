p3.webp"}, {"en": "Visit the cafe for tasty refreshments during your tour.", "zh": "游览期间可以去咖啡馆品尝美味的点心。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0406b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406b-repeat-p4.webp"}, {"en": "The gift shop sells unique souvenirs at affordable prices.", "zh": "礼品店出售价格实惠的独特纪念品。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0406b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406b-repeat-p5.webp"}, {"en": "Guided tours are only available by reservation each weekend.", "zh": "导览仅在每个周末通过预约提供。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0406b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406b-repeat-p6.webp"}, {"en": "If you are interested in special events, check the map for more details.", "zh": "如果您对特别活动感兴趣，请查看地图获取更多详情。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0406b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0406b-repeat-p7.webp"}]}, {"id": "mock-33", "n": 33, "en": "Pet Store", "zh": "宠物店", "scenario": "You are working a part-time job at a pet store near campus. Your manager is training you to assist customers at the store. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [2], "items": [{"en": "We sell food for all types of animals.", "zh": "我们为所有类型的动物出售食品。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0407-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0407-repeat-p1.webp"}, {"en": "Our toy section offers fun items to play with.", "zh": "我们的玩具区提供有趣的可玩物品。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0407-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0407-repeat-p2.webp"}, {"en": "Grooming supplies include shampoos, brushes, and nail clippers.", "zh": "美容用品包括洗发水、梳子和指甲剪。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0407-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0407-repeat-p3.webp"}, {"en": "There are habitats for fish, reptiles, and many other pets.", "zh": "这里有鱼类、爬行动物和许多其他宠物的栖息地。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0407-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0407-repeat-p4.webp"}, {"en": "The checkout is conveniently located near the store exit.", "zh": "收银台位置便利，靠近商店出口。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0407-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0407-repeat-p5.webp"}, {"en": "Ask any associate for assistance with locating our fine products.", "zh": "如需协助寻找我们优质的产品，请咨询任何店员。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0407-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0407-repeat-p6.webp"}, {"en": "As always, visit our store website for a list of specific products and sections.", "zh": "一如既往，请访问我们的商店网站以获取具体产品和区域的列表。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0407-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0407-repeat-p7.webp"}]}, {"id": "mock-34", "n": 34, "en": "Computer Lab", "zh": "计算机实验室", "scenario": "You are working at a university's computer lab. Your manager is training you to assist new students. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [1], "items": [{"en": "The computer stations are ready for students.", "zh": "电脑工位已为学生准备就绪。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0408-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0408-repeat-p1.webp"}, {"en": "This printer can print and scan student documents.", "zh": "这台打印机可以打印和扫描学生文件。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0408-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0408-repeat-p2.webp"}, {"en": "Extra paper is stored beside the printer for quick refills.", "zh": "备用纸张存放在打印机旁，以便快速补充。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0408-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0408-repeat-p3.webp"}, {"en": "The help box contains guides for solving common technical problems.", "zh": "帮助箱内有解决常见技术问题的指南。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0408-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0408-repeat-p4.webp"}, {"en": "Check the wireless router if the Wi-Fi connection becomes unstable.", "zh": "如果Wi-Fi连接不稳定，请检查无线路由器。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0408-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0408-repeat-p5.webp"}, {"en": "Remind students to save important files during long computer sessions so nothing is lost.", "zh": "提醒学生在长时间使用电脑时保存重要文件，以防丢失。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0408-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0408-repeat-p6.webp"}, {"en": "Students can use the calendar tool to check lab hours and upcoming equipment reservation times.", "zh": "学生可以使用日历工具查看实验室开放时间和即将到来的设备预约时段。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0408-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0408-repeat-p7.webp"}]}, {"id": "mock-35", "n": 35, "en": "City Information Booth", "zh": "城市信息亭", "scenario": "You are working an off-campus job at a city information booth. Your manager is teaching you how to provide information for tourists. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [4], "items": [{"en": "The museum contains some famous art.", "zh": "这座博物馆收藏了一些著名的艺术品。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0412-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0412-repeat-p1.webp"}, {"en": "The park is ideal for family picnics.", "zh": "这个公园是家庭野餐的理想场所。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0412-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0412-repeat-p2.webp"}, {"en": "The historical site offers free daily guided tours.", "zh": "这个历史遗迹提供免费的每日导览。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0412-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0412-repeat-p3.webp"}, {"en": "Explore the shopping district for unique stores and cafes.", "zh": "探索购物区，寻找独特的商店和咖啡馆。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0412-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0412-repeat-p4.webp"}, {"en": "The theater hosts live performances every weekend.", "zh": "这家剧院每个周末都举办现场表演。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0412-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0412-repeat-p5.webp"}, {"en": "Tourist maps and brochures are available for purchase at the information booth.", "zh": "游客地图和手册可以在问讯处购买。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0412-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0412-repeat-p6.webp"}, {"en": "If you need help, check the map for directions and travel options to other locations.", "zh": "如果您需要帮助，请查阅地图了解前往其他地点的方向和交通方式。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0412-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0412-repeat-p7.webp"}]}, {"id": "mock-36", "n": 36, "en": "Community Garden", "zh": "社区花园", "scenario": "You are volunteering at a community garden for academic credit. One of the leaders is training you how to show new members how to care for the garden. Listen to the leader and repeat what the leader says. Repeat only once.", "cats": [0], "items": [{"en": "Protect your hands while working in the garden.", "zh": "在花园工作时，请保护你的双手。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0414a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0414a-repeat-p1.webp"}, {"en": "Put tools away after using them.", "zh": "使用工具后，请将其收好。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0414a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0414a-repeat-p2.webp"}, {"en": "Follow the posted rules so everyone can stay safe.", "zh": "请遵守张贴的规则，以便大家都能保持安全。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0414a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0414a-repeat-p3.webp"}, {"en": "Use safe lifting methods whenever you move large garden items.", "zh": "移动大型园艺物品时，请使用安全的搬运方法。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0414a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0414a-repeat-p4.webp"}, {"en": "Put yard scraps in the compost pile to maintain a tidy garden.", "zh": "将庭院杂物放入堆肥堆，以保持花园整洁。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0414a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0414a-repeat-p5.webp"}, {"en": "After watering the plants, store the hose properly so no one will trip on it.", "zh": "浇完植物后，请妥善存放水管，以免有人绊倒。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0414a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0414a-repeat-p6.webp"}, {"en": "During hot weather, drink water because hydration is important for good health.", "zh": "天气炎热时，请多喝水，因为补充水分对健康很重要。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0414a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0414a-repeat-p7.webp"}]}, {"id": "mock-37", "n": 37, "en": "Sewing a Button", "zh": "缝纽扣", "scenario": "You are volunteering at the local community center near campus. One of the leaders is showing you how to teach children to sew a button onto fabric. Listen to the leader and repeat what the leader says. Repeat only once.", "cats": [0], "items": [{"en": "First, thread the needle before you start.", "zh": "首先，在你开始之前穿好针。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0415a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0415a-repeat-p1.webp"}, {"en": "Next, position the button carefully on the fabric.", "zh": "接着，小心地将纽扣放在布料上。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0415a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0415a-repeat-p2.webp"}, {"en": "Hold the fabric steady while you push the needle through.", "zh": "当你把针推过去时，要稳稳地按住布料。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0415a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0415a-repeat-p3.webp"}, {"en": "Sew through each buttonhole several times to keep it secure.", "zh": "在每个扣眼上缝几针，以确保纽扣牢固。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0415a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0415a-repeat-p4.webp"}, {"en": "Pull enough thread from the spool to sew the button securely.", "zh": "从线轴上拉出足够的线，以便能牢固地缝上纽扣。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0415a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0415a-repeat-p5.webp"}, {"en": "Cut away the extra thread with scissors after the final knot has been tied.", "zh": "在打好最后的结后，用剪刀剪掉多余的线。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0415a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0415a-repeat-p6.webp"}, {"en": "Use a thimble to protect your finger while you practice sewing the button in class.", "zh": "在课堂上练习缝纽扣时，使用顶针来保护你的手指。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0415a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260504/piece-0415a-repeat-p7.webp"}]}, {"id": "mock-38", "n": 38, "en": "Travel Agency", "zh": "旅行社", "scenario": "You are working at a travel agency as part of an internship. Your manager is teaching you how to assist customers with booking vacation packages. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [4], "items": [{"en": "Start with the customer's travel dates.", "zh": "从客户的旅行日期开始。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0415b-repeat-travel-agency-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0415b-repeat-travel-agency-q1.webp"}, {"en": "Suggest flights that match their traveling times.", "zh": "推荐符合他们行程时间的航班。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0415b-repeat-travel-agency-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0415b-repeat-travel-agency-q2.webp"}, {"en": "Propose lodgings that fit their budget and are close to attractions.", "zh": "推荐符合预算且靠近景点的住宿。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0415b-repeat-travel-agency-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0415b-repeat-travel-agency-q3.webp"}, {"en": "Offer travel insurance options to give clients peace of mind.", "zh": "提供旅行保险选项，让客户安心。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0415b-repeat-travel-agency-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0415b-repeat-travel-agency-q4.webp"}, {"en": "Recommend guided tours that highlight the local culture.", "zh": "推荐突出当地文化的导览游。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0415b-repeat-travel-agency-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0415b-repeat-travel-agency-q5.webp"}, {"en": "Before booking the reservation, go over the details with the client.", "zh": "在预订前，与客户核对细节。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0415b-repeat-travel-agency-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0415b-repeat-travel-agency-q6.webp"}, {"en": "When customers are ready to pay, process the payment to confirm their booking.", "zh": "当客户准备好付款时，处理付款以确认他们的预订。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0415b-repeat-travel-agency-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0415b-repeat-travel-agency-q7.webp"}]}, {"id": "mock-39", "n": 39, "en": "Library Online Resources", "zh": "图书馆在线资源", "scenario": "You are working at a university library. Your manager is training you to help students use the university's online resources. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [5], "items": [{"en": "Use keywords when you look for any books.", "zh": "查找任何书籍时，请使用关键词。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0420b-repeat-online-library-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0420b-repeat-online-library-q1.webp"}, {"en": "Download materials to read offline.", "zh": "下载资料以便离线阅读。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0420b-repeat-online-library-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0420b-repeat-online-library-q2.webp"}, {"en": "There are digital textbooks available to borrow.", "zh": "有数字教科书可供借阅。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0420b-repeat-online-library-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0420b-repeat-online-library-q3.webp"}, {"en": "Access scholarly articles through the research database.", "zh": "通过研究数据库访问学术文章。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0420b-repeat-online-library-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0420b-repeat-online-library-q4.webp"}, {"en": "Use citation tools to format your references correctly.", "zh": "使用引文工具来正确格式化您的参考文献。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0420b-repeat-online-library-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0420b-repeat-online-library-q5.webp"}, {"en": "Contact a librarian through the chat for any help you need.", "zh": "通过聊天功能联系图书管理员以获取任何所需帮助。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0420b-repeat-online-library-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0420b-repeat-online-library-q6.webp"}, {"en": "For the smoothest access, make sure your internet connection is fully stable.", "zh": "为确保访问顺畅，请确保您的网络连接完全稳定。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0420b-repeat-online-library-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0420b-repeat-online-library-q7.webp"}]}, {"id": "mock-40", "n": 40, "en": "Science Project Presentations", "zh": "科学项目展示", "scenario": "You are working at a school as part of an internship. Your supervisor is training you to help students prepare for their science project presentations. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [1], "items": [{"en": "Start by setting up the projector screen.", "zh": "首先设置投影仪屏幕。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0421-repeat-science-presentations-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0421-repeat-science-presentations-q1.webp"}, {"en": "Use the whiteboard to highlight key points.", "zh": "使用白板来强调要点。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0421-repeat-science-presentations-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0421-repeat-science-presentations-q2.webp"}, {"en": "Arrange your project materials neatly on the tables.", "zh": "将你的项目材料整齐地摆放在桌子上。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0421-repeat-science-presentations-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0421-repeat-science-presentations-q3.webp"}, {"en": "Check all the equipment to ensure it works properly.", "zh": "检查所有设备以确保其正常工作。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0421-repeat-science-presentations-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0421-repeat-science-presentations-q4.webp"}, {"en": "Make sure your computer is set up with your presentation.", "zh": "确保你的电脑已设置好演示文稿。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0421-repeat-science-presentations-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0421-repeat-science-presentations-q5.webp"}, {"en": "It's a good idea to practice delivering your speech in front of some friends.", "zh": "在朋友面前练习演讲是个好主意。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0421-repeat-science-presentations-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0421-repeat-science-presentations-q6.webp"}, {"en": "Take time to review your notes thoroughly, so you'll feel confident and prepared.", "zh": "花时间彻底复习笔记，这样你会感到自信和准备充分。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0421-repeat-science-presentations-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0421-repeat-science-presentations-q7.webp"}]}, {"id": "mock-41", "n": 41, "en": "Library Materials Handling", "zh": "图书馆资料管理", "scenario": "You are working in your university's library. Your manager is training you to help other student-workers handle sensitive library materials. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [5], "items": [{"en": "Store documents to prevent damage.", "zh": "保存文件以防止损坏。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0427a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260427/piece-0427a-repeat-q1.webp"}, {"en": "Temperature controls help protect papers.", "zh": "温度控制有助于保护文件。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0427a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260427/piece-0427a-repeat-q2.webp"}, {"en": "Use the catalogue system to organize records expertly.", "zh": "使用目录系统专业地组织记录。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0427a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260427/piece-0427a-repeat-q3.webp"}, {"en": "Carefully use restoration tools to repair damaged items.", "zh": "小心使用修复工具来修复损坏的物品。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0427a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260427/piece-0427a-repeat-q4.webp"}, {"en": "We provide a quiet reading area for researchers.", "zh": "我们为研究人员提供一个安静的阅读区域。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0427a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260427/piece-0427a-repeat-q5.webp"}, {"en": "Security cameras are used to monitor sensitive material.", "zh": "使用安全摄像头来监控敏感材料。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0427a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260427/piece-0427a-repeat-q6.webp"}, {"en": "If long-term storage is needed, use the special storage boxes over here.", "zh": "如果需要长期存储，请使用这边的专用存储盒。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0427a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260427/piece-0427a-repeat-q7.webp"}]}, {"id": "mock-42", "n": 42, "en": "National Park", "zh": "国家公园", "scenario": "You are working at a national park as part of an internship. Your manager is teaching you how to assist visitors at the park. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [7], "items": [{"en": "Our hiking trails offer scenic routes.", "zh": "我们的远足小径提供风景优美的路线。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0427-repeat-national-park-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0427-repeat-national-park-q1.webp"}, {"en": "Make a stop at the Visitor Center.", "zh": "请在游客中心停留一下。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0427-repeat-national-park-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0427-repeat-national-park-q2.webp"}, {"en": "Many outdoor campsites are available for overnight stays.", "zh": "许多户外露营地可供过夜使用。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0427-repeat-national-park-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0427-repeat-national-park-q3.webp"}, {"en": "Picnic areas are great for family gatherings.", "zh": "野餐区非常适合家庭聚会。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0427-repeat-national-park-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0427-repeat-national-park-q4.webp"}, {"en": "Wildlife viewing spots are ideal for observing animals.", "zh": "野生动物观赏点是观察动物的理想场所。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0427-repeat-national-park-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0427-repeat-national-park-q5.webp"}, {"en": "Guided tours and educational programs are available by request.", "zh": "导游讲解和教育项目可根据要求提供。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0427-repeat-national-park-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0427-repeat-national-park-q6.webp"}, {"en": "As always, be sure to take the map with you on your nature walks and adventures.", "zh": "一如既往，请务必在自然漫步和冒险中随身携带地图。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0427-repeat-national-park-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0427-repeat-national-park-q7.webp"}]}, {"id": "mock-43", "n": 43, "en": "Campus Coffee Shop", "zh": "校园咖啡店", "scenario": "You are being trained to assist in a campus coffee shop. Your supervisor will teach you how to explain key features of the coffee shop to customers. Listen to your supervisor and repeat what the supervisor says. Repeat only once.", "cats": [2], "items": [{"en": "We serve coffee and tea at the main counter.", "zh": "我们在主柜台提供咖啡和茶。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0429-repeat-campus-coffee-shop-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0429-repeat-campus-coffee-shop-q1.webp"}, {"en": "Our pastries are all made fresh daily.", "zh": "我们的糕点都是每天新鲜制作的。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0429-repeat-campus-coffee-shop-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0429-repeat-campus-coffee-shop-q2.webp"}, {"en": "The menu board lists drinks that include a range of herbal teas.", "zh": "菜单板上列有多种饮品，其中包括一系列花草茶。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0429-repeat-campus-coffee-shop-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0429-repeat-campus-coffee-shop-q3.webp"}, {"en": "Milk, cream, and sugar are available at the station.", "zh": "牛奶、奶油和糖在自助台供应。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0429-repeat-campus-coffee-shop-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0429-repeat-campus-coffee-shop-q4.webp"}, {"en": "Dispose of trash and recyclables in the bins near the door.", "zh": "请将垃圾和可回收物丢弃在门旁的垃圾桶里。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0429-repeat-campus-coffee-shop-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0429-repeat-campus-coffee-shop-q5.webp"}, {"en": "Some tables in the seating area offer excellent views of campus.", "zh": "座位区的一些桌子可以欣赏到校园的绝佳景色。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0429-repeat-campus-coffee-shop-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0429-repeat-campus-coffee-shop-q6.webp"}, {"en": "Free Wi-Fi is available for campus visitors as well as students.", "zh": "免费Wi-Fi可供校园访客和学生使用。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0429-repeat-campus-coffee-shop-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260513/piece-0429-repeat-campus-coffee-shop-q7.webp"}]}, {"id": "mock-44", "n": 44, "en": "Rock-Climbing Gym", "zh": "攀岩健身房", "scenario": "You are working in a rock-climbing gym at a university. Your manager is teaching you how to assist visitors at the gym. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [6], "items": [{"en": "You can rent climbing shoes at the front desk.", "zh": "你可以在前台租赁攀岩鞋。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0505b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260522/piece-0505b-repeat-q1.webp"}, {"en": "Always wear a helmet when in the gym.", "zh": "在攀岩馆内请始终佩戴头盔。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0505b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260522/piece-0505b-repeat-q2.webp"}, {"en": "The shorter walls can be used without ropes or a harness.", "zh": "较矮的岩壁可以在不使用绳索或安全带的情况下使用。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0505b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260522/piece-0505b-repeat-q3.webp"}, {"en": "Just follow the colored marks to stay on the same climbing path.", "zh": "只需跟随彩色标记，即可保持在同一条攀岩路线上。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0505b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260522/piece-0505b-repeat-q4.webp"}, {"en": "Also, make sure to check out our special strength training zone.", "zh": "另外，请务必去看看我们特别的力量训练区。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0505b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260522/piece-0505b-repeat-q5.webp"}, {"en": "Use the hang and chin-up bars to increase the power of your upper body.", "zh": "使用悬挂杆和引体向上杠来增强你的上半身力量。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0505b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260522/piece-0505b-repeat-q6.webp"}, {"en": "If you need help, trained instructors are always nearby to guide and advise you.", "zh": "如果您需要帮助，训练有素的教练总会在附近为您提供指导和建议。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0505b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260522/piece-0505b-repeat-q7.webp"}]}, {"id": "mock-45", "n": 45, "en": "Media Production Studio", "zh": "媒体制作工作室", "scenario": "You work at a university's media production studio. Your supervisor is training you to teach new employees how to use the equipment. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [1], "items": [{"en": "Set the camera to record video.", "zh": "将相机设置为录制视频。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0505-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0505-repeat-q1.webp"}, {"en": "The lighting rig eliminates shadows.", "zh": "灯光设备消除了阴影。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0505-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0505-repeat-q2.webp"}, {"en": "Position the microphone for clear audio capture.", "zh": "调整麦克风位置以确保清晰录音。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0505-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0505-repeat-q3.webp"}, {"en": "Edit your photos easily using the latest software.", "zh": "使用最新软件轻松编辑你的照片。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0505-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0505-repeat-q4.webp"}, {"en": "The green screen can help you create any background you want.", "zh": "绿幕可以帮助你创建任何你想要的背景。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0505-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0505-repeat-q5.webp"}, {"en": "The master control panel is used to manage all studio equipment.", "zh": "主控制面板用于管理所有演播室设备。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0505-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0505-repeat-q6.webp"}, {"en": "If you need to record with no outside noise, you should use the soundproof room.", "zh": "如果你需要在没有外部噪音的情况下录音，应该使用隔音室。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0505-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0505-repeat-q7.webp"}]}, {"id": "mock-46", "n": 46, "en": "Flower Shop", "zh": "花店", "scenario": "You are volunteering at a flower shop near campus. The leader is training you to guide participants in arranging flowers. Listen to the leader and repeat what the leader says. Repeat only once.", "cats": [0], "items": [{"en": "Cut stems at an angle using shears.", "zh": "用剪刀以一定角度剪切茎部。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0510-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0510-repeat-q1.webp"}, {"en": "Place pebbles in the bottom of the vase for support.", "zh": "在花瓶底部放置鹅卵石以提供支撑。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0510-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0510-repeat-q2.webp"}, {"en": "Begin by placing the taller flowers in the center.", "zh": "首先将较高的花放在中心位置。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0510-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0510-repeat-q3.webp"}, {"en": "Fill gaps with smaller flowers to maintain the visual balance.", "zh": "用较小的花填充空隙以保持视觉平衡。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0510-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0510-repeat-q4.webp"}, {"en": "Add some greenery to enhance the overall fullness.", "zh": "添加一些绿植以增强整体的饱满感。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0510-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0510-repeat-q5.webp"}, {"en": "You need to change the water regularly to keep everything looking fresh.", "zh": "你需要定期换水，以保持一切看起来新鲜。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0510-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0510-repeat-q6.webp"}, {"en": "Once you are happy with your arrangement, decorate it with a pretty ribbon.", "zh": "当你对插花感到满意后，用一条漂亮的丝带装饰它。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0510-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0510-repeat-q7.webp"}]}, {"id": "mock-47", "n": 47, "en": "Wall Painting Workshop", "zh": "墙面涂刷工坊", "scenario": "You are being trained to guide learners in a workshop to learn how to paint walls. Listen to your trainer and repeat what the trainer says. Repeat only once.", "cats": [0], "items": [{"en": "Use a drop cloth on the floor to prevent stains.", "zh": "在地板上铺一块防污布，以防止弄脏。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0511-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0511-repeat-q1.webp"}, {"en": "Apply painter's tape to edges for clean lines.", "zh": "在边缘贴上美纹纸胶带，以获得清晰的线条。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0511-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0511-repeat-q2.webp"}, {"en": "Pour the paint directly into the tray for easy access.", "zh": "直接将油漆倒入漆盘中，方便取用。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0511-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0511-repeat-q3.webp"}, {"en": "Use a roller for even coverage on large areas.", "zh": "使用滚筒，以便在大面积区域获得均匀的覆盖。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0511-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0511-repeat-q4.webp"}, {"en": "Start painting at the top of the wall and work steadily downward.", "zh": "从墙壁顶部开始粉刷，并稳步向下进行。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0511-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0511-repeat-q5.webp"}, {"en": "You might need to use an extension ladder to reach very high spots and corners.", "zh": "你可能需要使用伸缩梯来触及非常高的位置和角落。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0511-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0511-repeat-q6.webp"}, {"en": "For the best results, remember to remove the tape before the paint fully dries.", "zh": "为了获得最佳效果，请记得在油漆完全干透之前撕掉胶带。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0511-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0511-repeat-q7.webp"}]}, {"id": "mock-48", "n": 48, "en": "Recycling Procedures", "zh": "回收程序", "scenario": "You are being trained to teach recycling procedures to students on campus. Listen to your trainer and repeat what the trainer says. Repeat only once.", "cats": [0], "items": [{"en": "Put all paper items into the blue bin.", "zh": "请将所有纸质物品投入蓝色垃圾桶。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0516-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0516-repeat-q1.webp"}, {"en": "Glass bottles belong in the green container.", "zh": "玻璃瓶应放入绿色垃圾桶。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0516-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0516-repeat-q2.webp"}, {"en": "The yellow receptacle is only for plastic bottles.", "zh": "黄色垃圾桶仅用于塑料瓶。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0516-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0516-repeat-q3.webp"}, {"en": "Non-recyclable materials must go into the trash.", "zh": "不可回收物品必须放入垃圾桶。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0516-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0516-repeat-q4.webp"}, {"en": "Compost leftover food to help reduce waste in landfills.", "zh": "将剩余食物进行堆肥处理，以减少垃圾填埋场的废物。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0516-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0516-repeat-q5.webp"}, {"en": "Always read the posted signs to make sure you sort all items correctly.", "zh": "务必阅读张贴的标识，确保您正确分类所有物品。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0516-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0516-repeat-q6.webp"}, {"en": "You can download our app for updates on policy and procedure changes.", "zh": "您可以下载我们的应用程序，获取政策和程序变更的更新信息。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0516-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260519/piece-0516-repeat-q7.webp"}]}, {"id": "mock-49", "n": 49, "en": "Clay Bowl Making", "zh": "陶碗制作", "scenario": "You are an art student assisting your professor in a community arts program. Your professor is showing you how to teach children to make a clay bowl. Listen to your professor and repeat what your professor says. Repeat only once.", "cats": [0], "items": [{"en": "First, wet your hands to keep the clay moist.", "zh": "首先，打湿双手以保持粘土湿润。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0520a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260520/piece-0520a-repeat-q1.webp"}, {"en": "You will be using the center of the wheel.", "zh": "你将使用转盘的中心部分。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0520a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260520/piece-0520a-repeat-q2.webp"}, {"en": "Use your thumbs to gently open the clay in the middle.", "zh": "用拇指轻轻将中间的粘土打开。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0520a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260520/piece-0520a-repeat-q3.webp"}, {"en": "Smooth the surface every 30 minutes with a damp sponge.", "zh": "每30分钟用湿海绵抹平一次表面。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0520a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260520/piece-0520a-repeat-q4.webp"}, {"en": "Remove any excess clay to give the bowl a clean shape.", "zh": "去除多余的粘土，使碗的形状更整洁。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0520a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260520/piece-0520a-repeat-q5.webp"}, {"en": "Once everything looks good, let the finished piece dry on a rack for a full day.", "zh": "一旦一切看起来都很好，将完成的作品放在架子上晾干一整天。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0520a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260520/piece-0520a-repeat-q6.webp"}, {"en": "Remember that practice is key to mastering pottery, so keep at it.", "zh": "记住，练习是掌握陶艺的关键，所以要坚持下去。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0520a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260520/piece-0520a-repeat-q7.webp"}]}, {"id": "mock-50", "n": 50, "en": "University Art Gallery", "zh": "大学美术馆", "scenario": "You are being trained to assist visitors at a university art gallery. Listen to the guide and repeat what the guide says. Repeat only once.", "cats": [8], "items": [{"en": "Sculptures are located in the central hall.", "zh": "雕塑位于中央大厅。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0523c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260523/piece-0523c-repeat-q1.webp"}, {"en": "We highlight paintings from local artists.", "zh": "我们重点展示当地艺术家的画作。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0523c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260523/piece-0523c-repeat-q2.webp"}, {"en": "Visitors can use the touch screen display to plan their day.", "zh": "游客可以使用触摸屏显示器来规划他们的一天。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0523c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260523/piece-0523c-repeat-q3.webp"}, {"en": "Brochures about new exhibits are available free of charge.", "zh": "关于新展览的小册子可以免费获取。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0523c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260523/piece-0523c-repeat-q4.webp"}, {"en": "You can book tickets online, or purchase tickets at the entrance desk.", "zh": "您可以在网上订票，也可以在入口处的售票台购买门票。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0523c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260523/piece-0523c-repeat-q5.webp"}, {"en": "For additional information, read the wall labels next to each piece of art.", "zh": "要获取更多信息，请阅读每件艺术品旁边的墙面标签。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0523c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260523/piece-0523c-repeat-q6.webp"}, {"en": "Use the audio device to hear an expert talk about our collections.", "zh": "使用音频设备来听专家讲解我们的藏品。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0523c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260523/piece-0523c-repeat-q7.webp"}]}, {"id": "mock-51", "n": 51, "en": "Fitness Center", "zh": "健身中心", "scenario": "You are working at your university's fitness center. Your manager is training you to assist customers at the center. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [6], "items": [{"en": "Cardio machines and bikes are over here.", "zh": "有氧训练器械和自行车在这边。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0420c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260420/piece-0420c-repeat-q1.webp"}, {"en": "The weight room provides dumbbells and benches.", "zh": "力量训练室配有哑铃和训练凳。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0420c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260420/piece-0420c-repeat-q2.webp"}, {"en": "Our yoga studio offers classes for all fitness levels.", "zh": "我们的瑜伽教室为各种健身水平的人提供课程。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0420c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260420/piece-0420c-repeat-q3.webp"}, {"en": "Locker rooms contain storage bins and changing facilities.", "zh": "更衣室内设有储物柜和更衣设施。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0420c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260420/piece-0420c-repeat-q4.webp"}, {"en": "Enjoy our smoothie bar and sample nutritious drinks and snacks.", "zh": "欢迎享用我们的奶昔吧，并品尝营养饮品和小吃。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0420c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260420/piece-0420c-repeat-q5.webp"}, {"en": "Personal trainers are available for individual guidance.", "zh": "我们提供私人教练进行一对一指导。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0420c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260420/piece-0420c-repeat-q6.webp"}, {"en": "Before you leave, check the gym floor plan for specific areas and equipment.", "zh": "离开前，请查看健身房平面图，了解各区域和器械的位置。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0420c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260420/piece-0420c-repeat-q7.webp"}]}, {"id": "mock-52", "n": 52, "en": "University Bookstore", "zh": "大学书店", "scenario": "You are working at your university's bookstore. Your supervisor is training you to assist customers in the bookstore. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [2], "items": [{"en": "All our books are located on these shelves.", "zh": "我们所有的书都放在这些书架上。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0601c-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260601/piece-0601c-repeat-q1.webp"}, {"en": "Bring your purchases to the cash register.", "zh": "请将您购买的物品拿到收银台。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0601c-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260601/piece-0601c-repeat-q2.webp"}, {"en": "Use the inventory to search for available items.", "zh": "使用库存清单来查找可用物品。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0601c-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260601/piece-0601c-repeat-q3.webp"}, {"en": "Our staff provides a monthly list of recommendations.", "zh": "我们的员工每月提供一份推荐清单。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0601c-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260601/piece-0601c-repeat-q4.webp"}, {"en": "Information about membership benefits is displayed here.", "zh": "会员福利信息展示在这里。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0601c-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260601/piece-0601c-repeat-q5.webp"}, {"en": "We have many interesting store events that we recommend you attend.", "zh": "我们有许多有趣的店铺活动，我们推荐您参加。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0601c-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260601/piece-0601c-repeat-q6.webp"}, {"en": "We value customer feedback, so please consider leaving a store review.", "zh": "我们重视顾客反馈，请考虑留下店铺评价。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0601c-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260601/piece-0601c-repeat-q7.webp"}]}, {"id": "mock-53", "n": 53, "en": "Children's Art Studio", "zh": "儿童美术工作室", "scenario": "You are working as an assistant art teacher at a children's art studio during a summer program. Your supervisor is teaching you how to guide schoolchildren in watercolor painting activities. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [0], "items": [{"en": "First, help the children wet their paper with a clean brush.", "zh": "首先，帮助孩子们用干净的画笔将纸弄湿。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0606-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260606/piece-0606-repeat-q1.webp"}, {"en": "Dip the brush into water, then gently load it with color.", "zh": "将画笔浸入水中，然后轻轻地蘸取颜料。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0606-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260606/piece-0606-repeat-q2.webp"}, {"en": "For the sky, use long horizontal strokes across the damp paper.", "zh": "画天空时，用长的水平笔触在湿润的纸上绘制。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0606-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260606/piece-0606-repeat-q3.webp"}, {"en": "If the paint looks too dark, have them rinse the brush and try again.", "zh": "如果颜料看起来太深，让他们清洗画笔并重试。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0606-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260606/piece-0606-repeat-q4.webp"}, {"en": "Demonstrate how to clean the brush before switching to a different color.", "zh": "演示如何在换用不同颜色之前清洗画笔。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0606-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260606/piece-0606-repeat-q5.webp"}, {"en": "Encourage them to experiment, because watercolor is very forgiving and mistakes often become happy accidents.", "zh": "鼓励他们尝试，因为水彩画很宽容，错误常常会变成意外的惊喜。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0606-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260606/piece-0606-repeat-q6.webp"}, {"en": "Once the first layer is completely dry, they can add details using a smaller brush and a technique called dry brush.", "zh": "第一层颜料完全干透后，他们可以用更小的画笔和一种叫做干刷的技术添加细节。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0606-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260606/piece-0606-repeat-q7.webp"}]}, {"id": "mock-54", "n": 54, "en": "Campus Career Fair", "zh": "校园招聘会", "scenario": "You are volunteering at a campus career fair. Listen to the coordinator and repeat what the coordinator says. Repeat only once.", "cats": [3], "items": [{"en": "Be sure to sign in when you first arrive.", "zh": "请务必在初次到达时签到。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0614a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260614/piece-0614a-repeat-q1.webp"}, {"en": "Free refreshments are available all day.", "zh": "全天供应免费茶点。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0614a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260614/piece-0614a-repeat-q2.webp"}, {"en": "When you check in, pick up a printed schedule and a site map.", "zh": "您签到时，请领取一份打印的日程表和场地地图。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0614a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260614/piece-0614a-repeat-q3.webp"}, {"en": "We'll be hosting presentations on resume writing at noon.", "zh": "我们将在中午举办简历撰写讲座。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0614a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260614/piece-0614a-repeat-q4.webp"}, {"en": "If attendees need a quiet meeting area, it's upstairs.", "zh": "如果与会者需要安静的会议区，请上楼。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0614a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260614/piece-0614a-repeat-q5.webp"}, {"en": "Computers are available to connect with company representatives.", "zh": "我们提供电脑，方便您与公司代表联系。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0614a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260614/piece-0614a-repeat-q6.webp"}, {"en": "You should monitor your email closely for messages from employers.", "zh": "您应密切关注邮箱，查看雇主发来的信息。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0614a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260614/piece-0614a-repeat-q7.webp"}]}, {"id": "mock-55", "n": 55, "en": "Coffee Shop (Latte Making)", "zh": "咖啡店（拿铁制作）", "scenario": "You work as a barista at your university's coffee shop. Your manager is training you to teach new staff how to make a latte. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [0], "items": [{"en": "Pull a shot of espresso using the machine.", "zh": "用机器萃取一份浓缩咖啡。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0616b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260616/piece-0616b-repeat-q1.webp"}, {"en": "Steam the milk until it is hot and frothy.", "zh": "将牛奶蒸至温热且起泡。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0616b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260616/piece-0616b-repeat-q2.webp"}, {"en": "Pour the espresso into an appropriately sized cup.", "zh": "将浓缩咖啡倒入大小合适的杯子中。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0616b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260616/piece-0616b-repeat-q3.webp"}, {"en": "Slowly add the steamed milk until the cup is about halfway full.", "zh": "慢慢加入蒸好的牛奶，直到杯子大约半满。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0616b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260616/piece-0616b-repeat-q4.webp"}, {"en": "Use a spoon to create latte art, if you know how.", "zh": "如果你会的话，用勺子制作拉花。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0616b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260616/piece-0616b-repeat-q5.webp"}, {"en": "Ask the customer if they want sugar or honey before adding anything.", "zh": "在添加任何东西之前，先问顾客是否需要糖或蜂蜜。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0616b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260616/piece-0616b-repeat-q6.webp"}, {"en": "Before serving, place a small piece of chocolate on the saucer next to the cup.", "zh": "上桌前，在杯子旁边的茶碟上放一小块巧克力。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0616b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260616/piece-0616b-repeat-q7.webp"}]}, {"id": "mock-56", "n": 56, "en": "Community Garden", "zh": "社区花园", "scenario": "You are volunteering at a community garden. Listen to the coordinator and repeat what the coordinator says. Repeat only once.", "cats": [0], "items": [{"en": "The greenhouse is where we grow seedlings.", "zh": "温室是培育幼苗的地方。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0627-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260627/piece-0627-repeat-q1.webp"}, {"en": "Please place all food scraps in the compost bin.", "zh": "请将所有食物残渣放入堆肥箱。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0627-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260627/piece-0627-repeat-q2.webp"}, {"en": "Gardening tools like shovels and gloves can be found in the shed.", "zh": "铲子、手套等园艺工具可以在工具棚里找到。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0627-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260627/piece-0627-repeat-q3.webp"}, {"en": "The raised beds need to be weeded and watered regularly.", "zh": "抬高的种植床需要定期除草和浇水。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0627-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260627/piece-0627-repeat-q4.webp"}, {"en": "You can use the hose for filling buckets to water the plants.", "zh": "你可以用水管接水来给植物浇水。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0627-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260627/piece-0627-repeat-q5.webp"}, {"en": "When helping visitors, make sure they follow the posted regulations.", "zh": "在帮助访客时，确保他们遵守张贴的规定。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0627-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260627/piece-0627-repeat-q6.webp"}, {"en": "To protect the environment, avoid using synthetic chemicals on plants.", "zh": "为了保护环境，避免在植物上使用合成化学品。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0627-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260627/piece-0627-repeat-q7.webp"}]}, {"id": "mock-57", "n": 57, "en": "Online Course Website", "zh": "在线课程网站", "scenario": "You are taking an online class at your university. Your instructor is explaining how to use the course website. Listen to the instructor and repeat what the instructor says. Repeat only once.", "cats": [1], "items": [{"en": "Class details are on the course homepage.", "zh": "课程详情在课程主页上。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0708a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708a-repeat-q1.webp"}, {"en": "Use the forum to exchange thoughts with classmates.", "zh": "使用论坛与同学交流想法。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0708a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708a-repeat-q2.webp"}, {"en": "Upload assignments to the platform for evaluation.", "zh": "将作业上传到平台进行评估。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0708a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708a-repeat-q3.webp"}, {"en": "The video lectures will help you learn the material.", "zh": "视频讲座将帮助你学习材料。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0708a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708a-repeat-q4.webp"}, {"en": "The online grade book shows your scores for all class assignments.", "zh": "在线成绩册显示你所有课堂作业的分数。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0708a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708a-repeat-q5.webp"}, {"en": "Turn on notifications so you never miss messages from your instructors.", "zh": "开启通知，这样你永远不会错过讲师的信息。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0708a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708a-repeat-q6.webp"}, {"en": "If you face technical issues, contact support to resolve the problem.", "zh": "如果你遇到技术问题，请联系支持以解决问题。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0708a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708a-repeat-q7.webp"}]}, {"id": "mock-58", "n": 58, "en": "Grocery Store", "zh": "杂货店", "scenario": "You are working a part-time job at a grocery store near campus. Your manager is training you to assist customers at the store. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [2], "items": [{"en": "Produce is located near the entrance.", "zh": "农产品区位于入口附近。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0708b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708b-repeat-q1.webp"}, {"en": "Dairy products include milk, cheese, and yogurt.", "zh": "乳制品包括牛奶、奶酪和酸奶。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0708b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708b-repeat-q2.webp"}, {"en": "Freshly baked bread and pastries are available every day.", "zh": "每天都有新鲜出炉的面包和糕点供应。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0708b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708b-repeat-q3.webp"}, {"en": "The back aisle is where you can find the frozen food section.", "zh": "冷冻食品区在后面那条过道。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0708b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708b-repeat-q4.webp"}, {"en": "There are cashiers at the checkout counters near the exit.", "zh": "收银台位于出口附近的结账柜台。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0708b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708b-repeat-q5.webp"}, {"en": "Our weekly discounts are posted throughout the store and updated regularly.", "zh": "我们的每周折扣信息张贴在店内各处，并定期更新。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0708b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708b-repeat-q6.webp"}, {"en": "If you are unsure where to direct people, refer to this floor plan of the store.", "zh": "如果您不确定该引导顾客去哪里，请参考这份商店平面图。", "audio": "https://wofo.cc/toefl/speaking-media/Mark-piece-0708b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260708/piece-0708b-repeat-q7.webp"}]}, {"id": "mock-59", "n": 59, "en": "Art Gallery", "zh": "美术馆", "scenario": "You are working in an art gallery as part of an internship. Your manager is training you to help guide visitors around the gallery. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [8], "items": [{"en": "Visitors should enter through the front.", "zh": "访客应从前门进入。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0613-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260613/piece-0613-repeat-q1.webp"}, {"en": "Tickets can be purchased at reception.", "zh": "门票可在接待处购买。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0613-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260613/piece-0613-repeat-q2.webp"}, {"en": "You can leave your belongings in the coat checkroom free of charge.", "zh": "您可以将物品免费存放在衣帽间。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0613-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260613/piece-0613-repeat-q3.webp"}, {"en": "Each piece in the Modern Art Hall is labeled with details.", "zh": "现代艺术厅的每件作品都标有详细信息。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0613-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260613/piece-0613-repeat-q4.webp"}, {"en": "Our photography exhibit features work by student artists.", "zh": "我们的摄影展展示了学生艺术家的作品。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0613-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260613/piece-0613-repeat-q5.webp"}, {"en": "Restrooms are located in the corner of the gallery near the exit.", "zh": "洗手间位于画廊靠近出口的角落。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0613-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260613/piece-0613-repeat-q6.webp"}, {"en": "Our café offers coffee, tea, and a variety of sandwiches and treats.", "zh": "我们的咖啡馆提供咖啡、茶以及各种三明治和点心。", "audio": "https://wofo.cc/toefl/speaking-media/Veda-piece-0613-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260613/piece-0613-repeat-q7.webp"}]}, {"id": "mock-60", "n": 60, "en": "University Student Center", "zh": "大学学生中心", "scenario": "You are being trained at the university student center to help visitors navigate various resources. Listen to your manager and repeat what the manager says. Repeat only once.", "cats": [3], "items": [{"en": "The resource desk is near the entrance.", "zh": "资源台位于入口附近。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0711-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260711/piece-0711-repeat-q1.webp"}, {"en": "The lounge is a quiet space for studying.", "zh": "休息室是安静的学习空间。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0711-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260711/piece-0711-repeat-q2.webp"}, {"en": "You can access free printing and internet in the lab.", "zh": "你可以在实验室使用免费打印和网络。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0711-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260711/piece-0711-repeat-q3.webp"}, {"en": "Our multipurpose room is used for workshops and events.", "zh": "我们的多功能室用于研讨会和活动。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0711-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260711/piece-0711-repeat-q4.webp"}, {"en": "Please do not bring food from the café into other areas.", "zh": "请勿将咖啡厅的食物带入其他区域。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0711-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260711/piece-0711-repeat-q5.webp"}, {"en": "Check the bulletin board for daily announcements and activity schedules.", "zh": "请查看公告板了解每日公告和活动日程。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0711-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260711/piece-0711-repeat-q6.webp"}, {"en": "If anyone has questions, feel free to stop by the help desk near the exit.", "zh": "如有任何问题，欢迎前往出口附近的帮助台咨询。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0711-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260711/piece-0711-repeat-q7.webp"}]}, {"id": "mock-61", "n": 61, "en": "Indoor Plant Care", "zh": "室内植物养护", "scenario": "You are volunteering at the local community center for credit. Your supervisor is training you to teach children how to care for indoor plants. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [0], "items": [{"en": "This species is very easy to care for.", "zh": "这个品种非常容易照料。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0722b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722b-repeat-q1.webp"}, {"en": "Water it thoroughly once a week.", "zh": "每周彻底浇一次水。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0722b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722b-repeat-q2.webp"}, {"en": "Misting the leaves with a gentle spray helps them stay green.", "zh": "用温和的喷雾给叶子喷水有助于保持其翠绿。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0722b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722b-repeat-q3.webp"}, {"en": "Yellow leaves are a sign that it may be too cold for the plant.", "zh": "叶子发黄可能意味着对这株植物来说温度太低了。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0722b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722b-repeat-q4.webp"}, {"en": "Giving the plant nutrients monthly will help keep it healthy.", "zh": "每月为植物提供养分将有助于保持其健康。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0722b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722b-repeat-q5.webp"}, {"en": "Trim damaged leaves with clean scissors to encourage healthy growth.", "zh": "用干净的剪刀修剪受损的叶子，以促进健康生长。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0722b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722b-repeat-q6.webp"}, {"en": "Keep the plant near a sunny window, but protect it from strong direct light.", "zh": "将植物放在阳光充足的窗户附近，但要避免强烈的直射光。", "audio": "https://wofo.cc/toefl/speaking-media/Drew-piece-0722b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722b-repeat-q7.webp"}]}, {"id": "mock-62", "n": 62, "en": "Campus Dining Hall", "zh": "校园食堂", "scenario": "You are working at a campus dining hall. A shift supervisor is training you to explain your responsibilities to new student workers. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [3], "items": [{"en": "Check your schedule to confirm your work time.", "zh": "查看你的时间表以确认你的工作时间。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0722a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722a-repeat-q1.webp"}, {"en": "Arrive on time and be ready to start your shift.", "zh": "准时到达并准备好开始你的班次。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0722a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722a-repeat-q2.webp"}, {"en": "Learn the menu items at your station before service begins.", "zh": "在服务开始前，了解你岗位的菜单项目。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0722a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722a-repeat-q3.webp"}, {"en": "Use separate utensils for each dish during service.", "zh": "在服务期间，为每道菜使用不同的器具。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0722a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722a-repeat-q4.webp"}, {"en": "Maintain a friendly attitude when serving guests in the line.", "zh": "在排队为客人服务时，保持友好的态度。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0722a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722a-repeat-q5.webp"}, {"en": "After food service ends, you will need to stay thirty more minutes to help clean up.", "zh": "食品服务结束后，你需要再留三十分钟帮忙清理。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0722a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722a-repeat-q6.webp"}, {"en": "If you need time off, speak to your supervisor so your shift can be covered.", "zh": "如果你需要请假，跟你的主管说一声，这样你的班次就可以被顶替。", "audio": "https://wofo.cc/toefl/speaking-media/Luna-piece-0722a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260722/piece-0722a-repeat-q7.webp"}]}, {"id": "mock-63", "n": 63, "en": "Campus Library Resources", "zh": "校园图书馆资源", "scenario": "You are learning how to guide students in using the campus library resources effectively. Listen to the librarian and repeat what the librarian says. Repeat only once.", "cats": [5], "items": [{"en": "The public computers are in the corner.", "zh": "公共电脑在角落里。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0727b-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260727/piece-0727b-repeat-q1.webp"}, {"en": "The research help desk is near the entrance.", "zh": "研究咨询台就在入口附近。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0727b-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260727/piece-0727b-repeat-q2.webp"}, {"en": "Group tables are available for collaborative work.", "zh": "这里提供可供协作学习的小组桌。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0727b-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260727/piece-0727b-repeat-q3.webp"}, {"en": "You can print assignments using the machines located here.", "zh": "你可以使用这里的机器打印作业。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0727b-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260727/piece-0727b-repeat-q4.webp"}, {"en": "Newly released books are displayed near the window section.", "zh": "新出版的书籍陈列在靠窗区域。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0727b-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260727/piece-0727b-repeat-q5.webp"}, {"en": "Workshops, which include advanced searching tools, are offered by librarians.", "zh": "图书馆员开设包含高级检索工具的工作坊。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0727b-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260727/piece-0727b-repeat-q6.webp"}, {"en": "For additional research help, explore our online database tutorials.", "zh": "如需更多研究帮助，请查看我们的在线数据库教程。", "audio": "https://wofo.cc/toefl/speaking-media/Ben-piece-0727b-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260727/piece-0727b-repeat-q7.webp"}]}, {"id": "mock-64", "n": 64, "en": "Bakery Customer Service", "zh": "面包店客户服务", "scenario": "You are being trained to assist customers for your part-time job at a bakery. Your supervisor is teaching you how to describe different types of baked goods. Listen to the supervisor and repeat what the supervisor says. Repeat only once.", "cats": [2], "items": [{"en": "Our rolls are baked fresh every morning.", "zh": "我们的面包卷每天早上新鲜出炉。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0730a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260730/piece-0730a-repeat-q1.webp"}, {"en": "We have apple and blueberry muffins.", "zh": "我们有苹果味和蓝莓味的玛芬蛋糕。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0730a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260730/piece-0730a-repeat-q2.webp"}, {"en": "Our sourdough loaf has a wonderfully tangy flavor.", "zh": "我们的酸面包有一种美妙的微酸风味。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0730a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260730/piece-0730a-repeat-q3.webp"}, {"en": "Flatbreads pair well with various cheeses like cheddar or brie.", "zh": "扁面包搭配切达奶酪或布里奶酪等各种奶酪都很棒。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0730a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260730/piece-0730a-repeat-q4.webp"}, {"en": "Our cinnamon buns are soft and have a nice hint of sweetness.", "zh": "我们的肉桂卷松软可口，带有一丝甜味。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0730a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260730/piece-0730a-repeat-q5.webp"}, {"en": "Stop by and pick up breakfast options for your family and friends.", "zh": "欢迎光临，为您的家人朋友选购早餐。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0730a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260730/piece-0730a-repeat-q6.webp"}, {"en": "With its hearty seeds, rye bread works well for sandwiches or to serve with dinner.", "zh": "黑麦面包富含谷物，非常适合做三明治或作为晚餐的搭配。", "audio": "https://wofo.cc/toefl/speaking-media/Alexandra-piece-0730a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260730/piece-0730a-repeat-q7.webp"}]}, {"id": "mock-65", "n": 65, "en": "Campus Tour Guide", "zh": "校园导览", "scenario": "You are working at your university's visitor center. Your manager is training you to give campus tours to university students. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [3], "items": [{"en": "The tour begins at the main entrance.", "zh": "参观从主入口开始。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0413a-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260413/piece-0413a-repeat-q1.webp"}, {"en": "Our first stop is the campus library.", "zh": "我们的第一站是校园图书馆。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0413a-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260413/piece-0413a-repeat-q2.webp"}, {"en": "Next, we will visit the cafeteria for a brief lunch.", "zh": "接下来，我们将前往餐厅简单用餐。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0413a-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260413/piece-0413a-repeat-q3.webp"}, {"en": "This lecture hall is used for many physical science classes.", "zh": "这间讲堂用于许多物理科学课程。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0413a-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260413/piece-0413a-repeat-q4.webp"}, {"en": "This dormitory complex is where most first-year students live.", "zh": "这片宿舍区是大多数一年级学生居住的地方。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0413a-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260413/piece-0413a-repeat-q5.webp"}, {"en": "The Union Building has many events for everyone on weekday evenings.", "zh": "学生活动中心在工作日晚上为大家举办许多活动。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0413a-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260413/piece-0413a-repeat-q6.webp"}, {"en": "If you have any questions after the tour, visit the information booth.", "zh": "参观结束后如有任何问题，请到信息亭咨询。", "audio": "https://wofo.cc/toefl/speaking-media/Kristen-piece-0413a-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260413/piece-0413a-repeat-q7.webp"}]}, {"id": "mock-66", "n": 66, "en": "University Open House", "zh": "大学开放日", "scenario": "You are working at a university. Your manager is teaching you how to assist visitors of a university open-house event. Listen to the manager and repeat what the manager says. Repeat only once.", "cats": [3], "items": [{"en": "Visitors should check in when they arrive.", "zh": "访客到达时应先签到。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0209-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260209/piece-0209-repeat-q1.webp"}, {"en": "There are informational sessions scheduled.", "zh": "已安排信息说明会。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0209-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260209/piece-0209-repeat-q2.webp"}, {"en": "Student-led tours highlight what typical campus housing is like.", "zh": "由学生带领的参观活动展示典型校园住宿的样貌。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0209-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260209/piece-0209-repeat-q3.webp"}, {"en": "Meals and snacks are available for purchase for visitors.", "zh": "访客可以购买餐食和小吃。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0209-speaking-q4.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260209/piece-0209-repeat-q4.webp"}, {"en": "Guests are welcome to make use of the study areas.", "zh": "欢迎访客使用学习区域。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0209-speaking-q5.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260209/piece-0209-repeat-q5.webp"}, {"en": "Though the campus is large, the printed map includes every session and location.", "zh": "尽管校园很大，纸质地图标明了每场活动和地点。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0209-speaking-q6.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260209/piece-0209-repeat-q6.webp"}, {"en": "If you are free this afternoon, you can join one of the scheduled campus tours.", "zh": "如果你今天下午有空，可以参加一场已安排好的校园参观。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-0209-speaking-q7.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-20260209/piece-0209-repeat-q7.webp"}]}, {"id": "mock-67", "n": 67, "en": "Bread Baking Class", "zh": "面包烘焙课", "scenario": "You are learning to bake bread in a baking class. Listen to the instructor and repeat what the instructor says. Repeat only once.", "cats": [0], "items": [{"en": "Measure carefully before starting to mix.", "zh": "混合前仔细测量。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-07xb-speaking-q1.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xb-repeat-q1.webp"}, {"en": "Add yeast to a small amount of warm water.", "zh": "将酵母加入少量温水中。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-07xb-speaking-q2.m4a", "img": "https://wofo.cc/toefl/speaking-media/repeat-stimuli-2026-07-xx/piece-07xb-repeat-q2.webp"}, {"en": "Stir the wet and dry ingredients into a soft dough.", "zh": "将湿性和干性材料搅拌成柔软的面团。", "audio": "https://wofo.cc/toefl/speaking-media/Don-piece-07xb-speaking-q3.m4a", "img": "https://wofo.cc/toefl/speaking-media/repea
